site_name: CausaGanha
site_description: 'CausaGanha V2: Distributed Judicial Analysis Platform'
site_url: https://franklinbaldo.github.io/causaganha/
repo_url: https://github.com/franklinbaldo/causaganha
repo_name: franklinbaldo/causaganha
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 CausaGanha - MIT License

theme:
  name: material
  language: en
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: 'deep purple'
      accent: 'purple'
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: 'deep purple'
      accent: 'purple'
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 'Home': index.md
  - 'Product Requirements': product-requirements.md
  - 'Technical Design': technical-design.md
  - 'Roadmap': roadmap.md
  - 'Launch Plan': launch-plan.md
  - 'Backlog': backlog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/franklinbaldo/causaganha
      name: CausaGanha on GitHub
