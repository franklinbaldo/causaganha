repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # Disabled because of existing broken files in djen-scraper
      # - id: check-yaml
      # - id: check-json
      # - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
