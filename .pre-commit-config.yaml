repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # Run Ruff linter
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      # Run Ruff formatter
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^djen-scraper/dashboard/tsconfig.*\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
