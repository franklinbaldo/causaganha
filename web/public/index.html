<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CausaGanha — Consulta Aberta de Processos (DataJud)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="fzstd.umd.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --surface-elevated: #1e293b;
      --border: #1f2937;
      --border-strong: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-soft: rgba(56, 189, 248, 0.12);
      --accent: #10b981;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --warn: #f59e0b;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --radius: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top center, #131c31 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 1rem 3rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .brand-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; color: #fff; }
    .brand-sub { font-size: 0.8rem; color: var(--text-muted); }
    .arch-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Search Section */
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .search-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .search-box { display: flex; gap: 0.75rem; }
    .input-wrap { position: relative; flex: 1; }
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: #fff;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .btn-primary {
      background: var(--primary);
      color: #0b1120;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    .chips-group {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .chips-row {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .chips-title {
      font-size: 0.75rem;
      color: var(--text-subtle);
      font-weight: 600;
      margin-right: 0.25rem;
    }
    .chip {
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .chip:hover { border-color: var(--primary); color: #fff; background: var(--primary-soft); }
    .chip-recent { border-color: rgba(56, 189, 248, 0.35); color: var(--primary); }

    /* Feedback / Error / Loading Banner */
    .status-banner {
      display: none;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .status-banner.loading {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--primary);
    }
    .status-banner.error {
      display: flex;
      background: var(--danger-soft);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fecaca;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--primary-soft);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result Card */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: none;
      margin-bottom: 1.5rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    .process-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .process-id-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .process-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: -0.01em;
    }
    .btn-ghost {
      background: var(--surface-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ghost:hover { color: #fff; border-color: var(--primary); }
    .process-classe {
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.35rem;
    }
    .badges-instancias { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .inst-badge {
      background: var(--primary-soft);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--primary);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Metadata Grid */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 0.75rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .meta-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
    }
    .meta-item-lbl {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      font-weight: 700;
    }
    .meta-item-val {
      font-size: 0.88rem;
      color: var(--text);
      font-weight: 600;
      margin-top: 0.15rem;
      word-break: break-word;
    }

    /* Tabs & Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .tabs-nav {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--bg);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: #fff; border-color: var(--primary); }
    .tab-btn.active {
      background: var(--primary);
      color: #0b1120;
      border-color: var(--primary);
    }
    .tab-count {
      font-size: 0.7rem;
      padding: 0.05rem 0.4rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
    }
    .tab-btn.active .tab-count {
      background: rgba(11, 17, 32, 0.2);
      color: #0b1120;
    }
    .tab-btn.tab-djen {
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }
    .tab-btn.tab-djen.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }
    .timeline-link {
      display: inline-block;
      margin-top: 0.45rem;
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .timeline-link:hover { text-decoration: underline; }

    .timeline-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-input {
      background: var(--bg) !important;
      border: 1px solid var(--border-strong) !important;
      padding: 0.42rem 0.75rem !important;
      font-size: 0.82rem !important;
      font-family: inherit !important;
      width: 210px !important;
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 1.65rem;
      border-left: 2px solid var(--border-strong);
      margin-left: 0.4rem;
    }
    .timeline-item {
      position: relative;
      margin-bottom: 1.25rem;
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-point {
      position: absolute;
      left: -2.1rem;
      top: 1.05rem;
      width: 11px;
      height: 11px;
      background: var(--primary);
      border-radius: 50%;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 2px var(--border-strong);
    }
    .timeline-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .timeline-date {
      font-size: 0.76rem;
      color: var(--primary);
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .timeline-orgao {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .timeline-title {
      font-size: 0.98rem;
      font-weight: 600;
      color: #fff;
      margin-top: 0.25rem;
    }
    .comp-list {
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .comp-box {
      background: rgba(30, 41, 59, 0.8);
      border-left: 3px solid var(--accent);
      padding: 0.35rem 0.65rem;
      border-radius: 0 6px 6px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .comp-box strong { color: var(--text); }

    /* Collapsible Technical Telemetry */
    details.tech-drawer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.25rem;
    }
    details.tech-drawer summary {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      list-style: none;
      user-select: none;
    }
    details.tech-drawer summary::-webkit-details-marker { display: none; }
    details.tech-drawer summary:hover { color: #fff; }
    .summary-stats {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      color: var(--accent);
    }
    .tech-body { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .metric-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      text-align: center;
    }
    .metric-val { font-size: 1.25rem; font-weight: 800; color: var(--primary); }
    .metric-val.green { color: var(--accent); }
    .metric-lbl {
      font-size: 0.68rem;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.15rem;
    }

    .execution-log {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.76rem;
      max-height: 170px;
      overflow-y: auto;
    }
    .log-line { margin-bottom: 0.3rem; display: flex; align-items: baseline; gap: 0.5rem; }
    .log-badge {
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-route { background: #1e3a8a; color: #93c5fd; }
    .badge-range { background: #065f46; color: #6ee7b7; }
    .badge-cache { background: #78350f; color: #fcd34d; }
    .badge-wasm { background: #4c1d95; color: #ddd6fe; }
    .badge-err { background: #7f1d1d; color: #fecaca; }

    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .search-box { flex-direction: column; }
      .filter-input { width: 100% !important; }
      .process-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <a class="brand" href="./">
        <img src="favicon.svg" alt="Logo CausaGanha">
        <div>
          <div class="brand-title">CausaGanha</div>
          <div class="brand-sub">Consulta aberta de processos judiciais (DataJud + DJEN)</div>
        </div>
      </a>
      <span class="arch-pill">Zero-Backend • HTTP Range + Zstd + DuckDB-WASM</span>
    </header>

    <!-- Busca -->
    <section class="search-card" aria-label="Consulta de processo">
      <label class="search-label" for="cnj-input">Número do Processo (CNJ)</label>
      <div class="search-box">
        <div class="input-wrap">
          <input type="text" id="cnj-input" placeholder="0000000-00.0000.0.00.0000" value="7000779-70.2026.8.22.0021" autocomplete="off">
        </div>
        <button class="btn-primary" id="btn-search">Consultar</button>
      </div>

      <div class="chips-group">
        <div class="chips-row" id="recent-row" style="display:none">

        <div class="chips-row">

          <button class="chip" data-cnj="7000779-70.2026.8.22.0021">TJRO 2026 • Recurso Inominado</button>
          <button class="chip" data-cnj="7003809-64.2026.8.22.0005">TJRO 2026 • Apelação Cível</button>
          <button class="chip" data-cnj="7012333-62.2026.8.22.0001">TJRO 2026 • Embargos</button>
          <button class="chip" data-cnj="0001311-51.2024.8.13.0647">TJMG G1/G2 + STJ</button>
          <button class="chip" data-cnj="0012397-92.2012.8.26.0577">TJSP G1/G2 + STJ</button>
        </div>
      </div>
    </section>

    <!-- Estado de carregamento / erro -->
    <div class="status-banner" id="status-banner" role="status" aria-live="polite"></div>

    <!-- Resultado do Processo -->
    <main class="result-card" id="result-card">
      <div class="process-header">
        <div>
          <div class="process-id-row">
            <h1 class="process-title" id="res-cnj">0000000-00.0000.0.00.0000</h1>
            <button class="btn-ghost" id="btn-copy-cnj" title="Copiar número CNJ">Copiar CNJ</button>
            <button class="btn-ghost" id="btn-copy-link" title="Copiar link direto">Copiar Link</button>
          </div>
          <div class="process-classe" id="res-classe"></div>
        </div>
        <div class="badges-instancias" id="res-badges"></div>
      </div>

      <div class="meta-grid" id="meta-grid"></div>

      <div class="toolbar">
        <div class="tabs-nav" id="tabs-nav"></div>
        <div class="timeline-controls">
          <input type="text" id="filter-movs" class="filter-input" placeholder="Filtrar movimentos...">
          <button class="btn-ghost" id="btn-sort" title="Alternar ordem cronológica">Mais recentes ↓</button>
          <button class="btn-ghost" id="btn-export-json" title="Baixar JSON completo">Baixar JSON</button>
        </div>
      </div>

      <div class="timeline" id="timeline"></div>
    </main>

    <!-- Telemetria Técnica Recolhível -->
    <details class="tech-drawer" id="tech-drawer">
      <summary>
        <span>Detalhes técnicos e telemetria HTTP Range</span>
        <span class="summary-stats" id="summary-stats">Pronto</span>
      </summary>
      <div class="tech-body">
        <div class="telemetry-grid">
          <div class="metric-card">
            <div class="metric-val" id="metric-http-count">0</div>
            <div class="metric-lbl">Requisições HTTP</div>
          </div>
          <div class="metric-card">
            <div class="metric-val green" id="metric-bytes">0 B</div>
            <div class="metric-lbl">Dados Transferidos</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="metric-latency">0 ms</div>
            <div class="metric-lbl">Latência de Rede</div>
          </div>
          <div class="metric-card">
            <div class="metric-val" id="metric-decomp">0 ms</div>
            <div class="metric-lbl">Descompressão WASM</div>
          </div>
        </div>
        <div class="execution-log" id="execution-log"></div>
      </div>
    </details>
  </div>

  <script>
    const RECENT_KEY = 'causaganha_recent_cnjs';
    const indexCache = new Map();
    let catalogoTPU = null;
    let currentDoc = null;
    let currentFullData = null;
    let currentViewMode = 'datajud'; // 'datajud' | 'djen'
    let currentDjenRows = [];
    let currentDjenStatus = 'idle'; // 'idle' | 'loading' | 'ready' | 'error'
    let currentDjenError = '';
    let sortDesc = true;

    let dbInstance = null;
    let connInstance = null;
    let duckdbInitPromise = null;

    async function getDuckDB() {
      if (dbInstance && connInstance) {
        return { db: dbInstance, conn: connInstance };
      }
      if (duckdbInitPromise) {
        return duckdbInitPromise;
      }
      duckdbInitPromise = (async () => {
        try {
          const t0 = performance.now();
          log('DUCKDB WASM', 'badge-wasm', 'Inicializando motor DuckDB-WASM (jsDelivr CDN)...');
          const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm/+esm');
          const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
          const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
          if (!bundle.mainWorker) {
            throw new Error('DuckDB bundle selection failed: No mainWorker found.');
          }
          let worker;
          try {
            worker = new Worker(bundle.mainWorker);
          } catch (_) {
            const response = await fetch(bundle.mainWorker);
            const content = await response.text();
            const blob = new Blob([content], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));
          }
          const logger = new duckdb.ConsoleLogger();
          dbInstance = new duckdb.AsyncDuckDB(logger, worker);
          await dbInstance.instantiate(bundle.mainModule, bundle.pthreadWorker);
          connInstance = await dbInstance.connect();
          await connInstance.query("INSTALL httpfs; LOAD httpfs;");
          await connInstance.query("SET enable_http_metadata_cache=true;");
          const t1 = performance.now();
          log('HTTPFS OK', 'badge-wasm', `DuckDB-WASM + httpfs prontos em ${(t1 - t0).toFixed(0)} ms.`);
          return { db: dbInstance, conn: connInstance };
        } catch (err) {
          duckdbInitPromise = null;
          throw err;
        }
      })();
      return duckdbInitPromise;
    }

    async function consultarDjenDuckDB(tribunalSigla, ano, cnjLimpo) {
      currentDjenRows = [];
      currentDjenStatus = 'loading';
      currentDjenError = '';
      atualizarAbaDjen();

      const trib = (tribunalSigla || '').toLowerCase();
      if (!trib || !ano) {
        currentDjenStatus = 'ready';
        atualizarAbaDjen();
        return;
      }

      const parquetUrl = `https://archive.org/download/djen-${trib}-${ano}/comunicacoes.parquet`;
      try {
        const { conn } = await getDuckDB();
        const t0 = performance.now();
        log('PARQUET DJEN', 'badge-range', `Consultando ${parquetUrl} (numero_processo = '${cnjLimpo}')...`);
        const stmt = await conn.prepare(`
          SELECT
            CAST(data_disponibilizacao AS VARCHAR) AS data_disponibilizacao,
            tipo_comunicacao,
            nome_orgao,
            nome_classe,
            meio,
            numero_comunicacao,
            link,
            texto_id
          FROM read_parquet('${parquetUrl}')
          WHERE numero_processo = ?
          ORDER BY data_disponibilizacao DESC
        `);
        try {
          const res = await stmt.query(cnjLimpo);
          currentDjenRows = res.toArray().map(r => r.toJSON());
        } finally {
          await stmt.close();
        }
        const t1 = performance.now();
        currentDjenStatus = 'ready';
        log('DJEN OK', 'badge-range', `${currentDjenRows.length} publicação(ões) DJEN lida(s) via Parquet httpfs em ${(t1 - t0).toFixed(0)} ms.`);
      } catch (err) {
        currentDjenStatus = 'error';
        currentDjenError = err && err.message ? err.message : String(err);
        log('DJEN AVISO', 'badge-err', `Parquet DJEN (${trib}-${ano}): ${currentDjenError}`);
      }
      atualizarAbaDjen();
      if (currentViewMode === 'djen') {
        renderizarPublicacoesDjen();
      }
    }

    function formatCnj(digits) {
      if (digits.length !== 20) return digits;
      return `${digits.slice(0, 7)}-${digits.slice(7, 9)}.${digits.slice(9, 13)}.${digits[13]}.${digits.slice(14, 16)}.${digits.slice(16, 20)}`;
    }

    function formatCompactDate(da) {
      if (!da || da.length < 8) return 'Não informada';
      const y = da.slice(0, 4), m = da.slice(4, 6), d = da.slice(6, 8);
      if (da.length >= 12) {
        return `${d}/${m}/${y} ${da.slice(8, 10)}:${da.slice(10, 12)}`;
      }
      return `${d}/${m}/${y}`;
    }

    function formatIsoBr(iso) {
      if (!iso) return 'Não informada';
      const dt = new Date(iso);
      if (Number.isNaN(dt.getTime())) return iso;
      return dt.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    }

    function parseCNJ(cnj) {
      const digits = cnj.replace(/\D/g, '');
      if (digits.length === 20) {
        const ano = digits.slice(9, 13);
        const j_tr = `${digits[13]}.${digits.slice(14, 16)}`;
        return { valid: true, j_tr, ano, cnjFormatado: formatCnj(digits), cnjLimpo: digits };
      }
      return { valid: false, j_tr: '', ano: '', cnjFormatado: cnj, cnjLimpo: digits };
    }

    async function carregarCatalogoTPU() {
      if (!catalogoTPU) {

        for (const t of data.tipos) {

    }

    async function buscarProcesso(cnjBusca) {
      logBox.textContent = '';
      resultCard.style.display = 'none';
      filterMovs.value = '';

      const parsed = parseCNJ(cnjBusca);
      if (!parsed.valid) {
        setStatus('error', 'Número CNJ inválido. Informe exatamente 20 dígitos (ex: 7000779-70.2026.8.22.0021).');
        return;
      }

      const { j_tr, ano, cnjLimpo, cnjFormatado } = parsed;
      cnjInput.value = cnjFormatado;
      btnSearch.disabled = true;
      setStatus('loading', `Consultando processo ${cnjFormatado}...`);

      try {
        const url = new URL(window.location.href);
        url.searchParams.set('cnj', cnjFormatado);
        history.replaceState(null, '', url.toString());
      } catch (_) {}

      let httpRequests = 0;
      let totalBytesTransferidos = 0;
      let totalLatency = 0;

      log('ROTEADOR', 'badge-route', `CNJ ${cnjFormatado} -> Partição ${j_tr}_${ano}`);

      const indexKey = `${j_tr}_${ano}`;
      let indexData = null;

      if (indexCache.has(indexKey)) {
        log('CACHE HIT', 'badge-cache', `Micro-índice ${indexKey}.json em cache local (0 HTTP requests).`);
        indexData = indexCache.get(indexKey);
      } else {
        const t0 = performance.now();
        log('REQ 1: ÍNDICE', 'badge-route', `Buscando indexes/${indexKey}.json...`);
        try {
          const resp = await fetch(`indexes/${indexKey}.json`);
          if (!resp.ok) throw new Error(`Partição ${j_tr} (${ano}) ainda não disponível no acervo.`);
          const rawText = await resp.text();
          const t1 = performance.now();
          httpRequests++;
          totalBytesTransferidos += rawText.length;
          totalLatency += (t1 - t0);
          indexData = JSON.parse(rawText);
          indexCache.set(indexKey, indexData);
          log('REQ 1: OK', 'badge-route', `Índice carregado em ${(t1 - t0).toFixed(1)} ms (${rawText.length} B).`);
        } catch (err) {
          log('ERRO', 'badge-err', err.message);
          setStatus('error', err.message);
          btnSearch.disabled = false;
          return;
        }
      }

      const meta = indexData.processos.find(p => p.cnj.replace(/\D/g, '') === cnjLimpo);
      if (!meta) {
        const msg = `O processo ${cnjFormatado} não foi localizado na partição ${indexKey}.`;
        log('NÃO ENCONTRADO', 'badge-err', msg);
        setStatus('error', msg);
        btnSearch.disabled = false;
        return;
      }

      log('LOCALIZADO', 'badge-range', `Shard: ${meta.shard}, Offset: ${meta.offset}, Tamanho: ${meta.length} B`);

      const tRange0 = performance.now();
      log('REQ 2: RANGE', 'badge-range', `HTTP Range: bytes=${meta.offset}-${meta.offset + meta.length - 1}`);

      let zstdBytes = null;
      try {
        const respRange = await fetch(meta.shard, {
          headers: { 'Range': `bytes=${meta.offset}-${meta.offset + meta.length - 1}` }
        });
        if (respRange.status !== 206 && respRange.status !== 200) {
          throw new Error(`Servidor respondeu HTTP ${respRange.status} para Range request.`);
        }
        const buf = await respRange.arrayBuffer();
        const tRange1 = performance.now();
        httpRequests++;
        totalBytesTransferidos += buf.byteLength;
        totalLatency += (tRange1 - tRange0);
        zstdBytes = new Uint8Array(buf);
        log('REQ 2: OK', 'badge-range', `HTTP ${respRange.status}: ${buf.byteLength} B em ${(tRange1 - tRange0).toFixed(1)} ms.`);
      } catch (err) {
        log('ERRO RANGE', 'badge-err', err.message);
        setStatus('error', `Erro ao baixar fatia do processo: ${err.message}`);
        btnSearch.disabled = false;
        return;
      }

      const tDecomp0 = performance.now();
      let decompressedJson = null;
      let decompTime = '0.00';
      try {
        const decompressedBytes = fzstd.decompress(zstdBytes);
        const jsonStr = new TextDecoder().decode(decompressedBytes);
        decompressedJson = JSON.parse(jsonStr);
        const tDecomp1 = performance.now();
        decompTime = (tDecomp1 - tDecomp0).toFixed(2);
        log('WASM ZSTD', 'badge-wasm', `Descompressão em ${decompTime} ms (${zstdBytes.length} B -> ${decompressedBytes.length} B).`);
      } catch (err) {
        log('ERRO DECOMP', 'badge-err', `Falha Zstandard: ${err.message}`);
        setStatus('error', `Falha ao descomprimir processo: ${err.message}`);
        btnSearch.disabled = false;
        return;
      }

      const kb = (totalBytesTransferidos / 1024).toFixed(1);
      const lat = totalLatency.toFixed(0);
      mHttpCount.textContent = httpRequests;
      mBytes.textContent = `${kb} KB`;
      mLatency.textContent = `${lat} ms`;
      mDecomp.textContent = `${decompTime} ms`;
      summaryStats.textContent = `${httpRequests} req(s) • ${kb} KB • ${lat} ms`;

      await carregarCatalogoTPU();
      saveRecent(cnjFormatado);
      setStatus(null);
      btnSearch.disabled = false;
      currentViewMode = 'datajud';
      renderizarProcesso(meta, decompressedJson, cnjFormatado);
      consultarDjenDuckDB(meta.tribunal, ano, cnjLimpo);
    }

    function renderizarPublicacoesDjen() {
      const timeline = document.getElementById('timeline');
      timeline.textContent = '';

      if (currentDjenStatus === 'loading') {
        const msg = document.createElement('p');
        msg.style.color = 'var(--primary)';
        msg.style.fontSize = '0.9rem';
        msg.textContent = 'Inicializando DuckDB-WASM (httpfs) e consultando Parquet do DJEN no Internet Archive...';
        timeline.appendChild(msg);
        return;
      }

      if (currentDjenStatus === 'error') {
        const errBox = document.createElement('div');
        errBox.className = 'comp-box';
        errBox.style.borderLeftColor = 'var(--danger)';
        const strong = document.createElement('strong');
        strong.textContent = 'Falha ao consultar Parquet DJEN via DuckDB-WASM (httpfs): ';
        errBox.appendChild(strong);
        errBox.appendChild(document.createTextNode(currentDjenError));
        timeline.appendChild(errBox);
        return;
      }

      const query = filterMovs.value.trim().toLowerCase();
      let rows = [...currentDjenRows];
      if (!sortDesc) rows.reverse();

      if (query) {
        rows = rows.filter(r => {
          const tipo = String(r.tipo_comunicacao || '').toLowerCase();
          const orgao = String(r.nome_orgao || '').toLowerCase();
          const classe = String(r.nome_classe || '').toLowerCase();
          return tipo.includes(query) || orgao.includes(query) || classe.includes(query);
        });
      }

      if (rows.length === 0) {
        const empty = document.createElement('p');
        empty.style.color = 'var(--text-muted)';
        empty.style.fontSize = '0.88rem';
        empty.textContent = query
          ? 'Nenhuma publicação DJEN corresponde ao filtro.'
          : 'Nenhuma publicação DJEN encontrada no Parquet para este processo.';
        timeline.appendChild(empty);
        return;
      }

      for (const r of rows) {
        const div = document.createElement('div');
        div.className = 'timeline-item';

        const dot = document.createElement('div');
        dot.className = 'timeline-point';
        dot.style.background = 'var(--accent)';
        div.appendChild(dot);

        const top = document.createElement('div');
        top.className = 'timeline-top';

        const dateEl = document.createElement('span');
        dateEl.className = 'timeline-date';
        dateEl.style.color = 'var(--accent)';
        dateEl.textContent = r.data_disponibilizacao ? String(r.data_disponibilizacao) : 'Data não informada';
        top.appendChild(dateEl);

        if (r.nome_orgao) {
          const orgEl = document.createElement('span');
          orgEl.className = 'timeline-orgao';
          orgEl.textContent = String(r.nome_orgao);
          top.appendChild(orgEl);
        }
        div.appendChild(top);

        const titleEl = document.createElement('div');
        titleEl.className = 'timeline-title';
        titleEl.textContent = `${r.tipo_comunicacao || 'Comunicação DJEN'} — ${r.nome_classe || ''}`;
        div.appendChild(titleEl);

        const compList = document.createElement('div');
        compList.className = 'comp-list';

        if (r.numero_comunicacao || r.meio) {
          const box = document.createElement('div');
          box.className = 'comp-box';
          box.textContent = `Comunicação nº ${r.numero_comunicacao || '-'} • Meio: ${r.meio || 'D'}`;
          compList.appendChild(box);
        }

        if (r.link) {
          const a = document.createElement('a');
          a.className = 'timeline-link';
          a.href = String(r.link);
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = 'Abrir documento / certidão no PJe ↗';
          compList.appendChild(a);
        }

        div.appendChild(compList);
        timeline.appendChild(div);
      }
    }

    function renderizarMovimentos(doc) {
      const timeline = document.getElementById('timeline');
      timeline.textContent = '';

      const query = filterMovs.value.trim().toLowerCase();
      let movs = [...(doc.m || [])];
      if (sortDesc) movs.reverse();

      if (query) {
        movs = movs.filter(item => {
          const [tipoId, , orgao] = item;
          const template = catalogoTPU.get(tipoId);
          const nome = (template && template.nome ? template.nome : `Movimento ${tipoId}`).toLowerCase();
          const org = (orgao && orgao[1] ? orgao[1] : '').toLowerCase();
          return nome.includes(query) || org.includes(query);
        });
      }

      if (movs.length === 0) {
        const empty = document.createElement('p');
        empty.style.color = 'var(--text-muted)';
        empty.style.fontSize = '0.88rem';
        empty.textContent = query ? 'Nenhuma movimentação corresponde ao filtro.' : 'Nenhuma movimentação registrada.';
        timeline.appendChild(empty);
        return;
      }

      for (const item of movs) {
        const [tipoId, dataHora, orgao, valores] = item;
        const template = catalogoTPU.get(tipoId) || { nome: `Movimento ${tipoId}`, complementos: [] };

        const div = document.createElement('div');
        div.className = 'timeline-item';

        const dot = document.createElement('div');
        dot.className = 'timeline-point';
        div.appendChild(dot);

        const top = document.createElement('div');
        top.className = 'timeline-top';

        const dateEl = document.createElement('span');
        dateEl.className = 'timeline-date';
        dateEl.textContent = dataHora ? formatIsoBr(dataHora) : 'Data não informada';
        top.appendChild(dateEl);

        if (orgao && orgao[1]) {
          const orgEl = document.createElement('span');
          orgEl.className = 'timeline-orgao';
          orgEl.textContent = orgao[1];
          top.appendChild(orgEl);
        }
        div.appendChild(top);

        const titleEl = document.createElement('div');
        titleEl.className = 'timeline-title';
        titleEl.textContent = template.nome || 'Andamento Processual';
        div.appendChild(titleEl);

        if (template.complementos && template.complementos.length > 0) {
          const compList = document.createElement('div');
          compList.className = 'comp-list';
          template.complementos.forEach((c, cIdx) => {
            const box = document.createElement('div');
            box.className = 'comp-box';
            const lbl = c.nome || c.descricao || 'Complemento';
            box.appendChild(document.createTextNode(lbl));
            if (valores && valores[cIdx] !== undefined) {
              box.appendChild(document.createTextNode(': '));
              const strong = document.createElement('strong');
              strong.textContent = String(valores[cIdx]);
              box.appendChild(strong);
            }
            compList.appendChild(box);
          });
          div.appendChild(compList);
        }

        timeline.appendChild(div);
      }
    }

    document.querySelectorAll('.chip[data-cnj]').forEach(chip => {
      chip.addEventListener('click', () => {
        const cnj = chip.getAttribute('data-cnj');
        cnjInput.value = cnj;
        buscarProcesso(cnj);
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderRecents();
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get('cnj');
      if (fromUrl) cnjInput.value = fromUrl;
      buscarProcesso(cnjInput.value);
    });
  </script>
</body>
</html>
