  <circle cx="100" cy="80" r="12" fill="#1A6B3C" opacity="0.6"/>
  <circle cx="85" cy="110" r="8" fill="#C5972C" opacity="0.5"/>
  <circle cx="115" cy="110" r="8" fill="#C5972C" opacity="0.5"/>
  <!-- Small tile accents -->
  <rect x="5" y="175" width="20" height="20" fill="#1A6B3C" opacity="0.2"/>
  <rect x="30" y="175" width="20" height="20" fill="#C5972C" opacity="0.2"/>
  <rect x="150" y="175" width="20" height="20" fill="#C5972C" opacity="0.2"/>
  <rect x="175" y="175" width="20" height="20" fill="#1A6B3C" opacity="0.2"/>
</svg>
