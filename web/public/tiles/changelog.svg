<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Changelog: Timeline with branching nodes — git/version history -->
  <rect width="200" height="200" fill="#FAFAF5"/>
  <!-- Main vertical line -->
  <line x1="50" y1="10" x2="50" y2="190" stroke="#1A6B3C" stroke-width="3"/>
  <!-- Nodes -->
  <circle cx="50" cy="30" r="8" fill="#1A6B3C"/>
  <circle cx="50" cy="80" r="8" fill="#C5972C"/>
  <circle cx="50" cy="130" r="8" fill="#1A6B3C"/>
  <circle cx="50" cy="175" r="6" fill="#1A6B3C" opacity="0.4"/>
  <!-- Branch lines -->
  <line x1="50" y1="30" x2="130" y2="30" stroke="#1A6B3C" stroke-width="2"/>
  <line x1="50" y1="80" x2="150" y2="80" stroke="#C5972C" stroke-width="2"/>
  <line x1="50" y1="130" x2="110" y2="130" stroke="#1A6B3C" stroke-width="2"/>
  <!-- Branch labels (bars) -->
  <rect x="75" y="20" width="65" height="8" fill="#1A6B3C" opacity="0.3" rx="2"/>
  <rect x="75" y="34" width="45" height="6" fill="#1A6B3C" opacity="0.15" rx="2"/>
  <rect x="75" y="70" width="80" height="8" fill="#C5972C" opacity="0.3" rx="2"/>
  <rect x="75" y="84" width="55" height="6" fill="#C5972C" opacity="0.15" rx="2"/>
  <rect x="75" y="120" width="50" height="8" fill="#1A6B3C" opacity="0.3" rx="2"/>
  <rect x="75" y="134" width="35" height="6" fill="#1A6B3C" opacity="0.15" rx="2"/>
  <!-- Decorative corner tiles -->
  <rect x="155" y="150" width="18" height="18" fill="#C5972C" opacity="0.2"/>
  <rect x="178" y="150" width="18" height="18" fill="#1A6B3C" opacity="0.2"/>
  <rect x="155" y="173" width="18" height="18" fill="#1A6B3C" opacity="0.2"/>
  <rect x="178" y="173" width="18" height="18" fill="#C5972C" opacity="0.2"/>
</svg>
