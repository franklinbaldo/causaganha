# Ruff configuration for CausaGanha v2
# Strict mode: ALL rules enabled

target-version = "py312"
line-length = 100

[lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing comma - conflicts with ruff formatter
    "ISC001",  # implicit string concat - conflicts with ruff formatter
]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["causaganha", "djen_backup"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.pylint]
max-args = 8
max-branches = 12
max-returns = 8
max-statements = 50

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
