# Ruff configuration for CausaGanha v2
# Strict mode: ALL rules enabled

target-version = "py312"
line-length = 100

# marimo notebooks (notebooks/*.py) are authored in marimo's own cell format
# and embed Colab-only snippets (userdata, try/except Exception). They are not
# hand-maintained source and their committed .ipynb is verified separately by
# scripts/check_notebooks_synced.py — so keep ruff (lint + format) out of them,
# same as experiments/.
extend-exclude = ["notebooks"]

[lint]
select = ["ALL"]
ignore = [
    # ── Formatter-incompatible (required by ruff format) ──
    "COM812",   # trailing commas
    "ISC001",   # implicit string concatenation

    # ── Development hygiene: TODOs are tracked in issues ──
    "FIX002",   # line-contains-todo

    # ── pandas-vet is moot: pandas is banned repo-wide (see banned-api
    # below). ibis uses `.notnull()`, which PD004 wrongly flags as a
    # pandas idiom — drop the rule rather than ignore it per-file. ──
    "PD004",    # .notna preferred over .notnull — ibis uses .notnull()
]

[lint.per-file-ignores]
"vulture_whitelist.py" = ["B018", "F821"]

# generate-data.py: filename uses a dash (required by existing callers); both
# functions are intentionally monolithic data-generation routines that would
# need substantial refactoring to reduce cyclomatic complexity.
"scripts/web/generate-data.py" = ["N999", "C901", "PLR0912", "PLR0915"]

# ── djen_backup engine ────────────────────────────────────────────────────
# run_pipeline/checker_worker/upload_worker are intentionally monolithic
# (acknowledged in CLAUDE.md). PLC0415: conditional/lazy imports are used
# for optional deps (rich, tqdm). SLF001: engine accesses manifest internals
# by design. ERA001: one commented-out debug line; acceptable in pipeline code.
# B023: loop var captured in closure (existing suppression kept).
"src/djen_backup/engine.py" = ["B023", "C901", "PLR0912", "PLR0915", "PLC0415", "SLF001", "ERA001"]

# ── djen_backup __main__ ──────────────────────────────────────────────────
# B008: typer.Option() in default args is the idiomatic Typer pattern.
"src/djen_backup/__main__.py" = ["B008"]

# ── causaganha CLI ────────────────────────────────────────────────────────
# E402: lazy imports for fast CLI startup (import-heavy deps deferred).
# C901/PLR0912/PLR0915: large CLI dispatch functions; refactor deferred.
# S608: legacy f-string queries against DuckDB — table/column names are
# internal constants, no user input reaches the SQL. Re-audit when touched.
"src/causaganha/cli/__init__.py" = ["E402", "C901", "PLR0912", "PLR0915", "S608"]
"src/causaganha/cli/commands/backfill.py" = ["B008"]

# ── Lazy / conditional imports in library modules ─────────────────────────
# These modules defer expensive imports to avoid slowing every process start.
"src/causaganha/pipeline/ia_s3.py" = ["E402", "S608", "S324"]
"src/causaganha/pipeline/collect.py" = ["E402"]
"src/causaganha/pipeline/score.py" = ["E402"]
"src/causaganha/clients/archive.py" = ["E402"]
"src/causaganha/consolidate/transforms.py" = ["E402", "S608"]
"src/causaganha/consolidate/candidates.py" = ["E402", "S608"]
"src/causaganha/pipeline/models.py" = ["E402"]
"src/causaganha/storage/migrations.py" = ["E402"]
"src/djen_backup/djen.py" = ["E402"]

# ── Legacy S608 / security-adjacent violations, locked in per file ────────
# Goal: keep the narrowed `ruff check --select BLE001,S,TRY300` gate green
# today, while blocking new violations in clean files. Fix and remove from
# this list when touching the file. S608 here is internal query-builder
# f-strings (DuckDB/ibis, trusted inputs); S324 is MD5 for non-crypto
# checksums; S108 is a hardcoded tmp path (audit on cleanup); S101 is an
# assert in archive.py that should become a real check.
"src/causaganha/consolidate/manifest_reader.py" = ["S608"]
"src/causaganha/consolidate/validation.py" = ["S608"]
"src/causaganha/storage/embedding_storage.py" = ["S608"]
"src/causaganha/catalog/creator.py" = ["S608"]
"src/causaganha/analysis/ground_truth.py" = ["S608"]
"src/causaganha/archival/cold_storage.py" = ["S108"]
"src/djen_backup/drain.py" = ["S608", "TRY300"]

# ── Tests ──────────────────────────────────────────────────────────────────
# assert is idiomatic pytest; no docstrings/type-hints required; private access
# and magic-value comparisons are normal in test code.
"tests/**/*.py" = [
    "S101",             # assert
    "D100", "D101", "D102", "D103", "D104", "D205",  # missing docstrings
    "ANN001", "ANN201", "ANN202", "ANN401",  # missing type annotations
    "PLR2004",          # magic value comparison
    "ARG001",           # unused function argument (fixtures pass unused args)
    "INP001",           # implicit namespace package
    "PLC0415",          # import outside top-level (test helpers use local imports)
    "SLF001",           # private member access
    "E402",             # module import not at top (dynamic imports in tests)
    "SIM108",           # ternary expressions not required
    "S608",             # f-string SQL (DuckDB with tmp_path, no user input)
]

# ── Scripts ────────────────────────────────────────────────────────────────
# Pipeline/utility scripts: print() is intentional output; monolithic structure
# is acceptable; no public API so docstrings and type hints not required.
# E402 covers sys.path manipulation that must precede imports in entry scripts.
"scripts/**/*.py" = [
    "T201",             # print (intentional pipeline output)
    "D100", "D103",     # missing docstrings (internal scripts)
    "ANN001", "ANN201", "ANN202",  # missing type annotations
    "E402",             # module import not at top (sys.path setup before imports)
    "C901",             # too complex (monolithic data-pipeline functions)
    "PLR2004",          # magic value comparison
    "PLR0912",          # too many branches
    "PLR0915",          # too many statements
    "PLR0911",          # too many return statements
    "SLF001",           # private member access
    "EXE001",           # shebang not executable (CI runs via uv run, not directly)
    "PLW1510",          # subprocess.run without explicit check=
    "ASYNC240",         # blocking-path-method-in-async-function (scripts: one-shot jobs, overhead fine)
    "ASYNC230",         # blocking-open-call-in-async-function (same reason)
    # Script-side security-adjacent rules: these are operational tools that
    # build SQL from internal constants, fetch known URLs (IA manifests),
    # and shell out to known binaries. Treated as lower-risk than src/**
    # which stays strict. Re-audit if a script ever takes user input.
    "S608",             # f-string SQL (internal table/column names)
    "S310",             # urlopen (known archive.org URLs)
    "S603",             # subprocess without shell=False
    "S607",             # subprocess with partial exec path
    "S324",             # non-crypto hash (md5 for file checksums)
    "S112",             # try/except/continue
    "S110",             # try/except/pass
    "S108",             # hardcoded /tmp path
    "S101",             # assert (used as contract in scripts)
    "BLE001",           # blind Exception catch (pragmatic in one-shot scripts; src/** stays strict)
    "TRY300",           # try/else restructure (style, scripts don't benefit much)
    "S311",             # pseudo-random (diagnostic sampling, not crypto)
]

# ── Experiments ────────────────────────────────────────────────────────────
# Research/exploratory notebooks — not production code; all rules relaxed.
"experiments/**/*.py" = ["ALL"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["causaganha", "djen_backup"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-tidy-imports.banned-api]
"pandas" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}
"pandas.core" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}
"pandas.DataFrame" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.pylint]
max-args = 13
max-branches = 12
max-returns = 8
max-statements = 50

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
