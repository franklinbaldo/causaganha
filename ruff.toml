# Ruff configuration for CausaGanha v2
# Pragmatic mode: Standard rules enabled

# Target Python 3.11+
target-version = "py311"

# Line length (relaxed to 120, but we also ignore E501 below)
line-length = 120

[lint]
# Enable standard, useful rules
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# B: flake8-bugbear
# UP: pyupgrade
# PLE: Pylint errors
select = ["E", "F", "I", "B", "UP", "PLE"]

# Ignore conflicting rules or annoyances
# E501: Line too long
# F841: Unused variable
# E402: Module level import not at top of file
# B904: Raise without from
# I001: Import block un-sorted
# B008: Do not perform function call in argument defaults (Typer/FastAPI pattern)
# F821: Undefined name (ignoring to pass CI on legacy scripts)
ignore = ["E501", "F841", "E402", "B904", "I001", "B008", "F821"]

# Per-file ignores
[lint.per-file-ignores]
# Allow asserts and magic numbers in tests (recursive)
"tests/**" = ["S101", "PLR2004"]

[lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 10

[lint.pydocstyle]
# Use Google docstring convention
convention = "google"

[lint.isort]
# Import sorting
known-first-party = ["causaganha"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[format]
# Formatting options
quote-style = "double"
indent-style = "space"
line-ending = "auto"
