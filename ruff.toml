# Ruff configuration for CausaGanha v2
# Strict mode: ALL rules enabled, NO exceptions

# Target Python 3.11+
target-version = "py311"

# Line length
line-length = 100

[lint]
# Enable ALL Ruff rules
select = ["ALL"]

# NO EXCEPTIONS - Do not ignore any rules
# If Ruff complains, fix the code, don't silence it
ignore = []

# NO per-file ignores either
# Every file must pass all rules
[lint.per-file-ignores]
# Allow asserts in tests
"tests/*" = ["S101"]

[lint.mccabe]
# Maximum cyclomatic complexity
max-complexity = 10

[lint.pydocstyle]
# Use Google docstring convention
convention = "google"

[lint.isort]
# Import sorting
known-first-party = ["causaganha"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[format]
# Formatting options
quote-style = "double"
indent-style = "space"
line-ending = "auto"
