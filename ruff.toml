# Ruff configuration for CausaGanha v2
# Strict mode: ALL rules enabled

target-version = "py312"
line-length = 100

# marimo notebooks (notebooks/*.py) are authored in marimo's own cell format
# and embed Colab-only snippets (userdata, try/except Exception). They are not
# hand-maintained source and their committed .ipynb is verified separately by
# scripts/check_notebooks_synced.py — so keep ruff (lint + format) out of them,
# same as experiments/.
extend-exclude = ["notebooks", ".claude"]

[lint]
select = ["ALL"]
ignore = [
    # ── Formatter-incompatible (required by ruff format) ──
    "COM812",   # trailing commas
    "ISC001",   # implicit string concatenation

    # ── Development hygiene: TODOs are tracked in issues ──
    "FIX002",   # line-contains-todo

    # ── pandas-vet is moot: pandas is banned repo-wide (see banned-api
    # below). ibis uses `.notnull()`, which PD004 wrongly flags as a
    # pandas idiom — drop the rule rather than ignore it per-file. ──
    "PD004",    # .notna preferred over .notnull — ibis uses .notnull()
]

[lint.per-file-ignores]
"vulture_whitelist.py" = ["B018", "F821", "SLF001"]

# generate-data.py: filename uses a dash (required by existing callers); both
# functions are intentionally monolithic data-generation routines that would
# need substantial refactoring to reduce cyclomatic complexity.
"scripts/web/generate-data.py" = ["N999", "C901", "PLR0912", "PLR0915"]

# ── djen_backup engine ────────────────────────────────────────────────────
# run_pipeline/checker_worker/upload_worker are intentionally monolithic
# (acknowledged in CLAUDE.md). PLC0415: conditional/lazy imports are used
# for optional deps (rich, tqdm). SLF001: engine accesses manifest internals
# by design. ERA001: one commented-out debug line; acceptable in pipeline code.
# B023: loop var captured in closure (existing suppression kept).
"src/djen_backup/engine.py" = ["B023", "C901", "PLR0912", "PLR0915", "PLC0415", "SLF001", "ERA001", "D101", "D102", "D103", "PLR2004", "RUF006"]

# ── djen_backup __main__ ──────────────────────────────────────────────────
# B008: typer.Option() in default args is the idiomatic Typer pattern.
"src/djen_backup/__main__.py" = ["B008", "D101", "D102", "D107", "DTZ011", "E402", "FBT001", "FBT003", "PLC0415", "PLR2004"]

# ── stj_acordaos ──────────────────────────────────────────────────────────
# B008: typer.Option() in default args — idiomatic Typer pattern.
# PLC0415: lazy imports inside CLI command functions — standard pattern.
# D107/D105: __init__ and magic-method docstrings not required by project convention.
# PLW2901: loop variable reassignment in CSV parser (strip idiom).
# PERF401: list.append in CSV serializer — clarity over micro-optimisation.
# E501: long IA metadata strings; re-wrapping would harm readability.
# BLE001: blind except around a single resource's download/extract in a batch
# CLI loop — one bad ZIP shouldn't abort the whole run.
"src/stj_acordaos/__main__.py" = ["B008", "PLC0415", "D101", "D102", "D103", "D107", "FBT001", "FBT003", "BLE001"]
"src/stj_acordaos/manifest.py" = ["D107", "D105", "PLW2901", "PERF401"]
# S608: f-string SQL with DuckDB — path_list is internal (no user input).
# E501: long log line; splitting would obscure the structured-logging pattern.
"src/stj_acordaos/dedup.py" = ["S608", "E501"]

# ── tjro_juris ────────────────────────────────────────────────────────────
# B008: typer.Option() in default args — idiomatic Typer pattern.
# PLC0415: lazy imports inside CLI command functions — standard pattern.
# D100-D107: module/class/method docstrings not required for new pipeline modules.
# RUF002: × in docstring is intentional (multiplication sign in "tipo × month").
# TC003: Path used at runtime (not type-checking only) in manifest/dedup.
# S608: f-string SQL in dedup — file paths are internal constants, no user input.
# E501: long lines in manifest entry construction; wrapping harms readability.
"src/tjro_juris/__main__.py" = ["B008", "PLC0415", "D100", "D101", "D102", "D103", "D107", "E501", "ASYNC240", "PLR2004", "TC003"]
"src/tjro_juris/manifest.py" = ["D100", "D101", "D102", "D107", "TC003", "E501"]
"src/tjro_juris/dedup.py" = ["S608", "D100", "TC003"]
"src/tjro_juris/client.py" = ["D100", "D103"]
"src/tjro_juris/crawler.py" = ["D100", "D103", "TC003", "DTZ003", "DTZ011", "PLR2004", "E501", "PERF401"]
"src/tjro_juris/archive.py" = ["D100", "D103", "PLC0415", "ASYNC240", "TC003"]

# ── datajud ───────────────────────────────────────────────────────────────
# PLC0415: lazy duckdb imports inside CLI helpers — standard pattern.
# FBT001/FBT002: boolean CLI flags are idiomatic Typer.
# S608: f-string SQL over internal parquet paths only (no user input).
# S310: urlopen against a fixed archive.org URL constant, not user input.
"src/datajud/__main__.py" = ["PLC0415", "FBT001", "FBT002", "S608", "S310"]

# ── Lazy / conditional imports in library modules ─────────────────────────
# These modules defer expensive imports to avoid slowing every process start.
"src/causaganha/pipeline/ia_s3.py" = ["E402", "S608", "S324", "D100", "E501", "PLR2004"]
"src/causaganha/consolidate/transforms.py" = ["E402", "S608", "SLF001"]
"src/causaganha/consolidate/candidates.py" = ["E402", "S608", "PLC0415"]

"src/djen_backup/djen.py" = ["E402"]

# ── Legacy full-lint exceptions, locked in per file ───────────────────────
# CI runs the full `ruff check` as a blocking gate. Existing deviations are
# accepted only through targeted per-file ignores with an explanation here; fix
# and remove entries when touching the file. S608 here is internal
# query-builder f-strings (DuckDB/ibis, trusted inputs); S324 is MD5 for
# non-crypto checksums; S108 is a hardcoded tmp path (audit on cleanup); S101
# is an assert in archive.py that should become a real check.
"src/causaganha/consolidate/manifest_reader.py" = ["S608"]
"src/causaganha/consolidate/validation.py" = ["S608"]
"src/causaganha/consolidate/consolidation_manifest.py" = ["S608"]
"src/causaganha/consolidate/exporter.py" = ["S608"]
"src/djen_backup/probe.py" = ["S608"]
"src/causaganha/analysis/llm_analyzer.py" = ["ANN401", "ARG002", "C901", "E501", "PLR0912", "PLR0915"]
"src/causaganha/analysis/models.py" = ["E501"]
"src/causaganha/consolidate/cli.py" = ["C901", "E501", "PLR0912", "PLR0915"]
"src/causaganha/consolidate/zip_processor.py" = ["ANN401"]
"src/causaganha/config.py" = ["ANN401", "D100"]
"src/djen_backup/manifest.py" = ["ARG002", "D102", "D107", "PERF401", "PLC0415", "PLR2004", "PLW2901"]
"src/djen_backup/inventory.py" = ["D100", "D102", "D107", "PLR2004", "PLW2901"]
"src/djen_backup/archive.py" = ["C901", "PLC0415", "PLR2004"]
"src/djen_backup/drain.py" = ["S608", "TRY300"]

# ── segmenter_dataset (RFC 0012) ──────────────────────────────────────────
# B008/TC003: typer.Option() in default args is the idiomatic Typer pattern
# — Path stays a live top-level import so Typer can resolve command
# parameter types at runtime; only non-command helpers defer imports.
"src/segmenter_dataset/__main__.py" = ["B008", "TC003"]
# store.py: many small, self-explanatory accessor/writer methods (RFC 0012
# §8's document/annotation/review/release CRUD) — a docstring on each would
# just restate the method name.
"src/segmenter_dataset/store.py" = ["D102", "D107"]
# Atomic release verification intentionally raises inside its cleanup boundary;
# extracting those failures solely for TRY/EM style would obscure the transaction.
"src/segmenter_dataset/release.py" = ["ANN202", "D101", "D107", "EM101", "EM102", "PLR2004", "RUF017", "TRY003", "TRY301"]

# ── Tests ──────────────────────────────────────────────────────────────────
# assert is idiomatic pytest; no docstrings/type-hints required; private access
# and magic-value comparisons are normal in test code.
"tests/**/*.py" = [
    "S101",             # assert
    "D100", "D101", "D102", "D103", "D104", "D205",  # missing docstrings
    "ANN001", "ANN201", "ANN202", "ANN003", "ANN401",  # missing type annotations
    "PLR2004",          # magic value comparison
    "ARG001",           # unused function argument (fixtures pass unused args)
    "INP001",           # implicit namespace package
    "PLC0415",          # import outside top-level (test helpers use local imports)
    "SLF001",           # private member access
    "E402",             # module import not at top (dynamic imports in tests)
    "SIM108",           # ternary expressions not required
    "S608",             # f-string SQL (DuckDB with tmp_path, no user input)
    "TC003",            # move stdlib import into TYPE_CHECKING (too noisy with from __future__)
]

# ── Scripts ────────────────────────────────────────────────────────────────
# Pipeline/utility scripts: print() is intentional output; monolithic structure
# is acceptable; no public API so docstrings and type hints not required.
# E402 covers sys.path manipulation that must precede imports in entry scripts.
"scripts/**/*.py" = [
    "T201",             # print (intentional pipeline output)
    "D100", "D103",     # missing docstrings (internal scripts)
    "ANN001", "ANN201", "ANN202",  # missing type annotations
    "E402",             # module import not at top (sys.path setup before imports)
    "C901",             # too complex (monolithic data-pipeline functions)
    "PLR2004",          # magic value comparison
    "PLR0912",          # too many branches
    "PLR0915",          # too many statements
    "PLR0911",          # too many return statements
    "SLF001",           # private member access
    "EXE001",           # shebang not executable (CI runs via uv run, not directly)
    "PLW1510",          # subprocess.run without explicit check=
    "PLC0415",          # import not at top-level (conditional/lazy imports in scripts)
    "PLW2901",          # for-loop variable overwritten (accepted in pipeline scripts)
    "PTH123",           # open() not replaced by Path.open() (legacy scripts)
    "PTH110",           # os.path.exists not replaced (legacy scripts)
    "ASYNC240",         # blocking-path-method-in-async-function (scripts: one-shot jobs, overhead fine)
    "ASYNC230",         # blocking-open-call-in-async-function (same reason)
    # Script-side security-adjacent rules: these are operational tools that
    # build SQL from internal constants, fetch known URLs (IA manifests),
    # and shell out to known binaries. Treated as lower-risk than src/**
    # which stays strict. Re-audit if a script ever takes user input.
    "S608",             # f-string SQL (internal table/column names)
    "S310",             # urlopen (known archive.org URLs)
    "S603",             # subprocess without shell=False
    "S607",             # subprocess with partial exec path
    "S324",             # non-crypto hash (md5 for file checksums)
    "S112",             # try/except/continue
    "S110",             # try/except/pass
    "S108",             # hardcoded /tmp path
    "S101",             # assert (used as contract in scripts)
    "BLE001",           # blind Exception catch (pragmatic in one-shot scripts; src/** stays strict)
    "TRY300",           # try/else restructure (style, scripts don't benefit much)
    "S311",             # pseudo-random (diagnostic sampling, not crypto)
]

# ── Experiments ────────────────────────────────────────────────────────────
# Research/exploratory notebooks — not production code; all rules relaxed.
"experiments/**/*.py" = ["ALL"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["causaganha", "djen_backup"]
force-single-line = false
lines-after-imports = 2

[lint.flake8-tidy-imports.banned-api]
"pandas" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}
"pandas.core" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}
"pandas.DataFrame" = {msg = "Use ibis instead of pandas. pandas is banned from this repo."}

[lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.pylint]
max-args = 13
max-branches = 12
max-returns = 8
max-statements = 50

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
