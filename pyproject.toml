[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaganha"
version = "1.0.0"
description = "Automated judicial decision analysis using OpenSkill rating system"
readme = "README.md"
authors = [
    {name = "CausaGanha Team"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "duckdb>=0.10.0",
    "google-generativeai>=0.8.5",
    "internetarchive>=5.4.0",
    "openskill==5.0.1",
    "pandas>=2.3.0",
    # `pandas` currently requires `dateutil.parser.DEFAULTPARSER`, which is not
    # exported by python-dateutil>=2.9.0.
    "python-dateutil<2.9.0",
    #    "pymupdf>=1.26.1",
    "pyparsing==3.1.4",
    "cryptography>=42.0.5",
    "python-json-logger>=3.3.0",
    "rich>=13.7.0",
    "requests>=2.32.4",
    "typer>=0.12.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.14",
    "ibis-framework[duckdb]>=9.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-pubsub>=2.19.0",
    "google-cloud-tasks>=2.16.0",
    "tenacity>=9.1",
    "click>=8.1",  # for djen_backup CLI
    "lightgbm>=4.6.0",
    "scikit-learn>=1.8.0",
    "aiohttp-cors>=0.8.1",
]

[project.optional-dependencies]
embeddings = [
    "lancedb>=0.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.12",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff>=0.12.0",
    "pip-audit>=2.7.2",
    "safety>=3.2.0",
    "dbt-duckdb~=1.9",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "playwright>=1.58.0",
]

[project.scripts]
causaganha = "causaganha.cli:app"
djen-backup = "djen_backup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

# Ruff config is in ruff.toml (takes precedence over pyproject.toml)
