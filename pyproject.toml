[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaganha"
version = "1.0.3"
description = "Public, auditable archive and structured data layer for Brazilian judicial publications (DJEN)"
readme = "README.md"
authors = [
    {name = "CausaGanha Team"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.10.0",
    "internetarchive>=5.4.0",
    "pandas>=2.3.0",
    "python-dateutil>=2.8.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "ibis-framework[duckdb]>=9.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=9.1",
    "click>=8.1",
    "numpy>=2.0.0",
    "holidays>=0.40.0",
    "pyyaml>=6.0.3",
    "aiolimiter>=1.2.1",
    "anyio>=4.0",
    "aiohttp>=3.9.0",
    "fastmcp>=3.4.2",
    "okf-parser>=0.45.4,<0.46",
    "cyclopts>=4.22.0",
]

[dependency-groups]
opf = [
    "opf @ git+https://github.com/openai/privacy-filter.git",
]
classify = [
    "litellm>=1.40.0",
]
lab = [
    "google-genai>=1.0.0",
]
ner = [
    "torch>=2.2.0",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.12",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff==0.15.22",
    "functions-framework>=3.0.0",
    "pip-audit>=2.7.2",
    "safety>=3.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "playwright>=1.58.0",
    "marimo==0.23.14",
    "nbformat>=5.10.4",
]

[project.scripts]
causaganha = "causaganha_cli.__main__:app"
djen-backup = "djen_backup.__main__:app"
stj-acordaos = "stj_acordaos.__main__:app"
tjro-juris = "tjro_juris.__main__:app"
datajud = "datajud.__main__:app"
segmenter-dataset = "segmenter_dataset.__main__:app"
causaganha-mcp = "causaganha_mcp.__main__:main"
causaganha-mcp-http = "causaganha_mcp.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "bdd: marks BDD feature tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
constraint-dependencies = [
    "greenlet!=3.5.3",
]
