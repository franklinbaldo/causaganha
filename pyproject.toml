[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaganha"
version = "1.0.0"
description = "Public, auditable archive and structured data layer for Brazilian judicial publications (DJEN)"
readme = "README.md"
authors = [
    {name = "CausaGanha Team"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "duckdb>=0.10.0",
    "internetarchive>=5.4.0",
    "pandas>=2.3.0",
    "python-dateutil>=2.8.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "ibis-framework[duckdb]>=9.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=9.1",
    "click>=8.1", # for djen_backup CLI
    "numpy>=2.0.0",
    "holidays>=0.40.0",
    "pyyaml>=6.0.3",
    "aiolimiter>=1.2.1",
    "anyio>=4.0",
    "aiohttp>=3.9.0",
    "fastmcp>=2.0", # causaganha_mcp — RFC 0013 Fase 3
]

[dependency-groups]
opf = [
    # OpenAI Privacy Filter bootstrap workflow (Stage 1 CPU labeling).
    "opf @ git+https://github.com/openai/privacy-filter.git",
]
classify = [
    # LLM abstraction layer used by analysis/llm_analyzer.py
    "litellm>=1.40.0",
]
lab = [
    # Experimental analysis scripts only (scripts/pipeline/embed*.py,
    # scripts/analyze_with_rag.py, scripts/batch_embed_decisions.py,
    # scripts/index_ground_truth.py). Not used by the archive product or
    # any scheduled workflow.
    "google-genai>=1.0.0",
]
ner = [
    # Decision segmenter training (scripts/train_decision_segmenter.py)
    "torch>=2.2.0",
]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.12",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=6.2.1",
    "respx>=0.22.0",
    "ruff>=0.12.0",
    # Runtime of deployment/relay/function/main.py (Cloud Run relay) — needed
    # to import and unit-test it; not used anywhere else in the repo.
    "functions-framework>=3.0.0",
    "pip-audit>=2.7.2",
    "safety>=3.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "playwright>=1.58.0",
    # marimo notebooks (notebooks/*.py) + ipynb export used by the
    # notebook-sync CI check (scripts/check_notebooks_synced.py). uv.lock is
    # gitignored, so this is the only thing pinning the version anywhere —
    # exact-pinned because even patch bumps change ipynb export bytes and
    # break that check (hit twice now: 0.23.11->0.23.13, then ->0.23.14).
    "marimo==0.23.14",
    "nbformat>=5.10.4",
]

[project.scripts]
djen-backup = "djen_backup.__main__:app"
stj-acordaos = "stj_acordaos.__main__:app"
tjro-juris = "tjro_juris.__main__:app"
datajud = "datajud.__main__:app"
segmenter-dataset = "segmenter_dataset.__main__:app"
causaganha-mcp = "causaganha_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services",
    "bdd: marks BDD feature tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Ruff config is in ruff.toml (takes precedence over pyproject.toml)

[tool.uv]
# Ensure uv resolves wheels for Linux x86_64 (CI runner) and macOS (dev).
# Without this, uv may pick a greenlet release that only ships macOS/Windows
# wheels and fails to install on Linux (manylinux_2_39+).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

constraint-dependencies = [
    # greenlet 3.5.3 has no Linux wheel — cap until a fix is released.
    "greenlet!=3.5.3",
]
