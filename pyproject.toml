[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaganha"
version = "1.0.0"
description = "Automated judicial decision analysis using OpenSkill rating system"
authors = [{name = "CausaGanha Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.0",
    "duckdb>=0.10.0",
    "google-generativeai>=0.8.5",
    "internetarchive>=5.4.0",
    "openskill==5.0.1",
    "pandas>=2.3.0",
    # `pandas` currently requires `dateutil.parser.DEFAULTPARSER`, which is not
    # exported by python-dateutil>=2.9.0.
    "python-dateutil<2.9.0",
    "pymupdf>=1.26.1",
    "pyparsing==3.1.4",
    "cryptography>=42.0.5",
    "python-json-logger>=3.3.0",
    "rich>=13.7.0",
    "requests>=2.32.4",
    "toml>=0.10.2",
    "typer>=0.12.0",
    "pydantic>=2.10.0", # For data validation and settings management
    "pydantic-ai>=0.0.14",
    "ibis-framework[duckdb]>=9.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0.0",
    "ruff>=0.12.0",
    "pip-audit>=2.7.2",
    "dbt-duckdb~=1.9", # For dbt-based database management
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-minify-plugin>=0.8.0",
]

[project.scripts]
causaganha = "causaganha.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = """
    -v
    --strict-markers
    --cov=causaganha
    --cov-report=html
    --cov-report=term-missing
"""

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.2.1",
    "mypy>=1.0.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
