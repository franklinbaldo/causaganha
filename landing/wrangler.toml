name = "causaganha-waitlist"
main = "waitlist-worker.js"
compatibility_date = "2024-01-01"

# KV Namespace for storing emails
# Create with: wrangler kv:namespace create "WAITLIST"
# Then add the ID below
[[kv_namespaces]]
binding = "WAITLIST"
id = "YOUR_KV_NAMESPACE_ID"  # Replace after creating

# Environment variables
[vars]
ADMIN_TOKEN = ""  # Set via wrangler secret put ADMIN_TOKEN

# Production environment
[env.production]
name = "causaganha-waitlist-prod"
