# ============================================================================
# DATAJUD CDC & BACKUP — Incremental CDC & Daily Packaging to Internet Archive
# ============================================================================
#
# Daily schedule (RFC 0010 + Issue #1701):
# 1. Runs CDC search_after against DataJud public ES index for the target tribunal.
# 2. Partitions raw updates as L1 Parquet deltas and updates SQLite checkpoint.
# 3. Consolidates L1 deltas into canonical L0 Parquet tables (capa + movimentos).
# 4. Generates daily full-process ZIP for transparent-unzip retrieval on IA.
# 5. Updates resolution index (indice_processos_{tribunal}.parquet).
# 6. Uploads artifacts to Internet Archive item `causaganha-datajud-{tribunal}`.
# ============================================================================

name: DataJud CDC & Backup

on:
  schedule:
    # Safety net only. Collection is continuous because each run dispatches
    # the next one when it finishes (see the last step); this cron restarts
    # the chain if it ever breaks and picks up new updates once caught up.
    - cron: '27 */6 * * *'
  workflow_dispatch:
    inputs:
      tribunal:
        description: 'Sigla do tribunal (ex.: tjro, tjce, tjsp)'
        required: false
        default: 'tjro'
      page_size:
        description: 'Tamanho da página search_after'
        required: false
        default: '1000'
      max_pages:
        description: 'Limite máximo de páginas (deixe vazio para sem limite)'
        required: false
        default: ''
      skip_upload:
        description: 'Skip IA upload (dry run)'
        type: boolean
        required: false
        default: false
      cooldown_minutes:
        description: 'Wait before collecting (set by the chain after a DataJud rate limit)'
        required: false
        default: '0'

permissions:
  contents: read
  actions: write  # the run dispatches its successor (continuous collection)

concurrency:
  group: datajud-cdc
  cancel-in-progress: false

jobs:
  cdc-backup:
    name: DataJud CDC & IA Backup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: dev

    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Cool down after a rate-limited run
        if: ${{ github.event.inputs.cooldown_minutes != '' && github.event.inputs.cooldown_minutes != '0' }}
        env:
          COOLDOWN: ${{ github.event.inputs.cooldown_minutes }}
        run: |
          case "$COOLDOWN" in ''|*[!0-9]*) echo "invalid cooldown"; exit 1;; esac
          echo "Waiting $COOLDOWN min before hitting DataJud again"
          sleep $((COOLDOWN * 60))

      - name: Run DataJud CDC Sync and Backup
        env:
          # Dispatch inputs reach the script as env vars, never spliced into
          # its text (same TM-01 rule as tjro-sync.yml).
          CDC_TRIBUNAL: ${{ github.event.inputs.tribunal || 'tjro' }}
          CDC_PAGE_SIZE: ${{ github.event.inputs.page_size || '1000' }}
          CDC_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          CDC_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload }}
          CDC_EVENT: ${{ github.event_name }}
          CDC_COOLDOWN: ${{ github.event.inputs.cooldown_minutes || '0' }}
        run: |
          set -euo pipefail
          ARGS=(--tribunal "$CDC_TRIBUNAL" --page-size "$CDC_PAGE_SIZE")
          if [ -n "${CDC_MAX_PAGES:-}" ]; then
            ARGS+=(--max-pages "$CDC_MAX_PAGES")
          fi
          if [ "${CDC_SKIP_UPLOAD:-}" = "true" ] || [ "$CDC_EVENT" = "pull_request" ]; then
            # Dry run still restores the published state (read-only) so it
            # resumes from the real cursor instead of re-streaming from zero.
            ARGS+=(--skip-upload --restore)
          else
            ARGS+=(--upload)
          fi
          # Stop collecting after 300 min so consolidation and the ordered
          # publish (ZIP -> locators -> Parquets/index -> state bundle last)
          # fit in the 350-min job timeout (GitHub caps hosted jobs at 360).
          # The first run (2026-11-15) collected 128k docs in 90 min and
          # compacted + published in ~1 min; the published cursor resumes
          # on the next run.
          # A cooldown spends part of the job's time, so collect for less.
          MAX_MINUTES=$((300 - CDC_COOLDOWN))
          uv run datajud cdc "${ARGS[@]}" --max-minutes "$MAX_MINUTES" --report-json cdc-report.json

      - name: Dispatch the next run (continuous collection)
        # Not for dry runs/PRs. "exhausted" means caught up with DataJud: stop
        # chaining and let the cron pick up new updates. After a rate limit,
        # the next run waits 30 min before paging again.
        if: ${{ success() && github.event_name != 'pull_request' && github.event.inputs.skip_upload != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CDC_TRIBUNAL: ${{ github.event.inputs.tribunal || 'tjro' }}
        run: |
          set -euo pipefail
          REASON=$(python3 -c 'import json;print(json.load(open("cdc-report.json"))["stop_reason"])')
          echo "stop_reason=$REASON"
          case "$REASON" in
            exhausted) echo "Caught up; the cron takes over."; exit 0;;
            rate_limited) COOLDOWN=30;;
            *) COOLDOWN=0;;
          esac
          gh workflow run datajud-cdc.yml --ref "$GITHUB_REF_NAME" \
            -f tribunal="$CDC_TRIBUNAL" -f cooldown_minutes="$COOLDOWN"
