name: Auto-close stale conflicting PRs

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  close-stale-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and close stale conflicting PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > close_stale_prs.py
          import subprocess
          import json
          import datetime

          def run_command(cmd):
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              if result.returncode != 0:
                  print(f"Error running '{cmd}': {result.stderr}")
                  return None
              return result.stdout

          output = run_command("gh pr list --state open --json number,mergeable,updatedAt,labels")
          if not output:
              exit(1)

          prs = json.loads(output)
          now = datetime.datetime.now(datetime.timezone.utc)
          seven_days_ago = now - datetime.timedelta(days=7)

          for pr in prs:
              if pr.get('mergeable') == 'CONFLICTING':
                  updated_at_str = pr.get('updatedAt')
                  updated_at = datetime.datetime.fromisoformat(updated_at_str.replace('Z', '+00:00'))

                  if updated_at < seven_days_ago:
                      labels = [label.get('name') for label in pr.get('labels', [])]
                      if 'keep-open' in labels or 'wip' in labels:
                          print(f"Skipping PR #{pr['number']} because it has 'keep-open' or 'wip' label.")
                          continue

                      print(f"Closing stale conflicting PR #{pr['number']}...")
                      comment = "Fechado automaticamente: este PR tem conflitos de merge nao resolvidos ha mais de 7 dias. Corrija o conflito com rebase e reabra se ainda necessario."

                      comment_cmd = f"gh pr comment {pr['number']} --body \"{comment}\""
                      close_cmd = f"gh pr close {pr['number']}"

                      run_command(comment_cmd)
                      run_command(close_cmd)

          EOF
          python3 close_stale_prs.py
