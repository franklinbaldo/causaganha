name: OKF knowledge

on:
  pull_request:
    paths:
      - "knowledge/**"
      - ".github/workflows/okf.yml"
  push:
    branches: [main]
    paths:
      - "knowledge/**"
      - ".github/workflows/okf.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CausaGanha
        uses: actions/checkout@v4

      - name: Checkout published okf-parser
        uses: actions/checkout@v4
        with:
          repository: franklinbaldo/okf-parser
          # 0.45.4 is the first release line with RFC 0018 projection export;
          # use the latest published patch from that line for the contract gate.
          ref: v0.45.6
          path: .okf-parser

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.21"

      - name: Validate OKF and relational integrity
        run: >-
          uv run --project .okf-parser --frozen okf-parser check knowledge
          --relational-schema okf.schema.sql

      - name: Export ProcessoConsultar projection
        run: |
          uv run --project .okf-parser --frozen okf-parser schema knowledge \
            --format pydantic --relational-schema okf.schema.sql \
            > /tmp/domain_models.py
          uv run --project .okf-parser --frozen okf-parser schema knowledge \
            --format zod --relational-schema okf.schema.sql \
            > /tmp/domain-schemas.ts
          python -m py_compile /tmp/domain_models.py
          grep -q "class ProcessoConsultarProjection" /tmp/domain_models.py
          grep -q "export const ProcessoConsultarSchema" /tmp/domain-schemas.ts

      - name: Compile typed Ibis relations
        run: |
          uv run --project .okf-parser --frozen python - <<'PY'
          from pathlib import Path

          from okf_parser import load_bundle

          bundle = load_bundle(Path("knowledge"))
          with bundle.compile_types(".okf/specs/{slug}.md") as typed:
              assert typed.tables == ("Fonte", "Pipeline")
              assert typed["Fonte"].count().execute() == 4
              assert typed["Pipeline"].count().execute() == 4
          PY
