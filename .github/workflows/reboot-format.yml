name: Reboot format fix

on:
  push:
    branches: [reboot/cobogo-web]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reboot/cobogo-web
      - uses: ./.github/actions/setup
      - name: Format migrated Cobogo test
        run: uv run ruff format tests/test_cobogo_core_adoption.py
      - name: Commit formatter output
        run: |
          if git diff --quiet -- tests/test_cobogo_core_adoption.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_cobogo_core_adoption.py
          git commit -m "style: format Cobogo adoption test"
          git push origin HEAD:reboot/cobogo-web
