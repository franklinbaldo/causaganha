# ============================================================================
# STJ & TJRO SYNC — Manual ingestion of STJ acórdãos and TJRO JURIS corpus
# ============================================================================
#
# Hourly cron + workflow_dispatch. Scheduled runs are incremental: both
# CLIs dedup against their IA manifests, and the TJRO crawl is limited to
# the current year (full/backfill crawls stay available via dispatch).
# The concurrency group queues (not cancels) if a previous run overruns.
#
# Two independent jobs:
#   stj  — `stj-acordaos download` + `stj-acordaos upload` (CKAN → dedup → IA)
#   tjro — `tjro-juris crawl` + `tjro-juris upload` (JURIS → parquet → IA)
# ============================================================================

name: STJ & TJRO Sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      run_stj:
        description: 'Run the STJ acórdãos job'
        type: boolean
        required: false
        default: true
      run_tjro:
        description: 'Run the TJRO JURIS job'
        type: boolean
        required: false
        default: true
      tjro_ano:
        description: 'TJRO: only crawl this year (--ano, e.g. 2024) — optional'
        required: false
      tjro_tipos:
        description: 'TJRO: comma-separated tipos (--tipo), e.g. "ACÓRDÃO,SENTENÇA" — optional'
        required: false
      skip_upload:
        description: 'Skip IA upload (download/crawl only, dry run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: stj-tjro-sync
  cancel-in-progress: false

jobs:
  stj:
    name: STJ acórdãos (download + upload)
    # inputs.* is empty on schedule events — gate must pass for cron runs
    if: ${{ github.event_name == 'schedule' || inputs.run_stj }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev

    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Download STJ resources
        run: |
          uv run --no-dev stj-acordaos download \
            --data-dir data/stj \
            --manifest-path data/stj/stj-manifest.csv

      - name: Dedup + upload to Internet Archive
        if: ${{ !inputs.skip_upload }}
        run: |
          uv run --no-dev stj-acordaos upload \
            --data-dir data/stj \
            --manifest-path data/stj/stj-manifest.csv

      - name: Show manifest status
        if: always()
        run: uv run --no-dev stj-acordaos status --manifest-path data/stj/stj-manifest.csv

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stj-manifest
          path: data/stj/stj-manifest.csv
          if-no-files-found: ignore

  tjro:
    name: TJRO JURIS (crawl + upload)
    # inputs.* is empty on schedule events — gate must pass for cron runs
    if: ${{ github.event_name == 'schedule' || inputs.run_tjro }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Crawl JURIS
        run: |
          ANO="${{ inputs.tjro_ano }}"
          TIPOS="${{ inputs.tjro_tipos }}"

          # Scheduled runs stay incremental: restrict to the current year
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$ANO" ]; then
            ANO="$(date -u +%Y)"
          fi

          CMD="uv run --no-dev tjro-juris crawl data/tjro-juris"
          if [ -n "$ANO" ]; then
            CMD="$CMD --ano $ANO"
          fi
          if [ -n "$TIPOS" ]; then
            IFS=',' read -ra TIPO_LIST <<< "$TIPOS"
            for t in "${TIPO_LIST[@]}"; do
              CMD="$CMD --tipo \"$t\""
            done
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Upload parquets to Internet Archive
        if: ${{ !inputs.skip_upload }}
        run: uv run --no-dev tjro-juris upload data/tjro-juris

      - name: Show manifest status
        if: always()
        run: uv run --no-dev tjro-juris status data/tjro-juris

      - name: Upload manifest artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tjro-juris-manifest
          path: data/tjro-juris/tjro-juris-manifest.csv
          if-no-files-found: ignore
