# ============================================================================
# SAMPLE SEGMENTER TEXTS — Stratified multi-tribunal sampling from IA
# ============================================================================
#
# Matrix job per tribunal: downloads ZIPs from Internet Archive, extracts
# texts, samples N decisions. Uploads per-tribunal JSONL as artifacts.
# A final job merges all samples into a combined sample_manifest.json.
#
# Triggered manually (workflow_dispatch) with configurable parameters.
# ============================================================================

name: Sample Segmenter Texts

on:
  workflow_dispatch:
    inputs:
      n_per_tribunal:
        description: 'Number of texts to sample per tribunal'
        required: false
        default: '20'
      max_zips:
        description: 'Max ZIPs to download per tribunal'
        required: false
        default: '10'
      seed:
        description: 'Random seed for reproducibility'
        required: false
        default: '42'

permissions:
  contents: read
  actions: write

concurrency:
  group: sample-segmenter
  cancel-in-progress: true

jobs:
  sample:
    name: Sample ${{ matrix.tribunal }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tribunal:
          - TJSP
          - TJRJ
          - TJMG
          - TJRS
          - TJPR
          - TJSC
          - TJBA
          - TJPE
          - TJCE
          - TJDF
          - TJGO
          - TJPA
          - TJRO
          - TJMA
          - TJPB
          - TJRN
          - TRF1
          - TRF3
          - TRF5
          - STJ
        mode:
          - sentenca
          - acordao
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "true"

      - name: Sample texts for ${{ matrix.tribunal }} (${{ matrix.mode }})
        run: |
          set -euo pipefail
          uv run python scripts/sample_ia_texts.py \
            --tribunal "${{ matrix.tribunal }}" \
            --mode "${{ matrix.mode }}" \
            --n "${{ inputs.n_per_tribunal || '20' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --output-dir /tmp/segmenter_samples

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.tribunal }}-${{ matrix.mode }}
          path: /tmp/segmenter_samples/
          retention-days: 30

  merge:
    name: Merge samples
    runs-on: ubuntu-latest
    needs: sample
    if: always()

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/segmenter_samples/
          pattern: sample-*
          merge-multiple: true

      - name: Build combined manifest
        env:
          SEED: ${{ inputs.seed || '42' }}
        run: |
          set -euo pipefail
          cd /tmp/segmenter_samples

          python3 - <<'PYEOF'
          import json, glob, os, pathlib

          manifests = sorted(glob.glob("*_manifest.json"))
          tribunals = {}
          total = 0
          for m in manifests:
              d = json.loads(pathlib.Path(m).read_text())
              tribunals[d["tribunal"]] = d["n_sampled"]
              total += d["n_sampled"]

          combined = {"tribunals": tribunals, "total": total, "seed": int(os.environ.get("SEED", 42))}
          pathlib.Path("combined_manifest.json").write_text(json.dumps(combined, indent=2))

          lines = ["## Per-tribunal samples", ""]
          for t, n in sorted(tribunals.items()):
              lines.append(f"- **{t}**: {n} texts")
          lines.append(f"\n**Total: {total} texts across {len(tribunals)} tribunals**")
          summary = "\n".join(lines) + "\n"

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary)
          print(summary)
          PYEOF

      - name: Upload combined samples
        uses: actions/upload-artifact@v4
        with:
          name: segmenter-samples-all
          path: /tmp/segmenter_samples/
          retention-days: 30
