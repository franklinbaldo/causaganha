# ============================================================================
# SAMPLE SEGMENTER TEXTS — Stratified multi-tribunal sampling from IA
# ============================================================================
#
# Matrix job per tribunal: downloads ZIPs from Internet Archive, extracts
# texts, samples N decisions. Uploads per-tribunal JSONL as artifacts.
# A final job merges all samples into a combined sample_manifest.json.
#
# Triggered manually (workflow_dispatch) with configurable parameters.
# ============================================================================

name: Sample Segmenter Texts

on:
  workflow_dispatch:
    inputs:
      n_per_tribunal:
        description: 'Number of texts to sample per tribunal'
        required: false
        default: '20'
      max_zips:
        description: 'Max ZIPs to download per tribunal'
        required: false
        default: '10'
      seed:
        description: 'Random seed for reproducibility'
        required: false
        default: '42'

permissions:
  contents: read
  actions: write

concurrency:
  group: sample-segmenter
  cancel-in-progress: true

jobs:
  sample:
    name: Sample ${{ matrix.tribunal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tribunal:
          - TJSP
          - TJRJ
          - TJMG
          - TJRS
          - TJPR
          - TJSC
          - TJBA
          - TJPE
          - TJCE
          - TJDF
          - TJGO
          - TJPA
          - TJRO
          - TJMA
          - TJPB
          - TJRN
          - TRF1
          - TRF3
          - TRF5
          - STJ
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "true"

      - name: Sample texts for ${{ matrix.tribunal }}
        run: |
          set -euo pipefail
          uv run python scripts/sample_ia_texts.py \
            --tribunal "${{ matrix.tribunal }}" \
            --n "${{ inputs.n_per_tribunal || '20' }}" \
            --max-zips "${{ inputs.max_zips || '10' }}" \
            --seed "${{ inputs.seed || '42' }}" \
            --output-dir data/segmenter_samples

      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.tribunal }}
          path: data/segmenter_samples/
          retention-days: 30

  merge:
    name: Merge samples
    runs-on: ubuntu-latest
    needs: sample
    if: always()

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@v4
        with:
          path: data/segmenter_samples/
          pattern: sample-*
          merge-multiple: true

      - name: Build combined manifest
        run: |
          set -euo pipefail
          cd data/segmenter_samples

          echo "## Per-tribunal samples" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TOTAL=0
          echo '{"tribunals": {' > combined_manifest.json
          FIRST=true
          for manifest in *_manifest.json; do
            TRIBUNAL=$(jq -r '.tribunal' "$manifest")
            N=$(jq -r '.n_sampled' "$manifest")
            TOTAL=$((TOTAL + N))
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> combined_manifest.json
            fi
            echo "\"$TRIBUNAL\": $N" >> combined_manifest.json
            echo "- **$TRIBUNAL**: $N texts" >> $GITHUB_STEP_SUMMARY
          done
          echo "}, \"total\": $TOTAL, \"seed\": ${{ inputs.seed || '42' }}}" >> combined_manifest.json

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $TOTAL texts across $(ls *_manifest.json | wc -l) tribunals**" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined samples
        uses: actions/upload-artifact@v4
        with:
          name: segmenter-samples-all
          path: data/segmenter_samples/
          retention-days: 30
