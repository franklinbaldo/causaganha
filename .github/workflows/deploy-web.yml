name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web.yml'
      - 'web/**'
      - 'scripts/generate_cache_from_manifest.py'
      - 'scripts/render_queries.py'
      - 'scripts/generate_homepage_widgets.py'
  # No schedule needed — update-catalog.yml triggers this after every successful collect
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Restore pipeline cache (for last_run stats)
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: web/public/cache
          key: web-cache-
          restore-keys: web-cache-

      - name: Preserve last_run stats from pipeline
        run: |
          if [ -f web/public/cache/today.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('web/public/cache/today.json'))
              lr = data.get('last_run')
              if lr:
                  json.dump(lr, open('/tmp/last-run.json', 'w'))
                  print('Preserved last_run stats')
              else:
                  print('No last_run in cached today.json')
          except Exception as e:
              print(f'Could not extract last_run: {e}')
          "
          fi

      - name: Generate web data from query contracts
        run: |
          mkdir -p web/public/cache web/public/data
          # Render .qmd query contracts → JSON in web/public/data/
          # --strict (RFC 0007): a required contract that fails to render
          # aborts the deploy; optional contracts only warn.
          uv run python scripts/render_queries.py --strict
          # Legacy caches — kept during migration to .qmd contracts
          uv run python scripts/generate_cache_from_manifest.py
          uv run python scripts/generate_homepage_widgets.py \
            --output web/public/cache/homepage-widgets.json \
            || echo "homepage-widgets generation failed (non-fatal)"
          echo "Data files generated:"
          ls -la web/public/data/ web/public/cache/ web/public/ia-snapshot.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build Astro site
        run: npm run build
        working-directory: web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  verify-public:
    name: Verify the page readers actually receive
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - name: Checkout published revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Audit semantic accessibility on the public URL
        shell: bash
        env:
          SURFACE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          SURFACE_REVISION: ${{ github.sha }}
          SURFACE_ACCESSIBILITY_OUTPUT: ${{ github.workspace }}/published-evidence/accessibility.json
        run: |
          mkdir -p published-evidence /tmp/cobogo-a11y
          cp scripts/check_surface_accessibility.mjs /tmp/cobogo-a11y/check.mjs
          cd /tmp/cobogo-a11y
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
          node check.mjs

      - name: Verify published stats payload stays local
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p published-evidence
          stats_url="${PAGE_URL%/}/stats.html"
          curl --fail --silent --show-error --location "$stats_url" --output published-evidence/stats.html
          stats_bytes=$(wc -c < published-evidence/stats.html)
          max_stats_bytes=$((250 * 1024))
          echo "Published /stats HTML: ${stats_bytes} bytes (budget: ${max_stats_bytes})"
          if [ "$stats_bytes" -gt "$max_stats_bytes" ]; then
            echo "::error::Published /stats HTML exceeds the 250 KiB regression budget (${stats_bytes} bytes)."
            exit 1
          fi
          if grep -q 'calendarRows' published-evidence/stats.html; then
            echo "::error::Published /stats serialized calendarRows again; the global tribunal calendar leaked back into the initial HTML."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              "url": f"{os.environ['PAGE_URL'].rstrip('/')}/stats.html",
              "bytes": os.path.getsize("published-evidence/stats.html"),
              "budget_bytes": 250 * 1024,
              "global_calendar_prop_present": b"calendarRows" in open("published-evidence/stats.html", "rb").read(),
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("published-evidence/stats-payload.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Capture the published routes in desktop and mobile widths
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p published-evidence
          base="${PAGE_URL%/}/"
          for page in index.html processo.html publicacoes.html stats.html sobre.html agentes.html minhas-consultas.html; do
            stem="${page%.html}"
            npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="1280,900" --full-page \
              "${base}${page}" "published-evidence/${stem}-desktop.png"
            npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page \
              "${base}${page}" "published-evidence/${stem}-mobile.png"
          done
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              "phase": "published",
              "revision": os.environ["GITHUB_SHA"],
              "published_revision": os.environ["GITHUB_SHA"],
              "public_url": os.environ["PAGE_URL"],
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "viewports": [{"width": 1280, "height": 900}, {"width": 390, "height": 844}],
              "routes": ["index.html", "processo.html", "publicacoes.html", "stats.html", "sobre.html", "agentes.html", "minhas-consultas.html"],
          }
          with open("published-evidence/published.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Upload proof from the published page
        uses: actions/upload-artifact@v4
        with:
          name: published-surface-${{ github.sha }}
          path: published-evidence/
          if-no-files-found: error
