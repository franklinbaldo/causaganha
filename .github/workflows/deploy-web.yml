name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/generate_dashboard_cache.py'
      - 'scripts/generate_ia_snapshot.py'
      - 'scripts/generate_homepage_widgets.py'
  # No schedule needed — update-catalog.yml triggers this after every successful collect
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Restore pipeline cache (for last_run stats)
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: web/public/cache
          key: web-cache-
          restore-keys: web-cache-

      - name: Preserve last_run stats from pipeline
        run: |
          if [ -f web/public/cache/today.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('web/public/cache/today.json'))
              lr = data.get('last_run')
              if lr:
                  json.dump(lr, open('/tmp/last-run.json', 'w'))
                  print('Preserved last_run stats')
              else:
                  print('No last_run in cached today.json')
          except Exception as e:
              print(f'Could not extract last_run: {e}')
          "
          fi

      - name: Generate web data from query contracts
        run: |
          pip install uv
          uv sync --no-dev
          mkdir -p web/public/cache web/public/data
          # Render .qmd query contracts → JSON in web/public/data/
          uv run python scripts/render_queries.py
          # Legacy caches — kept during migration to .qmd contracts
          uv run python scripts/generate_cache_from_manifest.py
          uv run python scripts/generate_homepage_widgets.py \
            --output web/public/cache/homepage-widgets.json \
            || echo "homepage-widgets generation failed (non-fatal)"
          echo "Data files generated:"
          ls -la web/public/data/ web/public/cache/ web/public/ia-snapshot.json

      - name: Download DuckDB artifact
        id: download-db
        uses: actions/download-artifact@v4
        with:
          name: causaganha-db
          path: data/
        continue-on-error: true  # Artifact may not exist on manual/dispatch runs

      - name: Generate web data (requires DuckDB artifact)
        if: steps.download-db.outcome == 'success'
        run: |
          pip install duckdb httpx
          python scripts/web/generate-data.py

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build Astro site
        run: npm run build
        working-directory: web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
