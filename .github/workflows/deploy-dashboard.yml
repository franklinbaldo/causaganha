name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/generate_dashboard_cache.py'
  # No schedule needed — update-catalog.yml triggers this after every successful collect
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Restore pipeline cache (for last_run stats)
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: dashboard/public/cache
          key: dashboard-cache-
          restore-keys: dashboard-cache-

      - name: Preserve last_run stats from pipeline
        run: |
          if [ -f dashboard/public/cache/today.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('dashboard/public/cache/today.json'))
              lr = data.get('last_run')
              if lr:
                  json.dump(lr, open('/tmp/last-run.json', 'w'))
                  print('Preserved last_run stats')
              else:
                  print('No last_run in cached today.json')
          except Exception as e:
              print(f'Could not extract last_run: {e}')
          "
          fi

      - name: Generate dashboard cache from catalog manifest
        run: |
          pip install uv
          uv sync --no-dev
          mkdir -p dashboard/public/cache
          uv run python scripts/generate_dashboard_cache.py
          echo "Cache files generated:"
          ls -la dashboard/public/cache/
        env:
          PIPELINE_RUN_STATS: /tmp/last-run.json

      - name: Download DuckDB artifact
        id: download-db
        uses: actions/download-artifact@v4
        with:
          name: causaganha-db
          path: data/
        continue-on-error: true  # Artifact may not exist on manual/dispatch runs

      - name: Generate dashboard data (requires DuckDB artifact)
        if: steps.download-db.outcome == 'success'
        run: |
          pip install duckdb httpx
          python scripts/dashboard/generate-data.py

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build Astro site
        run: npm run build
        working-directory: dashboard

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dashboard/dist

      - name: Notify Telegram on failure
        if: failure()
        run: |
          # TODO: Add TELEGRAM_BOT_TOKEN to repository secrets
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=8490688452" \
            -d "text=⚠️ causaganha: Dashboard deploy FALHOU! Verificar: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
