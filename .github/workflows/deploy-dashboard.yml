name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/generate_dashboard_cache.py'
  schedule:
    # Refresh dashboard cache every 6 hours to keep data fresh
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Restore pipeline cache (for last_run stats)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dashboard/public/cache
          key: dashboard-cache-
          restore-keys: dashboard-cache-

      - name: Preserve last_run stats from pipeline
        run: |
          if [ -f dashboard/public/cache/today.json ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('dashboard/public/cache/today.json'))
              lr = data.get('last_run')
              if lr:
                  json.dump(lr, open('/tmp/last-run.json', 'w'))
                  print('Preserved last_run stats')
              else:
                  print('No last_run in cached today.json')
          except Exception as e:
              print(f'Could not extract last_run: {e}')
          "
          fi

      - name: Generate dashboard cache from catalog manifest
        run: |
          pip install uv
          uv sync --no-dev
          mkdir -p dashboard/public/cache
          uv run python scripts/generate_dashboard_cache.py
          echo "Cache files generated:"
          ls -la dashboard/public/cache/
        continue-on-error: true  # Don't fail deploy if cache generation fails
        env:
          PIPELINE_RUN_STATS: /tmp/last-run.json

      - name: Download DuckDB artifact
        id: download-db
        uses: actions/download-artifact@v4
        with:
          name: causaganha-db
          path: data/
        continue-on-error: true  # Artifact may not exist on scheduled/manual runs

      - name: Generate dashboard data (requires DuckDB artifact)
        if: steps.download-db.outcome == 'success'
        run: |
          pip install duckdb httpx
          python scripts/dashboard/generate-data.py
        continue-on-error: true

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Build Astro site
        run: npm run build
        working-directory: dashboard

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
