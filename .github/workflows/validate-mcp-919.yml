name: Temporary validate MCP 919

on:
  push:
    branches:
      - mcp/917-publicacoes-archive

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: mcp/917-publicacoes-archive
      - uses: ./.github/actions/setup
      - name: Apply narrow lint policy and keyword-only MCP boolean
        run: |
          python - <<'PY'
          from pathlib import Path

          tool = Path('src/causaganha_mcp/tools/publicacoes.py')
          text = tool.read_text()
          old = '        data_fim: str | None = None,\n        incluir_trecho: bool = False,'
          new = '        data_fim: str | None = None,\n        *,\n        incluir_trecho: bool = False,'
          if old not in text:
              raise SystemExit('publicacoes keyword-only insertion point not found')
          tool.write_text(text.replace(old, new))

          ruff = Path('ruff.toml')
          text = ruff.read_text()
          anchor = '"src/causaganha/processos/service.py" = ["S608"]\n'
          addition = '''\n# S608: SQL structure contains only manifest-selected archive URLs and static\n# table fragments; every user-supplied search value remains a bind parameter.\n"src/causaganha/publicacoes/service.py" = ["S608"]\n'''
          if addition.strip() not in text:
              if anchor not in text:
                  raise SystemExit('ruff insertion point not found')
              text = text.replace(anchor, anchor + addition)
          ruff.write_text(text)
          PY
          uv run ruff format \
            src/causaganha/publicacoes/models.py \
            src/causaganha/publicacoes/service.py \
            src/causaganha_mcp/tools/publicacoes.py \
            tests/publicacoes/test_publicacoes_service.py \
            tests/causaganha_mcp/test_publicacoes_buscar.py
          uv run ruff check --fix \
            src/causaganha/publicacoes/models.py \
            src/causaganha/publicacoes/service.py \
            src/causaganha_mcp/tools/publicacoes.py \
            tests/publicacoes/test_publicacoes_service.py \
            tests/causaganha_mcp/test_publicacoes_buscar.py
          uv run ruff format --check \
            src/causaganha/publicacoes/models.py \
            src/causaganha/publicacoes/service.py \
            src/causaganha_mcp/tools/publicacoes.py \
            tests/publicacoes/test_publicacoes_service.py \
            tests/causaganha_mcp/test_publicacoes_buscar.py
          uv run pytest -q tests/publicacoes/test_publicacoes_service.py tests/causaganha_mcp/test_publicacoes_buscar.py tests/causaganha_mcp/test_tool_schema.py
      - name: Commit validated fixes and remove temporary workflow
        run: |
          rm .github/workflows/validate-mcp-919.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add ruff.toml src/causaganha/publicacoes src/causaganha_mcp/tools/publicacoes.py tests/publicacoes/test_publicacoes_service.py tests/causaganha_mcp/test_publicacoes_buscar.py .github/workflows/validate-mcp-919.yml
          git commit -m 'refactor(mcp): validate archive-first publication search'
          git push origin HEAD:mcp/917-publicacoes-archive
