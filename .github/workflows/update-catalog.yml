# ============================================================================
# UPDATE CATALOG — Regenerate manifest.parquet from IA data
# ============================================================================
#
# Scans all djen-* items on Internet Archive and regenerates the catalog
# (manifest.parquet + backfill-needed.parquet), then uploads to the
# causaganha-catalog IA item.
#
# The dashboard (deploy-dashboard.yml) reads from this manifest to show
# up-to-date statistics on how many ZIPs have been collected.
#
# Runs every 2 hours and after every successful collect-zips run.
# ============================================================================

name: Update Catalog

on:
  schedule:
    # Every 2 hours
    - cron: '15 */2 * * *'
  workflow_run:
    workflows: ['Collect ZIPs']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  update-catalog:
    name: Regenerate manifest.parquet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Internet Archive
        uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Generate and upload catalog
        run: |
          echo "Generating catalog from IA data..."
          uv run python scripts/generate_catalog.py --upload
          echo "Catalog updated."

      - name: Trigger dashboard deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-dashboard.yml --repo franklinbaldo/causaganha
          echo "Dashboard deploy triggered."
