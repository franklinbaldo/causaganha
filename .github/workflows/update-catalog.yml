name: Update Catalog

on:
  workflow_run:
    workflows: ["Collect ZIPs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Configure Internet Archive credentials
        uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Generate and upload catalog
        run: |
          uv sync --no-dev
          echo "Generating catalog from IA data..."
          uv run python scripts/generate_catalog.py --upload
          echo "Catalog updated."

      - name: Generate and upload dashboard cache to IA
        run: |
          uv run python scripts/generate_dashboard_cache.py --upload

      - name: Trigger dashboard deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-dashboard.yml',
              ref: 'main'
            });
