name: Update Catalog

on:
  workflow_dispatch:
    inputs:
      force_reconcile:
        description: 'Gerar e publicar indice_processual.parquet mesmo sem novos uploads'
        type: boolean
        default: false
  workflow_run:
    workflows: ["Consolidate Parquet"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Generate & Upload Catalog
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - uses: ./.github/actions/download-state

      - name: Append to JSONL manifest
        id: append
        run: |
          echo "Appending to JSONL manifest..."
          uv run python scripts/append_manifest.py

      - name: Validate manifest
        id: validate
        if: steps.append.outputs.has_new_uploads == 'true'
        run: |
          echo "Validating manifest data Integrity..."
          uv run python scripts/validate_manifest.py data/manifest.jsonl

      - name: Generate reconstructible catalog
        if: steps.append.outputs.has_new_uploads == 'true'
        run: |
          echo "Generating catalog from IA data..."
          uv run python scripts/generate_catalog.py --output ./catalog
          cp docs/CATALOG.md catalog/README.md

          echo "Publishing public catalog artifacts (excluding local DuckDB materialization)..."
          mapfile -d '' files < <(find catalog -maxdepth 1 -type f ! -name '*.duckdb' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No public catalog artifacts were generated."
            exit 1
          fi
          ia upload causaganha-catalog "${files[@]}" --no-derive
          echo "Catalog updated."

      - name: Reconcile processos (DJEN x JURIS x STJ x DataJud)
        if: steps.append.outputs.has_new_uploads == 'true' || github.event.inputs.force_reconcile == 'true'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Sources whose UNAVAILABILITY (not loaded at all, local or IA)
          # fails this step. JURIS and DataJud are deliberately excluded for
          # now: no tjro-juris-*/datajud-* IA items exist yet (their upload
          # pipelines have never landed data on IA), so requiring them would
          # hard-fail every catalog run. Their absence still surfaces as
          # ::warning annotations on every run. Add juris,datajud here as
          # soon as those uploads produce real IA items.
          RECONCILE_EXPECTED_SOURCES: djen,stj
        run: |
          echo "Reconciling indice_processual..."
          uv run python scripts/reconcile_processos.py
          echo "indice_processual.parquet uploaded."

      - name: Render query contracts and generate cache
        run: |
          uv run python scripts/render_queries.py
          uv run python scripts/generate_cache_from_manifest.py --upload

      - name: Trigger dashboard deploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main'
            });
