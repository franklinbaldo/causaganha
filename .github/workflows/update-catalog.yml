name: Update Catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-catalog.yml"
      - "scripts/generate_catalog.py"
      - "docs/CATALOG.md"
  workflow_dispatch:
    inputs:
      force_reconcile:
        description: 'Gerar e publicar indice_processual.parquet mesmo sem novos uploads'
        type: boolean
        default: false
      reconcile_only:
        description: 'Reconstruir índice do catálogo já publicado, sem revarrer o Archive'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Generate & Upload Catalog
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - uses: ./.github/actions/download-state

      - name: Append to JSONL manifest
        id: append
        run: |
          echo "Appending to JSONL manifest..."
          uv run python scripts/append_manifest.py

      - name: Validate manifest
        id: validate
        if: steps.append.outputs.has_new_uploads == 'true'
        run: |
          echo "Validating manifest data Integrity..."
          uv run python scripts/validate_manifest.py data/manifest.jsonl

      - name: Generate reconstructible catalog
        if: github.event.inputs.reconcile_only != 'true' && (steps.append.outputs.has_new_uploads == 'true' || github.event_name == 'push' || github.event.inputs.force_reconcile == 'true')
        env:
          FORCE_RECONCILE: ${{ inputs.force_reconcile }}
        run: |
          echo "Generating catalog from IA data..."
          args=(--verified-inventory)
          if [ "$FORCE_RECONCILE" = 'true' ]; then args+=(--full); fi
          uv run python scripts/generate_catalog.py --output ./catalog "${args[@]}"
          cp docs/CATALOG.md catalog/README.md

          # The public manifest currently has no duration_s column. Preserve the
          # historical helper-view shape without making catalog.sql depend on a
          # column that is not part of the published manifest contract.
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/catalog.sql")
          sql = path.read_text(encoding="utf-8")
          old = "    AVG(duration_s) as avg_latency_s"
          new = "    CAST(NULL AS DOUBLE) as avg_latency_s"
          if old not in sql:
              raise SystemExit("expected collection_status latency expression not found")
          path.write_text(sql.replace(old, new, 1), encoding="utf-8")
          PY

          echo "Publishing public catalog artifacts (excluding local DuckDB materialization)..."
          mapfile -d '' files < <(find catalog -maxdepth 1 -type f ! -name '*.duckdb' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No public catalog artifacts were generated."
            exit 1
          fi
          uv run ia upload causaganha-catalog "${files[@]}" --no-derive
          echo "Catalog updated."

      - name: Download published catalog for reconciliation
        if: github.event.inputs.reconcile_only == 'true'
        run: |
          mkdir -p catalog
          curl --fail --location --retry 3 --max-time 180 \
            'https://archive.org/download/causaganha-catalog/manifest.parquet' \
            --output catalog/manifest.parquet
          uv run python - <<'PY'
          import duckdb
          with duckdb.connect() as con:
              count = con.execute("SELECT count(*) FROM read_parquet('catalog/manifest.parquet') WHERE table_name = 'comunicacoes'").fetchone()[0]
          if not count:
              raise SystemExit("Published catalog has no DJEN Parquets; refusing reconciliation")
          print(f"Pinned published catalog: {count} comunicacoes Parquets")
          PY

      - name: Reconcile processos (DJEN x JURIS x STJ x DataJud)
        if: steps.append.outputs.has_new_uploads == 'true' || github.event.inputs.force_reconcile == 'true' || github.event.inputs.reconcile_only == 'true'
        env:
          RECONCILE_CATALOG_MANIFEST: catalog/manifest.parquet
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Sources whose UNAVAILABILITY (not loaded at all, local or IA)
          # fails this step. All four now publish real IA items
          # (tjro-juris-{year}, datajud-{tribunal}) — see
          # tests/test_update_catalog_workflow.py and issue #924 3.1. Keep
          # this in sync with SOURCE_NAMES in scripts/reconcile_processos.py.
          RECONCILE_EXPECTED_SOURCES: djen,juris,stj,datajud
        run: |
          echo "Reconciling indice_processual..."
          uv run python scripts/reconcile_processos.py
          echo "indice_processual.parquet uploaded."

      - name: Render query contracts and generate cache
        run: |
          uv run python scripts/render_queries.py
          uv run python scripts/generate_cache_from_manifest.py --upload

      - name: Trigger dashboard deploy
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main'
            });
