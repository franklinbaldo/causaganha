name: Cleanup IA Parquets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List files without deleting (dry run)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete parquet files from IA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Delete legacy parquet files from Internet Archive items
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run python -c "
          import internetarchive as ia
          import os
          import re

          # Consolidated table names from consolidate.py TABLE_SCHEMAS
          VALID_PARQUETS = {
              'comunicacoes.parquet', 'advogados.parquet', 'advogado_nomes.parquet',
              'destinatarios.parquet', 'comunicacao_advogados.parquet', 'textos.parquet',
              'representacoes.parquet', 'processos.parquet', 'classificacoes.parquet',
              'partes.parquet',
          }

          dry_run = os.environ.get('DRY_RUN', 'true') == 'true'
          mode = 'DRY RUN' if dry_run else 'DELETE'
          access = os.environ.get('IAS3_ACCESS_KEY')
          secret = os.environ.get('IAS3_SECRET_KEY')

          print(f'=== {mode} MODE ===')
          print(f'Keeping consolidated parquets: {sorted(VALID_PARQUETS)}')
          print()

          search = ia.search_items('identifier:djen-* AND creator:CausaGanha')
          items = sorted([r['identifier'] for r in search])
          print(f'Found {len(items)} items')
          print()

          total_to_delete = 0
          total_kept = 0
          total_size = 0
          errors = 0
          summary = []

          for item_id in items:
              item = ia.get_item(item_id)
              parquets = [f for f in item.files if f['name'].endswith('.parquet')]

              if not parquets:
                  continue

              # For djen-YYYY-MM-DD items, keep consolidated parquets
              is_date_item = bool(re.match(r'^djen-\d{4}-\d{2}-\d{2}$', item_id))
              to_delete = []
              to_keep = []

              for f in parquets:
                  if is_date_item and f['name'] in VALID_PARQUETS:
                      to_keep.append(f)
                  else:
                      to_delete.append(f)

              if not to_delete:
                  total_kept += len(to_keep)
                  continue

              del_size = sum(int(f.get('size', 0)) for f in to_delete)
              total_size += del_size

              print(f'{item_id}: deleting {len(to_delete)}, keeping {len(to_keep)}')
              for f in to_delete:
                  size_mb = int(f.get('size', 0)) / (1024 * 1024)
                  print(f'  x {f[\"name\"]} ({size_mb:.1f} MB)')
              for f in to_keep:
                  print(f'  + {f[\"name\"]} (kept)')

              if not dry_run:
                  filenames = [f['name'] for f in to_delete]
                  try:
                      responses = ia.delete(
                          item_id,
                          files=filenames,
                          cascade_delete=True,
                          access_key=access,
                          secret_key=secret,
                      )
                      failed = [r for r in responses if r.status_code != 204]
                      if failed:
                          print(f'  FAILED {len(failed)}/{len(responses)} deletions')
                          errors += len(failed)
                      else:
                          print(f'  DELETED {len(responses)} files')
                  except Exception as e:
                      print(f'  ERROR: {e}')
                      errors += len(to_delete)

              total_to_delete += len(to_delete)
              total_kept += len(to_keep)
              summary.append((item_id, len(to_delete), len(to_keep)))

          print()
          print(f'=== SUMMARY ({mode}) ===')
          print(f'Items scanned: {len(items)}')
          print(f'Parquets to delete: {total_to_delete}')
          print(f'Parquets kept: {total_kept}')
          print(f'Size to free: {total_size / (1024*1024):.1f} MB')
          if errors:
              print(f'Errors: {errors}')
          for item_id, deleted, kept in summary:
              print(f'  {item_id}: -{deleted} +{kept}')

          if dry_run:
              print()
              print('This was a DRY RUN. Re-run with dry_run=false to actually delete.')
          "

      - name: Write job summary
        if: always()
        run: |
          echo "## Parquet Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode: **${{ inputs.dry_run == 'true' && 'Dry Run' || 'Delete' }}**" >> $GITHUB_STEP_SUMMARY
