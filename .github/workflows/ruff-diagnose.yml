name: Ruff Diagnose

on:
  push:
    branches: [feat/djen-publication-provenance]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Capture Ruff diagnostic
        run: |
          uv run ruff check --output-format=concise . > .ruff-diagnostic.txt 2>&1 || true
          cat .ruff-diagnostic.txt
      - name: Commit diagnostic when changed
        run: |
          if git diff --quiet -- .ruff-diagnostic.txt && git ls-files --error-unmatch .ruff-diagnostic.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ruff-diagnostic.txt
          git commit -m "chore: record Ruff diagnostic"
          git push
