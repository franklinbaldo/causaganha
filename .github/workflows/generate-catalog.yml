name: Generate Catalog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect ZIPs"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: generate-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Generate & Upload Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Restore backfill state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/backfill-state.json
            data/ia-state.json
          key: collect-state-v7-${{ github.event.workflow_run.id }}
          restore-keys: |
            collect-state-v7-

      - name: Create data directory
        run: mkdir -p data

      - name: Ensure state files exist for caching
        run: |
          [ -f data/backfill-state.json ] || echo '{}' > data/backfill-state.json
          [ -f data/ia-state.json ] || echo '{}' > data/ia-state.json
          echo "State files:"
          ls -lh data/

      - name: Append to JSONL manifest
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          echo "Appending to JSONL manifest..."
          uv run python scripts/append_manifest.py

      - name: Commit manifest.jsonl to dashboard
        run: |
          [ -f data/manifest.jsonl ] || { echo "No manifest.jsonl generated, skipping"; exit 0; }
          cp data/manifest.jsonl dashboard/public/manifest.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/manifest.jsonl
          git diff --staged --quiet || git commit -m "data: update manifest.jsonl [skip ci]"
          git push

      - name: Generate and upload catalog
        run: |
          echo "Generating catalog from IA data..."
          uv run python scripts/generate_catalog.py --upload
          echo "Catalog updated."

      - name: Generate and upload dashboard cache to IA
        run: |
          uv run python scripts/generate_dashboard_cache.py --upload --manifest catalog/manifest.parquet

      - name: Trigger dashboard deploy
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-dashboard.yml',
              ref: 'main'
            });
