name: Generate Catalog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Collect ZIPs", "Collect Today"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-catalog
  cancel-in-progress: false

jobs:
  catalog:
    name: Generate & Upload Catalog
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Download state from Internet Archive
        run: |
          mkdir -p data
          curl -sSfL -o data/ia-state.json \
            "https://archive.org/download/causaganha-dashboard/ia-state.json" || echo '{}' > data/ia-state.json
          curl -sSfL -o data/backfill-state.json \
            "https://archive.org/download/causaganha-dashboard/backfill-state.json" || echo '{}' > data/backfill-state.json
          echo "State files:"
          ls -lh data/

      - name: Append to JSONL manifest
        id: append
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          echo "Appending to JSONL manifest..."
          uv run python scripts/append_manifest.py

      - name: Generate and upload catalog
        if: steps.append.outputs.has_new_uploads == 'true'
        run: |
          echo "Generating catalog from IA data..."
          uv run python scripts/generate_catalog.py --upload
          echo "Catalog updated."

      - name: Generate and upload dashboard cache to IA
        if: steps.append.outputs.has_new_uploads == 'true'
        run: |
          uv run python scripts/generate_dashboard_cache.py --upload --manifest catalog/manifest.parquet

      - name: Trigger dashboard deploy
        if: steps.append.outputs.has_new_uploads == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-dashboard.yml',
              ref: 'main'
            });
