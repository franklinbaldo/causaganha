name: Vendor PJe Swagger

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Swagger/OpenAPI URL to fetch (use a mirror if the origin is geo-blocked)"
        required: true
        default: "https://comunicaapi.pje.jus.br/swagger/djen.yml"
      exit_node:
        description: "Optional Tailscale exit node (Brazil) to bypass geo-blocking (requires TS_AUTHKEY secret)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale (optional)
        if: ${{ inputs.exit_node != '' && secrets.TS_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: >-
            --accept-dns=false
            --accept-routes=false
            --exit-node-allow-lan-access=false
        env:
          TS_EXIT_NODE: ${{ inputs.exit_node }}

      - name: Set Tailscale exit node
        if: ${{ inputs.exit_node != '' && secrets.TS_AUTHKEY != '' }}
        env:
          TS_EXIT_NODE: ${{ inputs.exit_node }}
        run: tailscale set --exit-node="$TS_EXIT_NODE"

      - uses: ./.github/actions/setup

      - name: Fetch swagger spec
        env:
          SWAGGER_URL: ${{ inputs.url }}
        run: uv run python scripts/vendor_pje_swagger.py --url "$SWAGGER_URL"

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add openapi/pje-comunicaapi-djen.swagger.yml
            git commit -m "chore(openapi): vendor PJe DJEN swagger"
            git push
          else
            echo "No changes."
          fi
