name: V2 Daily Collection

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .

      - name: Run Collection
        run: uv run causaganha collect --days-back 7
        env:
          LOG_LEVEL: INFO
          # NOTE: In a real distributed setup, we would need to:
          # 1. Pull existing database from S3/GCS/Artifacts
          # 2. Run collection
          # 3. Push updated database back to storage
