name: Render Manifest Parquet

# Manifest COMPACTION (Phase 3, docs/planning/manifest-source-of-truth.md §4.3, §5).
# Single writer of the sync-manifest.parquet base: absorbs the immutable
# manifest-log/*.csv segments (engine/drain/probe) plus legacy upload-deltas,
# uploads the new base, then prunes absorbed segments to manifest-log/compacted/.
# The concurrency group serializes compaction runs (plan §4.3). The legacy
# sync-manifest.csv is retired as a source and no longer auto-exported here —
# set MANIFEST_COMPACT_WRITEBACK=1 manually to produce it on demand.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Upload Backlog"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-manifest-parquet
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
        with:
          dev: "false"
      - run: uv run --no-dev python scripts/render_manifest_parquet.py
