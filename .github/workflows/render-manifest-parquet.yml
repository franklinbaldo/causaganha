name: Render Manifest Parquet

# Manifest COMPACTION (Phase 2, docs/planning/manifest-source-of-truth.md §4.3).
# Single writer of the sync-manifest.parquet base: absorbs the immutable
# manifest-log/*.csv segments (engine/drain/probe) plus legacy upload-deltas,
# uploads the new base, then prunes absorbed segments to manifest-log/compacted/.
# The concurrency group serializes compaction runs (plan §4.3). With
# MANIFEST_COMPACT_WRITEBACK on, also exports the merged state as the legacy
# sync-manifest.csv (a derived read replica — writers no longer touch it).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Upload Backlog"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-manifest-parquet
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      # Keep the legacy CSV fresh as a derived export while consumers migrate
      # (Phase 3 retires it). Safe: the Phase 2 engine never rewrites the CSV.
      MANIFEST_COMPACT_WRITEBACK: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv run --no-dev python scripts/render_manifest_parquet.py
