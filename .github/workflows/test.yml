name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: uv run ruff format --check
      - name: "Check lint (strict: security + policy)"
        # Blocking rules: the full `S` security family (bandit port —
        # SQL injection, URL open, subprocess, shell=True, pickle,
        # TLS verify, hash, asserts, etc.), CLAUDE.md-banned BLE001
        # (blind Exception), B904 (raise-from for exception chaining),
        # and TRY300 (try/else restructure). Using the family code `S`
        # instead of an enumerated list so future S-rule additions are
        # automatically enforced. Legacy violations in specific files
        # are locked in via per-file-ignores in ruff.toml so this step
        # passes today while blocking new violations in clean files.
        run: uv run ruff check --select S,BLE001,B904,TRY300
      - name: "Check lint (advisory: style)"
        # Everything else (E501, D10x, FBT003, PLR2004, PLC0415, ANN401,
        # PERF401, etc.) — ~265 pre-existing cosmetic violations that
        # stay visible in CI logs as non-blocking regression signal.
        run: uv run ruff check --ignore S,BLE001,B904,TRY300
        continue-on-error: true
      - name: Check dead code
        run: uvx vulture src/ scripts/ vulture_whitelist.py --min-confidence 100
      - name: Check notebooks synced
        # Notebooks are authored as marimo notebooks (notebooks/*.py); the
        # committed *.ipynb must match `marimo export ipynb`. Fails if a
        # generated Jupyter notebook is stale (regenerate with --fix).
        run: uv run python scripts/check_notebooks_synced.py
      - name: Validate query contracts (.qmd)
        # RFC 0007: static validation of web/src/queries/*.qmd — required
        # frontmatter fields + SQL executed against synthetic schemas derived
        # from the same view registry the render uses. No network needed.
        run: uv run python scripts/render_queries.py --check
      - name: Auto-fix linting issues
        if: failure() && github.event_name == 'pull_request' && endsWith(github.actor, '[bot]')
        run: |
          uvx ruff format . || true
          uvx ruff check --fix . || true
          uv run python scripts/check_notebooks_synced.py --fix || true
          npx prettier --write . || true

          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "style: auto-fix lint violations [bot]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Stub pipeline-generated data files
        # web/public/data/ is gitignored and generated by render_queries.py in
        # deploy-web.yml. The build requires these files to exist for static
        # Vite imports in stats.astro. Create minimal valid stubs for CI.
        working-directory: .
        run: |
          mkdir -p web/public/data
          echo '{"total":0,"uploaded":0,"pending":0,"absent":0,"unknown":0,"coverage_pct":0,"tribunals_total":96,"tribunals_with_data":0}' > web/public/data/totals.json
          echo '{"avg_coverage":0,"best_count":0,"best_day":null,"worst_count":0,"worst_day":null}' > web/public/data/stats_coverage.json
          echo '[{"court":"placeholder","collected":0,"absent":0,"total":0,"rate":0}]' > web/public/data/court_reliability.json
          echo '[{"day_idx":0,"name":"Dom","avg":0,"days_count":0},{"day_idx":1,"name":"Seg","avg":0,"days_count":0},{"day_idx":2,"name":"Ter","avg":0,"days_count":0},{"day_idx":3,"name":"Qua","avg":0,"days_count":0},{"day_idx":4,"name":"Qui","avg":0,"days_count":0},{"day_idx":5,"name":"Sex","avg":0,"days_count":0},{"day_idx":6,"name":"Sab","avg":0,"days_count":0}]' > web/public/data/weekly_pattern.json
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

