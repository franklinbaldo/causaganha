name: CI

on:
  pull_request:
  push:
    branches: [main]

# Normal CI is intentionally read-only. Write-capable automation belongs in
# a separate, explicitly trusted workflow rather than in validation jobs.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check lint
        # All enabled Ruff rules are blocking. Legacy exceptions are documented
        # as targeted per-file ignores in ruff.toml instead of being hidden by
        # a non-blocking advisory lint pass.
        run: uv run ruff check
      - name: Check dead code
        run: uvx vulture src/ scripts/ vulture_whitelist.py --min-confidence 100
      - name: Check notebooks synced
        # Notebooks are authored as marimo notebooks (notebooks/*.py); the
        # committed *.ipynb must match `marimo export ipynb`. Fails if a
        # generated Jupyter notebook is stale (regenerate with --fix).
        run: uv run python scripts/check_notebooks_synced.py
      - name: Validate query contracts (.qmd)
        # RFC 0007: static validation of web/src/queries/*.qmd — required
        # frontmatter fields + SQL executed against synthetic schemas derived
        # from the same view registry the render uses. No network needed.
        run: uv run python scripts/render_queries.py --check

  supply-chain:
    # #1614/TM-10: SBOM + vulnerability scan gate. Scans the exact dependency
    # set the MCP image ships (`--no-dev`, matching deployment/mcp/Dockerfile's
    # `uv sync --frozen --no-dev --no-editable`), not the full dev environment
    # -- doc-tooling deps this project never ships (e.g. mkdocs-material's
    # transitive pymdown-extensions pin) are out of scope here, tracked
    # separately in docs/SECURITY_THREAT_MODEL.md TM-10.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Export shipped (no-dev) dependency set
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-mcp.txt
      - name: Scan shipped dependencies and emit SBOM
        # Fails the build on any known vulnerability (pip-audit's default
        # exit code 1) -- not swallowed, not advisory-only.
        run: uv run pip-audit -r requirements-mcp.txt --format cyclonedx-json --output sbom-mcp.json
      - name: Publish SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-mcp-${{ github.sha }}
          path: sbom-mcp.json
          if-no-files-found: warn
          retention-days: 90

  tests:
    runs-on: ubuntu-latest
    # The segmenter dataset suite (tests/segmenter_dataset) scales with the
    # real training corpus size (#1050 keeps growing it every batch, 173
    # documents as of 2026-09-19) and now sits right at the edge of a
    # 15-minute budget: one run completed in ~13min, two more on
    # functionally-identical code were killed by the timeout at 15min.
    # Bumped for headroom rather than shrinking the corpus or the suite.
    timeout-minutes: 25
    strategy:
      matrix:
        # Single-tribunal on purpose: run-tests just exports TRIBUNAL as an
        # env var, but nothing in tests/ or src/ reads it today — pytest runs
        # the exact same suite regardless of the value, so adding tribunals
        # would only duplicate identical CI runs. Extend this matrix once
        # tests actually parameterize on TRIBUNAL (e.g. per-tribunal fixtures).
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}

  djen-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -v
      - name: Build
        run: go build ./...

  archive-cors-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/archive-cors-proxy
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: deployment/archive-cors-proxy/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Check bundle (dry-run, no deploy)
        run: npm run check

  relay-cf:
    # TM-02 / #1609: this job was missing entirely before this change, so
    # deployment/relay-cf/test/index.test.js (the egress-policy suite for
    # the Cloudflare relay Worker) never ran in CI — mirrors the
    # archive-cors-proxy job above, the closest sibling Worker in this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/relay-cf
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: deployment/relay-cf/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Check bundle (dry-run, no deploy)
        run: npm run check

