name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check lint (informational)
        continue-on-error: true
        run: uv run ruff check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - name: Build documentation
        run: uv run mkdocs build 2>&1 | tee mkdocs.log
      - name: Parse docs warnings digest
        run: uv run python scripts/dashboard/parse_mkdocs_logs.py mkdocs.log docs-warnings.json
        continue-on-error: true
      - name: Upload docs warnings artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: docs-warnings
          path: docs-warnings.json
