name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup
      - name: Format and lint code
        run: |
          uv run ruff format
          uv run ruff check --fix
      - name: Run pre-commit
        id: run_pre_commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true
      - name: Commit changes
        if: always()
        run: |
          # check if there are any changes
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected by pre-commit hooks. Committing and pushing..."
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"

            # Add all changes (including untracked files if any)
            git add .
            git commit -m "chore(ci): auto-fix linting"

            # Push to the branch explicitly to handle detached HEAD
            git push origin HEAD:${{ github.head_ref }}

            echo "Changes pushed. Failing this job to trigger a new run with the fixes."
            exit 1
          fi

          # If no changes were made but pre-commit failed, it's a real error (e.g. MyPy failure)
          if [ "${{ steps.run_pre_commit.outcome }}" == "failure" ]; then
            echo "Pre-commit failed but no changes were made to fix it. Human intervention required."
            exit 1
          fi

          echo "Pre-commit passed or was fixed."
  tribunal-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}
  docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build documentation
        run: uv run mkdocs build --strict
