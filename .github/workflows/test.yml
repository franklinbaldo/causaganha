name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check lint
        run: uv run ruff check
      - name: Check dead code
        run: uvx vulture src/ scripts/ vulture_whitelist.py --min-confidence 100
      - name: Auto-fix linting issues
        if: failure() && github.event_name == 'pull_request' && endsWith(github.actor, '[bot]')
        run: |
          uvx ruff format . || true
          uvx ruff check --fix . || true
          npx prettier --write . || true

          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .
            git commit -m "style: auto-fix lint violations [bot]"
            git push origin HEAD:${{ github.head_ref }}
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

