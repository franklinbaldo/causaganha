name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every normal CI job is intentionally read-only, including lint and validation.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: uv run ruff format --check
      - name: Check lint
        # All enabled Ruff rules are blocking. Legacy exceptions are documented
        # as targeted per-file ignores in ruff.toml instead of being hidden by
        # a non-blocking advisory lint pass.
        run: uv run ruff check
      - name: Check dead code
        run: uv run vulture src/ scripts/ vulture_whitelist.py --min-confidence 100
      - name: Check notebooks synced
        # Notebooks are authored as marimo notebooks (notebooks/*.py); the
        # committed *.ipynb must match `marimo export ipynb`. Fails if a
        # generated Jupyter notebook is stale (regenerate with --fix).
        run: uv run python scripts/check_notebooks_synced.py
      - name: Validate query contracts (.qmd)
        # RFC 0007: static validation of web/src/queries/*.qmd — required
        # frontmatter fields + SQL executed against synthetic schemas derived
        # from the same view registry the render uses. No network needed.
        run: uv run python scripts/render_queries.py --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Single-tribunal on purpose: run-tests just exports TRIBUNAL as an
        # env var, but nothing in tests/ or src/ reads it today — pytest runs
        # the exact same suite regardless of the value, so adding tribunals
        # would only duplicate identical CI runs. Extend this matrix once
        # tests actually parameterize on TRIBUNAL (e.g. per-tribunal fixtures).
        tribunal: [tjro]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/run-tests
        with:
          tribunal: ${{ matrix.tribunal }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Stub pipeline-generated data files
        # web/public/data/ is gitignored and generated by render_queries.py in
        # deploy-web.yml. The build requires these files to exist for static
        # Vite imports in stats.astro. Create minimal valid stubs for CI.
        # site-status.json is MANDATORY at build time (loadSiteStatus fails the
        # build if it is missing, generated_at is older than 7 days, or more
        # than 5 min in the future), so the stub uses a fresh timestamp. With
        # null last_attempt_at/last_success_at the build derives
        # freshness=desconhecido (see evaluateSourceFreshness in siteStatus.ts).
        working-directory: .
        run: |
          mkdir -p web/public/data
          echo "{\"generated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"sources\":{\"djen\":{\"zips_archived\":0,\"pairs_total\":0,\"tribunals_with_data\":0,\"tribunals_total\":0,\"coverage_pct\":null,\"earliest_tracked_date\":null,\"earliest_upload_date\":null,\"latest_upload_date\":null,\"absent_confirmed\":0,\"pending_real\":0,\"errors_transient\":0,\"never_checked\":0,\"last_attempt_at\":null,\"last_success_at\":null}}}" > web/public/data/site-status.json
          echo '{"total":0,"uploaded":0,"pending":0,"absent":0,"unknown":0,"coverage_pct":0,"tribunals_total":96,"tribunals_with_data":0}' > web/public/data/totals.json
          echo '{"avg_coverage":0,"best_count":0,"best_day":null,"worst_count":0,"worst_day":null}' > web/public/data/stats_coverage.json
          echo '[{"court":"placeholder","collected":0,"absent":0,"total":0,"rate":0}]' > web/public/data/court_reliability.json
          echo '[{"day_idx":0,"name":"Dom","avg":0,"days_count":0},{"day_idx":1,"name":"Seg","avg":0,"days_count":0},{"day_idx":2,"name":"Ter","avg":0,"days_count":0},{"day_idx":3,"name":"Qua","avg":0,"days_count":0},{"day_idx":4,"name":"Qui","avg":0,"days_count":0},{"day_idx":5,"name":"Sex","avg":0,"days_count":0},{"day_idx":6,"name":"Sab","avg":0,"days_count":0}]' > web/public/data/weekly_pattern.json
          echo '[{"tribunal":"PLACEHOLDER","uploaded":1,"pending":0,"absent":0,"unknown":0,"total":1,"coverage_pct":100.0,"earliest_upload":"2026-01-01","latest_upload":"2026-01-01"}]' > web/public/data/tribunal_coverage.json
          echo '[{"tribunal":"PLACEHOLDER","date":"2026-01-01","status":"uploaded"}]' > web/public/data/tribunal_calendar.json
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
