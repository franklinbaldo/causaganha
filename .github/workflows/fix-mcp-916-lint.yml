name: Temporary sync processo_estado from 919

on:
  push:
    branches:
      - mcp/890-datajud-processo

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: mcp/890-datajud-processo
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Copy the validated processo_estado source from child branch
        run: |
          git fetch origin mcp/917-publicacoes-archive --depth=1
          git show FETCH_HEAD:src/causaganha_mcp/tools/datajud_processo.py > src/causaganha_mcp/tools/datajud_processo.py
          uv run ruff format --check src/causaganha_mcp/tools/datajud_processo.py
          uv run ruff check src/causaganha_mcp/tools/datajud_processo.py
      - name: Commit source and remove this workflow
        run: |
          rm .github/workflows/fix-mcp-916-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/causaganha_mcp/tools/datajud_processo.py .github/workflows/fix-mcp-916-lint.yml
          git commit -m 'style(mcp): clean processo_estado strict lint'
          git push origin HEAD:mcp/890-datajud-processo
