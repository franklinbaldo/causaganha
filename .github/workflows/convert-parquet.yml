name: Convert ZIPs to Parquet

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Specific item to convert (e.g., djen-raw-2026-01-21-TJSP)'
        required: false

concurrency:
  group: convert-parquet
  cancel-in-progress: false

env:
  MAX_ITEMS_PER_RUN: 10

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install internetarchive duckdb numpy httpx
          mkdir -p ~/.config/internetarchive
          printf '[s3]\naccess = %s\nsecret = %s\n' "$IAS3_ACCESS_KEY" "$IAS3_SECRET_KEY" > ~/.config/internetarchive/ia.ini
          echo "Dependencies installed, IA config created"

      - name: Find items to convert
        id: find
        run: |
          # Handle specific item input
          if [ -n "${{ inputs.item_id }}" ]; then
            echo "${{ inputs.item_id }}" > batch.txt
            echo "batch_size=1" >> $GITHUB_OUTPUT
            echo "total=1" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Fetching raw items from IA..."
          uv run ia search 'identifier:djen-raw-*' --itemlist > raw_items.txt 2>/dev/null || touch raw_items.txt
          RAW_COUNT=$(wc -l < raw_items.txt | tr -d ' ')
          echo "Found $RAW_COUNT raw items"

          echo "Fetching raw items from IA..."
          uv run ia search 'identifier:djen-raw-* AND NOT format:Parquet' --itemlist > to_convert.txt 2>/dev/null || touch to_convert.txt

          TOTAL=$(wc -l < to_convert.txt | tr -d ' ')
          echo "Found $TOTAL items to convert"
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          head -n $MAX_ITEMS_PER_RUN to_convert.txt > batch.txt
          BATCH_SIZE=$(wc -l < batch.txt | tr -d ' ')
          echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT

      - name: Convert batch
        if: steps.find.outputs.batch_size != '0'
        run: |
          uv run python djen-scraper/scripts/convert_to_parquet.py batch.txt

      - name: Summary
        run: |
          echo "## Convert Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Total pending: ${{ steps.find.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- Batch processed: ${{ steps.find.outputs.batch_size }}" >> $GITHUB_STEP_SUMMARY
