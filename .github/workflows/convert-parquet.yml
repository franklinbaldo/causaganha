name: Convert ZIPs to Parquet

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to convert (YYYY-MM-DD)'
        required: false
      tribunal:
        description: 'Specific tribunal (e.g., TJSP) - optional'
        required: false

concurrency:
  group: convert-parquet
  cancel-in-progress: false

env:
  MAX_FILES_PER_RUN: 50

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install internetarchive duckdb numpy httpx
          mkdir -p ~/.config/internetarchive
          printf '[s3]\naccess = %s\nsecret = %s\n' "$IAS3_ACCESS_KEY" "$IAS3_SECRET_KEY" > ~/.config/internetarchive/ia.ini
          echo "Dependencies installed, IA config created"

      - name: Find ZIPs to convert
        id: find
        run: |
          # Handle specific date/tribunal input
          SPECIFIC_DATE="${{ inputs.date }}"
          SPECIFIC_TRIBUNAL="${{ inputs.tribunal }}"

          if [ -n "$SPECIFIC_DATE" ]; then
            ITEM_ID="djen-${SPECIFIC_DATE}"
            echo "Processing specific item: $ITEM_ID"

            # List ZIPs in the item
            uv run ia list "$ITEM_ID" 2>/dev/null | grep '\.zip$' > all_zips.txt || touch all_zips.txt

            # List existing Parquets
            uv run ia list "$ITEM_ID" 2>/dev/null | grep '\.parquet$' > existing_parquets.txt || touch existing_parquets.txt

            # Find ZIPs without corresponding parquets
            > to_convert.txt
            while read -r ZIP; do
              # Extract tribunal from ZIP name (e.g., djen-2026-01-21-TJSP.zip -> TJSP)
              TRIBUNAL=$(echo "$ZIP" | sed 's/djen-[0-9-]*-//' | sed 's/\.zip$//')

              # Filter by specific tribunal if provided
              if [ -n "$SPECIFIC_TRIBUNAL" ] && [ "$TRIBUNAL" != "$SPECIFIC_TRIBUNAL" ]; then
                continue
              fi

              # Check if parquet exists (look for comunicacoes parquet as indicator)
              PARQUET="djen-${SPECIFIC_DATE}-${TRIBUNAL}-comunicacoes.parquet"
              if ! grep -q "^${PARQUET}$" existing_parquets.txt; then
                echo "${SPECIFIC_DATE}|${TRIBUNAL}" >> to_convert.txt
              fi
            done < all_zips.txt
          else
            echo "Finding all items with unconverted ZIPs..."

            # Get all djen items (djen-YYYY-MM-DD format)
            uv run ia search 'identifier:djen-20*' --itemlist > items.txt 2>/dev/null || touch items.txt

            > to_convert.txt
            while read -r ITEM_ID; do
              # Extract date from item ID (djen-2026-01-21 -> 2026-01-21)
              DATE=$(echo "$ITEM_ID" | sed 's/djen-//')

              # List files in item
              uv run ia list "$ITEM_ID" 2>/dev/null > item_files.txt || continue

              # Find ZIPs
              grep '\.zip$' item_files.txt > item_zips.txt 2>/dev/null || continue

              # Find existing Parquets
              grep '\.parquet$' item_files.txt > item_parquets.txt 2>/dev/null || touch item_parquets.txt

              # Check each ZIP
              while read -r ZIP; do
                # Extract tribunal from ZIP name (djen-2026-01-21-TJSP.zip -> TJSP)
                TRIBUNAL=$(echo "$ZIP" | sed 's/djen-[0-9-]*-//' | sed 's/\.zip$//')
                PARQUET="djen-${DATE}-${TRIBUNAL}-comunicacoes.parquet"

                if ! grep -q "^${PARQUET}$" item_parquets.txt; then
                  echo "${DATE}|${TRIBUNAL}" >> to_convert.txt
                fi
              done < item_zips.txt

            done < items.txt
          fi

          TOTAL=$(wc -l < to_convert.txt | tr -d ' ')
          echo "Found $TOTAL ZIPs to convert"
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          head -n $MAX_FILES_PER_RUN to_convert.txt > batch.txt
          BATCH_SIZE=$(wc -l < batch.txt | tr -d ' ')
          echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT

      - name: Convert batch
        if: steps.find.outputs.batch_size != '0'
        run: |
          uv run python djen-scraper/scripts/convert_to_parquet.py batch.txt

      - name: Summary
        run: |
          echo "## Convert Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Total pending: ${{ steps.find.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- Batch processed: ${{ steps.find.outputs.batch_size }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Structure" >> $GITHUB_STEP_SUMMARY
          echo "- Parquets uploaded to same item as source ZIP" >> $GITHUB_STEP_SUMMARY
          echo "- Item: \`djen-YYYY-MM-DD\`" >> $GITHUB_STEP_SUMMARY
          echo "- Files: \`djen-YYYY-MM-DD-TRIBUNAL-*.parquet\`" >> $GITHUB_STEP_SUMMARY
