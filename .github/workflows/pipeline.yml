# ============================================================================
# CAUSAGANHA DATA PIPELINE
# ============================================================================
#
# All pipeline logic lives in scripts/pipeline/run.py.
# This workflow only handles: schedule, secrets, and GH-specific post-steps.
#
# DATA FLOW (managed by run.py):
#   [collect | consolidate | embed]  (parallel)
#          -> catalog -> dashboard   (sequential, conditional)
#
# NOTE: Single-job design exposes all secrets to every step.
# This is a conscious trade-off for simpler orchestration.
# The original multi-job layout scoped secrets per job.
#
# Local debugging:
#   python scripts/pipeline/run.py --job collect
#   python scripts/pipeline/run.py --job all --date 2026-01-15
#
# ============================================================================

name: Data Pipeline

on:
  schedule:
    - cron: '*/20 * * * *'

  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run (collect, consolidate, embed, catalog, dashboard, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - collect
          - consolidate
          - embed
          - catalog
          - dashboard
      date:
        description: 'Specific date (YYYY-MM-DD) - optional for collect/consolidate'
        required: false
      tribunal:
        description: 'Specific tribunal (e.g., TJSP) - optional for collect'
        required: false

permissions:
  contents: read
  actions: write

jobs:
  pipeline:
    name: Run Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: dev

    env:
      DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Prevent concurrent pipeline runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pipeline.yml/runs?status=in_progress&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")

          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "::warning::Another pipeline run is already in progress. Cancelling this run."
            gh run cancel ${{ github.run_id }}
            sleep 5
            exit 1
          fi
          echo "No concurrent pipeline runs detected. Proceeding."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Run pipeline
        id: pipeline
        run: |
          uv run python scripts/pipeline/run.py \
            --job "${{ github.event.inputs.job || 'all' }}" \
            --date "${{ github.event.inputs.date || '' }}" \
            --tribunal "${{ github.event.inputs.tribunal || '' }}"

      - name: Upload DuckDB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causaganha-db
          path: |
            data/causaganha.duckdb
            catalog/catalog.duckdb
          retention-days: 7
          if-no-files-found: warn

      - name: Save dashboard cache
        if: steps.pipeline.outputs.catalog_updated == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dashboard/public/cache
          key: dashboard-cache-${{ github.run_number }}

      - name: Trigger dashboard deployment
        if: steps.pipeline.outputs.catalog_updated == 'true'
        run: gh workflow run deploy-dashboard.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
