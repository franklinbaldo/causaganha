# ============================================================================
# CAUSAGANHA DATA PIPELINE
# ============================================================================
#
# This is the main data pipeline workflow that handles all data acquisition,
# processing, and archival for the CausaGanha project.
#
# ARCHITECTURE OVERVIEW:
# ----------------------
# The pipeline collects judicial communication data from DJEN (Diário de
# Justiça Eletrônico Nacional), converts it to analytics-friendly formats,
# generates embeddings for semantic search, and maintains a master catalog.
#
#   DJEN API → Collect ──┐
#                        ├──→ Catalog → Dashboard Cache
#              Convert ──┘
#              Embed (independent)
#
# SCHEDULE:
# ---------
# Each job has its own cron trigger. Jobs filter on github.event.schedule
# to only run when their specific cron fires:
#
#   Job          | Frequency    | Cron expression
#   -------------|--------------|------------------------------------------
#   collect      | Every 5 min  | */5 * * * *
#   consolidate  | Every 10 min | 0,10,20,30,40,50 * * * *
#   embed        | Every hour   | 5 * * * *
#   catalog      | Daily 6 AM   | 0 6 * * *
#
# DATA FLOW:
# ----------
# 1. COLLECT: Download ZIPs from DJEN API → Upload to Internet Archive
#    - Checks what's already on IA to avoid duplicates
#    - Handles 91 Brazilian courts (TRFs, TJs, TRTs, TREs, Superior courts)
#    - Structure: djen-YYYY-MM-DD/djen-YYYY-MM-DD-TRIBUNAL.zip
#
# 2. CONVERT: Download ZIPs from IA → Convert to Parquet → Upload to IA
#    - Extracts structured data: comunicacoes, advogados, partes
#    - ZSTD compression for efficient storage and queries
#    - Same IA item as source ZIP
#
# 3. EMBED: Generate vector embeddings for semantic search
#    - Uses Jina/Google embedding APIs
#    - Stores in DuckDB with vector extension
#    - Exports to Parquet for archival
#
# 4. CATALOG: Build master index of all data on Internet Archive
#    - manifest.parquet: Index of all files
#    - backfill-needed.parquet: What's missing
#    - catalog.duckdb: Ready-to-query DuckDB with remote views
#
# SECRETS REQUIRED:
# -----------------
# - IA_ACCESS_KEY: Internet Archive S3 access key
# - IA_SECRET_KEY: Internet Archive S3 secret key
# - JINA_API_KEY: Jina AI API key (for embeddings)
# - GOOGLE_API_KEY: Google AI API key (for embeddings, optional)
#
# MANUAL TRIGGERS:
# ----------------
# You can trigger specific jobs manually via workflow_dispatch:
#   - job: Which job to run (collect, convert, embed, catalog, all)
#   - date: Specific date to process (YYYY-MM-DD)
#   - tribunal: Specific tribunal to process (e.g., TJSP)
#
# LOCAL DEVELOPMENT:
# ------------------
# Each job calls a Python script that can be run locally:
#   uv run python scripts/pipeline/collect.py --date 2026-01-27 --tribunal TJSP
#   uv run python scripts/pipeline/convert.py --date 2026-01-27
#   uv run python scripts/pipeline/embed.py --max-decisions 100
#   uv run python scripts/pipeline/catalog.py --upload
#
# ============================================================================

name: Data Pipeline

on:
  schedule:
    # Collect: every 5 minutes
    - cron: '*/5 * * * *'
    # Consolidate: every 10 minutes (even marks)
    - cron: '0,10,20,30,40,50 * * * *'
    # Embed: every hour at minute 5
    - cron: '5 * * * *'
    # Catalog: daily at 06:00 UTC
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - collect
          - convert
          - embed
          - catalog
      date:
        description: 'Specific date (YYYY-MM-DD)'
        required: false
      tribunal:
        description: 'Specific tribunal (e.g., TJSP)'
        required: false

# Minimal permissions for security
permissions:
  contents: read

# Per-job concurrency (below) replaces the previous global lock.
# A global group blocked all job types from running when any single
# job was active — e.g. a collect run prevented consolidate from
# starting even though they operate on independent data.

env:
  DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app

jobs:
  # ==========================================================================
  # JOB: COLLECT
  # ==========================================================================
  # Downloads judicial communications from DJEN and uploads to Internet Archive.
  # Runs every 5 minutes to catch new publications quickly.
  # ==========================================================================
  collect:
    name: Collect DJEN Data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    concurrency:
      group: pipeline-collect
      cancel-in-progress: false

    # Run only on the 5-minute cron (not other schedules), or manual trigger
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      github.event.inputs.job == 'collect' ||
      github.event.inputs.job == 'all'

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Run collection
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_TRIBUNAL: ${{ github.event.inputs.tribunal }}
        run: |
          args=(--proxy-url "$DJEN_PROXY_URL" --max-items 200 --workers 8 --backfill)
          [ -n "$INPUT_DATE" ] && args+=(--date "$INPUT_DATE")
          [ -n "$INPUT_TRIBUNAL" ] && args+=(--tribunal "$INPUT_TRIBUNAL")
          uv run python scripts/pipeline/collect.py "${args[@]}"

  # ==========================================================================
  # JOB: CONSOLIDATE
  # ==========================================================================
  # Consolidates ZIP files to single Parquet files per day (all tribunals).
  # Runs every 10 minutes (skips odd 5-minute intervals).
  # ==========================================================================
  consolidate:
    name: Consolidate to Parquet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    concurrency:
      group: pipeline-consolidate
      cancel-in-progress: false

    # Run on the 10-minute cron schedule, or manual trigger.
    # No needs: — consolidation works on existing IA data, independent of collect.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0,10,20,30,40,50 * * * *') ||
      github.event.inputs.job == 'convert' ||
      github.event.inputs.job == 'all'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Run consolidation
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            uv run python scripts/pipeline/consolidate.py --date "$INPUT_DATE"
          else
            uv run python scripts/pipeline/consolidate.py --backfill
          fi

  # ==========================================================================
  # JOB: EMBED
  # ==========================================================================
  # Generates vector embeddings for semantic search.
  # Runs hourly (at minute 0 of each hour).
  # ==========================================================================
  embed:
    name: Generate Embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: dev
    concurrency:
      group: pipeline-embed
      cancel-in-progress: false

    # Run on the hourly cron schedule, or manual trigger.
    # No needs: — embedding works on existing parquet data, independent of consolidate.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '5 * * * *') ||
      github.event.inputs.job == 'embed' ||
      github.event.inputs.job == 'all'

    env:
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Get current date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore embedding cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/embeddings.duckdb
          key: embeddings-${{ steps.date.outputs.today }}
          restore-keys: embeddings-

      - name: Run embedding generation
        run: |
          uv run python scripts/pipeline/embed.py \
            --max-decisions 500 \
            --timeout-minutes 50

      - name: Save embedding cache
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/embeddings.duckdb
          key: embeddings-${{ steps.date.outputs.today }}

  # ==========================================================================
  # JOB: CATALOG
  # ==========================================================================
  # Builds master catalog of all data on Internet Archive.
  # Runs daily at 06:00 UTC or on manual dispatch.
  # ==========================================================================
  catalog:
    name: Update Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: pipeline-catalog
      cancel-in-progress: false

    # Run on the daily cron, or manual trigger.
    # No needs: — catalog scans IA independently, runs on its own schedule.
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      github.event.inputs.job == 'catalog' ||
      github.event.inputs.job == 'all'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Run catalog generation
        run: |
          uv run python scripts/generate_catalog.py --upload

      - name: Summary
        run: |
          echo "## Catalog Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Catalog URL: https://archive.org/download/causaganha-catalog/catalog.duckdb" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # JOB: DASHBOARD CACHE
  # ==========================================================================
  # Generates pre-built cache for the dashboard from the catalog manifest.
  # Runs after the catalog job so the manifest is up-to-date.
  # Uses manifest.parquet as single source of truth (3 HTTP requests total).
  # ==========================================================================
  dashboard-cache:
    name: Update Dashboard Cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    needs: catalog
    concurrency:
      group: pipeline-dashboard-cache
      cancel-in-progress: false

    # Run after catalog completes successfully (daily or manual dispatch).
    # Keeps needs: catalog since dashboard-cache reads the catalog output.
    if: |
      needs.catalog.result == 'success' ||
      github.event.inputs.job == 'all'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Generate dashboard cache
        run: |
          uv run python scripts/generate_dashboard_cache.py

      - name: Save cache data
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dashboard/public/cache
          key: dashboard-cache-${{ github.run_number }}

      - name: Summary
        run: |
          echo "## Dashboard Cache Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source: manifest.parquet from causaganha-catalog" >> $GITHUB_STEP_SUMMARY
          ls -la dashboard/public/cache/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
