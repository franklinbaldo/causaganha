name: Archive DJEN to Internet Archive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date (YYYY-MM-DD)'
        required: false
      tribunal:
        description: 'Specific tribunal (e.g., TJSP)'
        required: false
      backfill_days:
        description: 'Days to backfill from today'
        required: false
        default: '7'

concurrency:
  group: archive-djen
  cancel-in-progress: false  # Skip new runs, don't cancel

env:
  DJEN_API: https://djen-proxy-mhgmawcn3a-rj.a.run.app  # Proxy to bypass geofencing
  MAX_UPLOADS_PER_RUN: 20  # ~20 uploads at 1/sec = ~20 seconds

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup
        run: |
          pip install internetarchive

          mkdir -p ~/.config/internetarchive
          cat > ~/.config/internetarchive/ia.ini << EOF
          [s3]
          access = ${{ secrets.IA_ACCESS_KEY }}
          secret = ${{ secrets.IA_SECRET_KEY }}
          EOF

      - name: Find items to archive
        id: find
        run: |
          # Tribunais list
          TRIBUNAIS="TRF1 TRF2 TRF3 TRF4 TRF5 TRF6 TST TSE STM STJ STF CNJ CNMP TNU"
          TRIBUNAIS="$TRIBUNAIS TJAC TJAL TJAM TJAP TJBA TJCE TJDF TJES TJGO TJMA TJMG TJMS TJMT TJPA TJPB TJPE TJPI TJPR TJRJ TJRN TJRO TJRR TJRS TJSC TJSE TJSP TJTO"
          TRIBUNAIS="$TRIBUNAIS TRT1 TRT2 TRT3 TRT4 TRT5 TRT6 TRT7 TRT8 TRT9 TRT10 TRT11 TRT12 TRT13 TRT14 TRT15 TRT16 TRT17 TRT18 TRT19 TRT20 TRT21 TRT22 TRT23 TRT24"
          TRIBUNAIS="$TRIBUNAIS TREAC TREAL TREAM TREAP TREBA TRECE TREDF TREES TREGO TREMA TREMG TREMS TREMT TREPA TREPB TREPE TREPI TREPR TRERJ TRERN TRERO TRERR TRERS TRESC TRESE TRESP TRETO"

          # Get existing items from IA
          echo "Fetching existing items from IA..."
          ia search 'identifier:djen-raw-*' --itemlist > existing_items.txt 2>/dev/null || touch existing_items.txt
          EXISTING_COUNT=$(wc -l < existing_items.txt | tr -d ' ')
          echo "Found $EXISTING_COUNT existing items on IA"

          # Generate dates to check (D-1 to D-N)
          BACKFILL_DAYS="${{ inputs.backfill_days }}"
          BACKFILL_DAYS=${BACKFILL_DAYS:-7}

          > to_archive.txt
          for i in $(seq 1 $BACKFILL_DAYS); do
            DATE=$(date -d "-$i days" +%Y-%m-%d 2>/dev/null || date -v-${i}d +%Y-%m-%d)

            for TRIBUNAL in $TRIBUNAIS; do
              ITEM_ID="djen-raw-${DATE}-${TRIBUNAL}"

              # Check if already on IA
              if grep -q "^${ITEM_ID}$" existing_items.txt; then
                continue
              fi

              echo "${DATE}|${TRIBUNAL}" >> to_archive.txt
            done
          done

          TOTAL=$(wc -l < to_archive.txt | tr -d ' ')
          echo "Found $TOTAL items to archive"
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Limit to MAX_UPLOADS_PER_RUN
          head -n $MAX_UPLOADS_PER_RUN to_archive.txt > batch.txt
          BATCH_SIZE=$(wc -l < batch.txt | tr -d ' ')
          echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT

      - name: Archive batch
        if: steps.find.outputs.batch_size != '0'
        run: |
          SUCCESS=0
          FAILED=0

          while IFS='|' read -r DATE TRIBUNAL; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥 $TRIBUNAL $DATE"

            # Get caderno info from DJEN API
            INFO=$(curl -sf "$DJEN_API/api/v1/caderno/$TRIBUNAL/$DATE/D" 2>/dev/null || echo "")

            if [ -z "$INFO" ]; then
              echo "   ⚠️  No caderno available"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Extract download URL
            URL=$(echo "$INFO" | jq -r '.url // empty')
            TOTAL=$(echo "$INFO" | jq -r '.total_comunicacoes // 0')
            SIZE=$(echo "$INFO" | jq -r '.tamanho_bytes // 0')
            SIZE_MB=$((SIZE / 1024 / 1024))

            if [ -z "$URL" ]; then
              echo "   ⚠️  No download URL"
              FAILED=$((FAILED + 1))
              continue
            fi

            echo "   📊 $TOTAL comunicações, ${SIZE_MB}MB"

            # Download ZIP
            echo "   ⬇️  Downloading..."
            if ! curl -sfL "$URL" -o caderno.zip; then
              echo "   ❌ Download failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Verify file
            ACTUAL=$(stat -c%s caderno.zip 2>/dev/null || stat -f%z caderno.zip)
            if [ "$ACTUAL" -lt 100 ]; then
              echo "   ❌ File too small ($ACTUAL bytes)"
              rm -f caderno.zip
              FAILED=$((FAILED + 1))
              continue
            fi

            # Upload to Internet Archive
            ITEM_ID="djen-raw-${DATE}-${TRIBUNAL}"
            echo "   ⬆️  Uploading to IA: $ITEM_ID"

            if ia upload "$ITEM_ID" caderno.zip \
              --metadata="collection:opensource" \
              --metadata="mediatype:data" \
              --metadata="title:DJEN $TRIBUNAL $DATE" \
              --metadata="description:Diário de Justiça Eletrônico Nacional - Caderno $TRIBUNAL $DATE - $TOTAL comunicações" \
              --metadata="subject:brazilian-law;djen;legal;judiciary;$TRIBUNAL" \
              --metadata="creator:CausaGanha" \
              --metadata="date:$DATE" \
              --metadata="tribunal:$TRIBUNAL" \
              --metadata="total_comunicacoes:$TOTAL" \
              --retries=3 \
              --no-derive 2>&1; then
              echo "   ✅ Done!"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "   ❌ Upload failed"
              FAILED=$((FAILED + 1))
            fi

            rm -f caderno.zip

            # Rate limit
            sleep 1

          done < batch.txt

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Results: $SUCCESS success, $FAILED failed"
          echo "📊 Remaining: $(($(wc -l < to_archive.txt) - SUCCESS - FAILED)) items"

      - name: Summary
        run: |
          echo "## Archive Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total pending: ${{ steps.find.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- Batch size: ${{ steps.find.outputs.batch_size }}" >> $GITHUB_STEP_SUMMARY
