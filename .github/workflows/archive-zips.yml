name: Archive DJEN to Internet Archive

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date (YYYY-MM-DD)'
        required: false
      tribunal:
        description: 'Specific tribunal (e.g., TJSP)'
        required: false
      backfill_days:
        description: 'Days to backfill from today'
        required: false
        default: '365'

concurrency:
  group: archive-djen
  cancel-in-progress: false  # Skip new runs, don't cancel

env:
  DJEN_API: https://djen-proxy-mhgmawcn3a-rj.a.run.app  # Proxy to bypass geofencing
  MAX_UPLOADS_PER_RUN: 100  # Balanced for IA rate limits

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup
        run: |
          pip install internetarchive
          mkdir -p ~/.config/internetarchive
          printf '[s3]\naccess = %s\nsecret = %s\n' "$IAS3_ACCESS_KEY" "$IAS3_SECRET_KEY" > ~/.config/internetarchive/ia.ini
          echo "IA config created"

      - name: Download state
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: archive-state
          path: state/
          if_no_artifact_found: ignore
          workflow_conclusion: success

      - name: Find items to archive
        id: find
        run: |
          # Tribunais list
          TRIBUNAIS="TRF1 TRF2 TRF3 TRF4 TRF5 TRF6 TST TSE STM STJ STF CNJ CNMP TNU"
          TRIBUNAIS="$TRIBUNAIS TJAC TJAL TJAM TJAP TJBA TJCE TJDF TJES TJGO TJMA TJMG TJMS TJMT TJPA TJPB TJPE TJPI TJPR TJRJ TJRN TJRO TJRR TJRS TJSC TJSE TJSP TJTO"
          TRIBUNAIS="$TRIBUNAIS TRT1 TRT2 TRT3 TRT4 TRT5 TRT6 TRT7 TRT8 TRT9 TRT10 TRT11 TRT12 TRT13 TRT14 TRT15 TRT16 TRT17 TRT18 TRT19 TRT20 TRT21 TRT22 TRT23 TRT24"
          TRIBUNAIS="$TRIBUNAIS TREAC TREAL TREAM TREAP TREBA TRECE TREDF TREES TREGO TREMA TREMG TREMS TREMT TREPA TREPB TREPE TREPI TREPR TRERJ TRERN TRERO TRERR TRERS TRESC TRESE TRESP TRETO"

          # Load previous state (unavailable date|tribunal combinations)
          mkdir -p state
          if [ ! -f state/unavailable.txt ]; then
            touch state/unavailable.txt
          fi
          echo "Loaded $(wc -l < state/unavailable.txt | tr -d ' ') unavailable items from state"

          # Get existing files from IA (check which ZIPs already exist)
          # Structure: one item per day (djen-raw-YYYY-MM-DD), multiple files per item
          echo "Fetching existing files from IA..."
          > existing_files.txt

          # Get list of items first
          ia search 'identifier:djen-raw-*' --itemlist 2>/dev/null | while read -r ITEM_ID; do
            # For each item, list its files (ZIPs only)
            ia list "$ITEM_ID" 2>/dev/null | grep '\.zip$' >> existing_files.txt || true
          done

          EXISTING_COUNT=$(wc -l < existing_files.txt | tr -d ' ')
          echo "Found $EXISTING_COUNT existing ZIP files on IA"

          # Generate dates to check (D-1 to D-N)
          BACKFILL_DAYS="${{ inputs.backfill_days }}"
          BACKFILL_DAYS=${BACKFILL_DAYS:-7}

          # Handle specific date if provided
          SPECIFIC_DATE="${{ inputs.date }}"
          SPECIFIC_TRIBUNAL="${{ inputs.tribunal }}"

          > to_archive.txt
          if [ -n "$SPECIFIC_DATE" ]; then
            if [ -n "$SPECIFIC_TRIBUNAL" ]; then
              echo "${SPECIFIC_DATE}|${SPECIFIC_TRIBUNAL}" >> to_archive.txt
            else
              for TRIBUNAL in $TRIBUNAIS; do
                echo "${SPECIFIC_DATE}|${TRIBUNAL}" >> to_archive.txt
              done
            fi
          else
            for i in $(seq 1 $BACKFILL_DAYS); do
              DATE=$(date -d "-$i days" +%Y-%m-%d 2>/dev/null || date -v-${i}d +%Y-%m-%d)

              for TRIBUNAL in $TRIBUNAIS; do
                # Check if ZIP file already exists on IA
                ZIP_NAME="${TRIBUNAL}-${DATE}.zip"
                if grep -q "^${ZIP_NAME}$" existing_files.txt; then
                  continue
                fi

                # Skip if marked unavailable
                if grep -q "^${DATE}|${TRIBUNAL}$" state/unavailable.txt; then
                  continue
                fi

                echo "${DATE}|${TRIBUNAL}" >> to_archive.txt
              done
            done
          fi

          TOTAL=$(wc -l < to_archive.txt | tr -d ' ')
          echo "Found $TOTAL items to archive"
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Limit to MAX_UPLOADS_PER_RUN
          head -n $MAX_UPLOADS_PER_RUN to_archive.txt > batch.txt
          BATCH_SIZE=$(wc -l < batch.txt | tr -d ' ')
          echo "batch_size=$BATCH_SIZE" >> $GITHUB_OUTPUT

      - name: Archive batch
        if: steps.find.outputs.batch_size != '0'
        run: |
          SUCCESS=0
          FAILED=0

          while IFS='|' read -r DATE TRIBUNAL; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📥 $TRIBUNAL $DATE"

            # Item ID is per day (all tribunals for that day go in same item)
            ITEM_ID="djen-raw-${DATE}"

            # Get caderno info from DJEN API
            INFO=$(curl -sf "$DJEN_API/api/v1/caderno/$TRIBUNAL/$DATE/D" 2>/dev/null || echo "")

            if [ -z "$INFO" ]; then
              echo "   ⚠️  No caderno available (marking unavailable)"
              echo "${DATE}|${TRIBUNAL}" >> state/unavailable.txt
              FAILED=$((FAILED + 1))
              continue
            fi

            # Extract download URL
            URL=$(echo "$INFO" | jq -r '.url // empty')
            TOTAL=$(echo "$INFO" | jq -r '.total_comunicacoes // 0')
            VERSAO=$(echo "$INFO" | jq -r '.versao // 1')

            # Filename pattern: TRIBUNAL-DATE.zip (standardized)
            ZIP_NAME="${TRIBUNAL}-${DATE}.zip"

            echo "   📊 $TOTAL comunicacoes, Versao: $VERSAO"

            # Download ZIP
            echo "   ⬇️  Downloading..."
            if ! curl -sfL "$URL" -o "$ZIP_NAME"; then
              echo "   ❌ Download failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Verify file
            ACTUAL=$(stat -c%s "$ZIP_NAME" 2>/dev/null || stat -f%z "$ZIP_NAME")
            if [ "$ACTUAL" -lt 100 ]; then
              echo "   ❌ File too small ($ACTUAL bytes)"
              rm -f "$ZIP_NAME"
              FAILED=$((FAILED + 1))
              continue
            fi

            # Upload to Internet Archive (item per day, file per tribunal)
            echo "   ⬆️  Uploading to IA: $ITEM_ID / $ZIP_NAME"

            UPLOAD_OUTPUT=$(ia upload "$ITEM_ID" "$ZIP_NAME" \
              --metadata="collection:opensource" \
              --metadata="mediatype:data" \
              --metadata="title:DJEN Raw Data - ${DATE}" \
              --metadata="description:Diario de Justica Eletronico Nacional - Raw ZIP files for ${DATE}. Contains judicial communications from all Brazilian courts." \
              --metadata="subject:brazilian-law;djen;legal;judiciary;open-data" \
              --metadata="creator:CausaGanha" \
              --metadata="date:$DATE" \
              --retries=3 \
              --no-derive 2>&1)
            UPLOAD_STATUS=$?

            if [ $UPLOAD_STATUS -eq 0 ]; then
              echo "   ✅ Success!"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "   ❌ Upload failed"
              echo "$UPLOAD_OUTPUT" | head -n 5
              FAILED=$((FAILED + 1))
            fi

            rm -f "$ZIP_NAME"

            # IA rate limit
            sleep 3

          done < batch.txt

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Results: $SUCCESS success, $FAILED failed"
          echo "📊 Remaining: $(($(wc -l < to_archive.txt) - SUCCESS - FAILED)) items"

      - name: Save state
        uses: actions/upload-artifact@v4
        with:
          name: archive-state
          path: state/
          retention-days: 90
          overwrite: true

      - name: Summary
        run: |
          UNAVAILABLE=$(wc -l < state/unavailable.txt 2>/dev/null | tr -d ' ' || echo "0")
          EXISTING=$(wc -l < existing_files.txt 2>/dev/null | tr -d ' ' || echo "0")
          PENDING="${{ steps.find.outputs.total }}"

          echo "## Archive Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Progress" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Archived: $EXISTING ZIP files" >> $GITHUB_STEP_SUMMARY
          echo "- ⏳ Pending: $PENDING files" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Unavailable: $UNAVAILABLE tribunal/date combos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Structure" >> $GITHUB_STEP_SUMMARY
          echo "- One IA item per day: \`djen-raw-YYYY-MM-DD\`" >> $GITHUB_STEP_SUMMARY
          echo "- All tribunals for that day in same item" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### This Run" >> $GITHUB_STEP_SUMMARY
          echo "- Batch size: ${{ steps.find.outputs.batch_size }}" >> $GITHUB_STEP_SUMMARY
