name: Daily Embedding Generation
permissions:
  contents: read

on:
  # Run daily at 3 AM Brazil time (6 AM UTC)
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days to look back for unembedded decisions'
        required: false
        default: '1'

jobs:
  generate-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max (plenty for daily digest)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Restore DuckDB from previous run (persistent cache)
      - name: Restore DuckDB cache
        id: cache-duckdb
        uses: actions/cache@v4
        with:
          path: data/causaganha.duckdb
          key: embeddings-db-${{ github.run_number }}
          restore-keys: |
            embeddings-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Generate embeddings for daily digest
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python scripts/daily_embedding_job.py \
            --days-back ${{ github.event.inputs.days_back || '1' }} \
            --max-concurrency 10

      - name: Export to Parquet
        run: |
          uv run python scripts/export_daily_embeddings.py \
            --output data/exports/embeddings_$(date +%Y-%m-%d).parquet

      - name: Upload to Internet Archive
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run python scripts/upload_to_ia.py \
            --file data/exports/embeddings_$(date +%Y-%m-%d).parquet

      # Save DuckDB for next run
      - name: Save DuckDB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/causaganha.duckdb
          key: embeddings-db-${{ github.run_number }}

      # Upload stats as artifact (for monitoring)
      - name: Upload job stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-stats-${{ github.run_number }}
          path: data/stats/*.json
          retention-days: 30
