# Archive inventory -> independent tribunal/year partitions -> catalog/index.
name: Consolidate Parquet

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      item:
        description: 'Optional Archive item, e.g. djen-tjro-2026. Empty discovers pending partitions.'
        type: string
        required: false
      dry_run:
        description: 'Convert and validate without publishing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: consolidate-parquet
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
        with:
          dev: 'false'
      - id: plan
        env:
          ITEM: ${{ inputs.item }}
        run: |
          args=()
          if [ -n "$ITEM" ]; then args+=(--item "$ITEM"); fi
          uv run python -m scripts.pipeline.archive_partitions "${args[@]}" --limit 12 > plan.json
          echo "matrix=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          echo "pending=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"

  consolidate:
    needs: plan
    if: needs.plan.outputs.pending == 'True'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
        with:
          dev: 'false'
      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}
      - name: Consolidate Archive partition
        env:
          ITEM: ${{ matrix.item }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--item "$ITEM")
          if [ "$DRY_RUN" = 'true' ]; then args+=(--dry-run); fi
          uv run python -m scripts.pipeline.consolidate_partition "${args[@]}"
      - name: Preserve publication verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ matrix.item }}
          path: data/partition-publication-candidate.json
          if-no-files-found: ignore

  catalog:
    needs: [plan, consolidate]
    # Successful partitions must reach the index even if another partition failed.
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.pending == 'True' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Refresh catalog and process index
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-catalog.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: { force_reconcile: 'true' }
            });
