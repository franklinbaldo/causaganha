name: Temporary fix MCP stack lint

on:
  push:
    branches:
      - mcp/917-publicacoes-archive

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: mcp/917-publicacoes-archive
      - uses: ./.github/actions/setup
      - name: Fix inherited processo_estado lint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/causaganha_mcp/tools/datajud_processo.py')
          text = path.read_text()
          replacements = {
              'description="Timestamp returned by DataJud. Ordering uses this raw value before presentation.",': '''description=(\n            "Timestamp returned by DataJud. Ordering uses this raw value "\n            "before presentation."\n        ),''',
              'description="This tool reports current process-state metadata/movements, not archived content.",': '''description=(\n            "This tool reports current process-state metadata/movements, "\n            "not archived content."\n        ),''',
              '"Confirme se o tribunal consultado corresponde ao processo antes de tratar a ausência como evidência.",': '''(\n                    "Confirme se o tribunal consultado corresponde ao processo antes de "\n                    "tratar a ausência como evidência."\n                ),''',
              'quando="Se você precisa saber se o CausaGanha já preservou publicações ou decisões deste CNJ.",': '''quando=(\n                        "Se você precisa saber se o CausaGanha já preservou publicações "\n                        "ou decisões deste CNJ."\n                    ),''',
              'quando="Se a pergunta exige publicações preservadas, decisão, ementa ou outro teor documental.",': '''quando=(\n                "Se a pergunta exige publicações preservadas, decisão, ementa "\n                "ou outro teor documental."\n            ),''',
              'quando="Se você precisa inspecionar também movimentos de rotina que foram omitidos do resumo.",': '''quando=(\n                    "Se você precisa inspecionar também movimentos de rotina que foram "\n                    "omitidos do resumo."\n                ),''',
              '"DataJud informa metadados e movimentos; um movimento de sentença/decisão não contém, por si só, a fundamentação ou o teor do ato.",': '''(\n                "DataJud informa metadados e movimentos; um movimento de sentença/decisão "\n                "não contém, por si só, a fundamentação ou o teor do ato."\n            ),''',
              '"A consulta é ao índice oficial do tribunal indicado e reflete o que o DataJud retornou no instante consultado.",': '''(\n                "A consulta é ao índice oficial do tribunal indicado e reflete o que o "\n                "DataJud retornou no instante consultado."\n            ),''',
              '"O DataJud limitou a consulta além do orçamento interativo de retry. Tente novamente mais tarde."': '''(\n                "O DataJud limitou a consulta além do orçamento interativo de retry. "\n                "Tente novamente mais tarde."\n            )''',
              '"Erro de rede ao consultar o processo no DataJud. Tente novamente; se persistir, a API oficial pode estar indisponível."': '''(\n                "Erro de rede ao consultar o processo no DataJud. Tente novamente; "\n                "se persistir, a API oficial pode estar indisponível."\n            )''',
              '        tribunal: str = DEFAULT_TRIBUNAL,\n        incluir_movimentos: bool = False,': '        tribunal: str = DEFAULT_TRIBUNAL,\n        *,\n        incluir_movimentos: bool = False,',
              '''        if not normalized:\n            raise ToolError(\n                "CNJ inválido: informe os 20 dígitos do número do processo, com ou sem máscara."\n            )''': '''        if not normalized:\n            msg = (\n                "CNJ inválido: informe os 20 dígitos do número do processo, "\n                "com ou sem máscara."\n            )\n            raise ToolError(msg)''',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          path.write_text(text)
          PY
          uv run ruff format src/causaganha_mcp/tools/datajud_processo.py
          uv run ruff check
          uv run ruff format --check
          uv run pytest -q tests/causaganha_mcp tests/publicacoes/test_publicacoes_service.py
      - name: Commit validated stack and remove temporary workflow
        run: |
          rm .github/workflows/fix-mcp-stack-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/causaganha_mcp/tools/datajud_processo.py .github/workflows/fix-mcp-stack-lint.yml
          git commit -m 'style(mcp): satisfy strict lint across semantic stack'
          git push origin HEAD:mcp/917-publicacoes-archive
