# ============================================================================
# COLLECT ZIPS — Download DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Manifest-driven sync: checks IA + DJEN, downloads missing ZIPs, uploads.
# State persisted in sync-manifest.csv (cached between runs + uploaded to IA).
# ============================================================================

name: Collect ZIPs

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers (1-8)'
        required: false
        default: '8'
      tribunal:
        description: 'Specific tribunal (e.g. TJSP) — optional'
        required: false
      deadline_minutes:
        description: 'Deadline in minutes'
        required: false
        default: '17'
      start_date:
        description: 'Oldest date to process (YYYY-MM-DD)'
        required: false
        default: '2020-01-01'
      end_date:
        description: 'Newest date to process (YYYY-MM-DD, default: yesterday)'
        required: false

permissions:
  contents: read

concurrency:
  group: collect-zips
  cancel-in-progress: false

jobs:
  collect:
    name: Download & Upload ZIPs
    runs-on: ubuntu-latest
    # 17min engine deadline + Phase 0 IA discovery (~2min) + manifest
    # upload_to_ia in the finally block (re-download merge + push of
    # ~20MB CSV, can take 60-90s) easily breaches the previous 19min
    # ceiling. PR #677's probe showed every recent run hitting 1170s
    # and being cancelled mid-cleanup, so IA never received updates
    # since 2026-05-01.
    timeout-minutes: 25
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      IA_UPLOAD_RATE_LIMIT: "32"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Restore manifest cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
          restore-keys: sync-manifest-

      - name: Run djen-backup
        run: |
          WORKERS="${{ github.event.inputs.workers || '4' }}"
          DEADLINE="${{ github.event.inputs.deadline_minutes || '17' }}"
          TRIBUNAL="${{ github.event.inputs.tribunal || '' }}"
          START_DATE="${{ github.event.inputs.start_date || '2020-01-01' }}"
          END_DATE="${{ github.event.inputs.end_date || '' }}"

          CMD="uv run --no-dev djen-backup"
          CMD="$CMD --deadline-minutes $DEADLINE"
          CMD="$CMD --workers $WORKERS"
          CMD="$CMD --start-date $START_DATE"
          CMD="$CMD --use-proxy"
          CMD="$CMD --no-fail-fast"

          if [ -n "$END_DATE" ]; then
            CMD="$CMD --end-date $END_DATE"
          fi
          if [ -n "$TRIBUNAL" ]; then
            CMD="$CMD --tribunal $TRIBUNAL"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Save manifest cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
