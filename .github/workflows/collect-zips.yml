# ============================================================================
# COLLECT ZIPS — Download DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Focused workflow: only downloads ZIPs from DJEN and uploads to IA.
# No consolidation, embedding, or catalog steps.
#
# Runs every 20 minutes. Each run processes recent dates first and works
# backwards. State is persisted between runs via actions/cache.
#
# Strategy: start from most recent 12 months. After that range is
# exhausted, widen via --start-date in a future run.
# ============================================================================

name: Collect ZIPs

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers (1-4)'
        required: false
        default: '1'
      tribunal:
        description: 'Specific tribunal (e.g. TJSP) — optional'
        required: false
      deadline_minutes:
        description: 'Deadline in minutes'
        required: false
        default: '17'
      start_date:
        description: 'Oldest date to process (YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
      cache_version:
        description: 'Cache version (bump to reset state)'
        required: false
        default: 'v3'

permissions:
  contents: read
  actions: write

concurrency:
  group: collect-zips
  cancel-in-progress: false

jobs:
  collect:
    name: Download & Upload ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    env:
      DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Restore backfill state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/backfill-state.json
            data/ia-state.json
          key: collect-state-${{ github.event.inputs.cache_version || 'v3' }}-${{ github.run_id }}
          restore-keys: |
            collect-state-${{ github.event.inputs.cache_version || 'v3' }}-

      - name: Create data directory
        run: mkdir -p data

      - name: Run djen-backup
        id: collect
        run: |
          WORKERS="${{ github.event.inputs.workers || '1' }}"
          DEADLINE="${{ github.event.inputs.deadline_minutes || '17' }}"
          TRIBUNAL="${{ github.event.inputs.tribunal || '' }}"
          START_DATE="${{ github.event.inputs.start_date || '2025-01-01' }}"

          CMD="uv run python -m djen_backup"
          CMD="$CMD --deadline-minutes $DEADLINE"
          CMD="$CMD --workers $WORKERS"
          CMD="$CMD --backfill-state-file data/backfill-state.json"
          CMD="$CMD --state-file data/ia-state.json"
          CMD="$CMD --start-date $START_DATE"

          if [ -n "$TRIBUNAL" ]; then
            CMD="$CMD --tribunal $TRIBUNAL"
          fi

          echo "Running: $CMD"
          echo "Start date: $START_DATE | Workers: $WORKERS | Deadline: ${DEADLINE}m"

          # Stream output live AND capture for stats
          LOG_FILE=$(mktemp)
          set +e
          $CMD 2>&1 | tee "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Extract stats
          UPLOADED=$(grep -oP '(?<=hits=)\d+' "$LOG_FILE" | tail -1 || echo "0")
          ERRORS=$(grep -oP '(?<=errors=)\d+' "$LOG_FILE" | tail -1 || echo "0")
          EMPTIES=$(grep -oP '(?<=empties=)\d+' "$LOG_FILE" | tail -1 || echo "0")

          echo "uploaded=$UPLOADED" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "empties=$EMPTIES" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          {
            echo "## Results"
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Uploaded (hits) | $UPLOADED |"
            echo "| Errors | $ERRORS |"
            echo "| Empties | $EMPTIES |"
            echo "| Exit code | $EXIT_CODE |"
          } >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE

      - name: Save backfill state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/backfill-state.json
            data/ia-state.json
          key: collect-state-${{ github.event.inputs.cache_version || 'v3' }}-${{ github.run_id }}
