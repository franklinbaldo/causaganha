# ============================================================================
# COLLECT ZIPS — Download DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Manifest-driven sync: checks IA + DJEN, downloads missing ZIPs, uploads.
# Phase 2 (docs/planning/manifest-source-of-truth.md): state is read from
# sync-manifest.parquet + un-compacted manifest-log/ segments on IA; writes
# are emitted as immutable manifest-log/ segments (dirty rows only) — the
# canonical CSV is no longer rewritten. The local data/sync-manifest.csv is
# kept purely as a warm-start cache between runs.
# ============================================================================

name: Collect ZIPs

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers (1-8)'
        required: false
        default: '8'
      tribunal:
        description: 'Specific tribunal (e.g. TJSP) — optional'
        required: false
      deadline_minutes:
        description: 'Deadline in minutes'
        required: false
        default: '17'
      start_date:
        description: 'Oldest date to process (YYYY-MM-DD)'
        required: false
        default: '2020-01-01'
      end_date:
        description: 'Newest date to process (YYYY-MM-DD, default: yesterday)'
        required: false

permissions:
  contents: read

concurrency:
  group: collect-zips
  cancel-in-progress: false

jobs:
  collect:
    name: Download & Upload ZIPs
    runs-on: ubuntu-latest
    # 17min engine deadline + Phase 0 IA discovery (~2min) + manifest
    # upload_to_ia in the finally block (re-download merge + push of
    # ~20MB CSV, can take 60-90s) easily breaches the previous 19min
    # ceiling. PR #677's probe showed every recent run hitting 1170s
    # and being cancelled mid-cleanup, so IA never received updates
    # since 2026-05-01.
    timeout-minutes: 25
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      IA_UPLOAD_RATE_LIMIT: "32"
      DJEN_RATE_LIMIT: "10"
      # See #1608/TM-01: dispatch inputs arrive as job-level env vars, never
      # spliced into a step's script text (that would let a crafted input
      # break out of quoting and run shell in this secret-bearing job, which
      # also runs every 20 minutes on cron).
      COLLECT_WORKERS: ${{ github.event.inputs.workers || '8' }}
      COLLECT_DEADLINE_MINUTES: ${{ github.event.inputs.deadline_minutes || '17' }}
      COLLECT_TRIBUNAL: ${{ github.event.inputs.tribunal || '' }}
      COLLECT_START_DATE: ${{ github.event.inputs.start_date || '2020-01-01' }}
      COLLECT_END_DATE: ${{ github.event.inputs.end_date || '' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Restore manifest cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
          restore-keys: sync-manifest-

      - name: Run djen-backup
        run: |
          set -euo pipefail

          WORKERS="$COLLECT_WORKERS"
          DEADLINE="$COLLECT_DEADLINE_MINUTES"
          TRIBUNAL="$COLLECT_TRIBUNAL"
          START_DATE="$COLLECT_START_DATE"
          END_DATE="$COLLECT_END_DATE"

          if ! [[ "$WORKERS" =~ ^[0-9]+$ ]]; then
            echo "::error::workers must be a non-negative integer, got: $WORKERS" >&2
            exit 1
          fi
          if ! [[ "$DEADLINE" =~ ^[0-9]+$ ]]; then
            echo "::error::deadline_minutes must be a non-negative integer, got: $DEADLINE" >&2
            exit 1
          fi
          if ! [[ "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::start_date must be YYYY-MM-DD, got: $START_DATE" >&2
            exit 1
          fi
          if [ -n "$END_DATE" ] && ! [[ "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::end_date must be YYYY-MM-DD, got: $END_DATE" >&2
            exit 1
          fi
          if [ -n "$TRIBUNAL" ] && ! [[ "$TRIBUNAL" =~ ^[A-Za-z0-9]{2,10}$ ]]; then
            echo "::error::tribunal must match ^[A-Za-z0-9]{2,10}$, got: $TRIBUNAL" >&2
            exit 1
          fi

          CMD=(uv run --no-dev djen-backup)
          CMD+=(--deadline-minutes "$DEADLINE")
          CMD+=(--workers "$WORKERS")
          CMD+=(--start-date "$START_DATE")
          CMD+=(--use-proxy)
          CMD+=(--no-fail-fast)

          if [ -n "$END_DATE" ]; then
            CMD+=(--end-date "$END_DATE")
          fi
          if [ -n "$TRIBUNAL" ]; then
            CMD+=(--tribunal "$TRIBUNAL")
          fi

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

      - name: Save manifest cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
