# ============================================================================
# COLLECT ZIPS — Download DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Success metric: hits/run > 0 (actual ZIPs uploaded to IA)
#
# Runs every 20 minutes. Each run:
#   1. Restores state from previous run (cursor per tribunal)
#   2. Processes dates from end_date backwards to start_date
#   3. Saves state for next run
#
# NOTE: Tribunals stop after 60 consecutive empty days. They are NOT reset
# automatically - use manual workflow_dispatch with reset_stopped=true if needed.
# ============================================================================

name: Collect ZIPs

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Parallel workers (1-4)'
        required: false
        default: '4'
      tribunal:
        description: 'Specific tribunal (e.g. TJSP) — optional'
        required: false
      deadline_minutes:
        description: 'Deadline in minutes'
        required: false
        default: '17'
      start_date:
        description: 'Oldest date to process (YYYY-MM-DD)'
        required: false
        default: '2013-01-01'
      end_date:
        description: 'Newest date to process (YYYY-MM-DD, default: today)'
        required: false
      reset_stopped:
        description: 'Reset stopped tribunals (use sparingly!)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: collect-zips
  cancel-in-progress: false

jobs:
  collect:
    name: Download & Upload ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 19
    environment: dev

    env:
      DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Download state from Internet Archive
        run: |
          mkdir -p data
          curl -sSfL -o data/ia-state.json \
            "https://archive.org/download/causaganha-dashboard/ia-state.json" || echo '{}' > data/ia-state.json
          curl -sSfL -o data/backfill-state.json \
            "https://archive.org/download/causaganha-dashboard/backfill-state.json" || echo '{}' > data/backfill-state.json
          curl -sSfL -o data/zip-inventory.txt \
            "https://archive.org/download/causaganha-dashboard/zip-inventory.txt" || echo 'timestamp,tribunal,date,status,url' > data/zip-inventory.txt
          echo "State files:"
          ls -lh data/

      - name: Reset stopped tribunals (manual only)
        if: ${{ github.event.inputs.reset_stopped == 'true' }}
        run: |
          if [ -f data/backfill-state.json ]; then
            echo "⚠️ Manual reset requested - resetting stopped tribunals..."
            uv run causaganha backfill reset \
              --backfill-state-file data/backfill-state.json \
              --all
            echo "✅ Reset complete"
          else
            echo "No backfill state yet — nothing to reset"
          fi

      - name: Validate CLI flags
        run: |
          echo "Validating CLI flags..."
          HELP_OUTPUT=$(uv run python -m djen_backup --help)
          FLAGS=("--deadline-minutes" "--workers" "--backfill-state-file" "--state-file" "--start-date")
          for FLAG in "${FLAGS[@]}"; do
            if ! echo "$HELP_OUTPUT" | grep -q -- "$FLAG"; then
              echo "❌ Error: Required flag $FLAG is missing from djen_backup CLI!"
              exit 1
            fi
          done
          echo "✅ All required CLI flags are present in djen_backup CLI."

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run causaganha backfill
        id: collect
        run: |
          WORKERS="${{ github.event.inputs.workers || '4' }}"
          DEADLINE="${{ github.event.inputs.deadline_minutes || '17' }}"
          TRIBUNAL="${{ github.event.inputs.tribunal || '' }}"
          START_DATE="${{ github.event.inputs.start_date || '2013-01-01' }}"
          END_DATE="${{ github.event.inputs.end_date || '' }}"

          CMD="uv run python -m djen_backup"
          CMD="$CMD --deadline-minutes $DEADLINE"
          CMD="$CMD --workers $WORKERS"
          CMD="$CMD --backfill-state-file data/backfill-state.json"
          CMD="$CMD --state-file data/ia-state.json"
          CMD="$CMD --start-date $START_DATE"
          # Skip absent markers to avoid IA spam detection (hundreds of tiny files in sequence)
          # The 60-day stop rule still works — empty streak increments normally
          CMD="$CMD --skip-absent-markers"

          CMD="$CMD --publish-live-status"

          if [ -n "$END_DATE" ]; then
            CMD="$CMD --end-date $END_DATE"
          fi
          if [ -n "$TRIBUNAL" ]; then
            CMD="$CMD --tribunal $TRIBUNAL"
          fi

          echo "Running: $CMD"
          echo "Window: $START_DATE → ${END_DATE:-today} | Workers: $WORKERS | Deadline: ${DEADLINE}m"

          START_TIME=$(date +%s)
          $CMD
          DURATION=$(($(date +%s) - START_TIME))
          echo "Collection completed in $DURATION seconds"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Collection Summary
        if: success() || failure()
        run: |
          UPLOADED="${{ steps.collect.outputs.uploaded }}"
          ERRORS="${{ steps.collect.outputs.errors }}"

          if [ -z "$UPLOADED" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            UPLOADED=$(grep -oP '✅ Uploaded \(new\) \|\s*\*\*\K\d+' "$GITHUB_STEP_SUMMARY" || echo "")
          fi

          if [ -z "$UPLOADED" ]; then
            UPLOADED=0
          fi

          DURATION="${{ steps.collect.outputs.duration }}"

          echo "## Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "Duration: $DURATION seconds, ZIPs collected: $UPLOADED" >> $GITHUB_STEP_SUMMARY

      - name: Smoke test (check for zero ZIPs)
        if: success() || failure()
        run: |
          UPLOADED="${{ steps.collect.outputs.uploaded }}"
          ERRORS="${{ steps.collect.outputs.errors }}"

          if [ -z "$UPLOADED" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            UPLOADED=$(grep -oP '✅ Uploaded \(new\) \|\s*\*\*\K\d+' "$GITHUB_STEP_SUMMARY" || echo "")
          fi

          if [ -z "$UPLOADED" ]; then
            UPLOADED=0
          fi

          if [ -z "$ERRORS" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            ERRORS=$(grep -oP '❌ Errors \|\s*\K\d+' "$GITHUB_STEP_SUMMARY" || echo "")
          fi

          if [ -z "$ERRORS" ]; then
            ERRORS=0
          fi

          echo "ZIPs uploaded in this run: $UPLOADED"
          echo "Errors encountered in this run: $ERRORS"
          if [ "$UPLOADED" -eq 0 ]; then
            if [ "$ERRORS" -gt 0 ]; then
              echo "CRITICAL: Zero ZIPs collected AND errors encountered - pipeline broken"
              exit 1
            else
              echo "WARNING: Zero ZIPs collected, but no errors. Might just be caught up."
              exit 0
            fi
          else
            echo "Pipeline successful - $UPLOADED ZIPs collected"
            exit 0
          fi

      - name: Global Zero Collection Check
        if: success() || failure()
        run: |
          UPLOADED="${{ steps.collect.outputs.uploaded }}"

          if [ -z "$UPLOADED" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            UPLOADED=$(grep -oP '✅ Uploaded \(new\) \|\s*\*\*\K\d+' "$GITHUB_STEP_SUMMARY" || echo "")
          fi

          if [ -z "$UPLOADED" ]; then
            UPLOADED=0
          fi

          echo "Running zero collection check for UPLOADED=$UPLOADED"
          if ! uv run python scripts/check_zero_collection.py "$UPLOADED"; then
            echo "CRITICAL: Zero ZIPs collected on a business day!"
            exit 1
          fi

      - name: Performance watchdog
        if: always()
        run: |
          if [ -z "$START_TIME" ]; then
            echo "START_TIME not set, skipping performance watchdog"
            exit 0
          fi

          CURRENT_TIME=$(date +%s)
          DURATION=$((CURRENT_TIME - START_TIME))

          if [ "$DURATION" -gt 900 ]; then
            echo "⚠️ Backfill running slow (> 15m). Duration: $DURATION seconds"
          else
            echo "Backfill completed in $DURATION seconds (within 15m limit)"
          fi

      - name: Show backfill status
        if: always()
        run: |
          echo "## Backfill Status" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          uv run causaganha backfill status --backfill-state-file data/backfill-state.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


