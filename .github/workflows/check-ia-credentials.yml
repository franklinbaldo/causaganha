name: Check IA Credentials

on:
  schedule:
    - cron: '0 8 * * 1' # Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check-credentials:
    name: Verify IA API Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Credentials Check via curl
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "ERROR: IA_ACCESS_KEY and IA_SECRET_KEY secrets are not set."
            exit 1
          fi

          # A PUT request is required to trigger the IA S3 auth validation
          # and return an InvalidAccessKeyId error if invalid.

          OUTPUT=$(curl -s -X PUT "https://s3.us.archive.org" -H "Authorization: LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}")
          CURL_EXIT=$?

          if [ $CURL_EXIT -ne 0 ]; then
             echo "ERROR: Failed to connect to Internet Archive. curl exit code: $CURL_EXIT"
             exit 1
          fi

          if echo "$OUTPUT" | grep -q "InvalidAccessKeyId"; then
            echo "ERROR: Invalid IA credentials. The access key '${IA_ACCESS_KEY}' is not valid."
            exit 1
          fi

          echo "Success: IA credentials are valid."
          exit 0
