name: Refresh reboot web lock

on:
  push:
    branches: [reboot/cobogo-panda-home]
    paths:
      - web/package.json
      - web/panda.config.ts
      - .github/workflows/reboot-web-lock.yml

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reboot/cobogo-panda-home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh lockfile and install
        working-directory: web
        run: npm install
      - name: Create public-data fixture
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p web/public/data
          printf '{"generated_at":"%s","sources":{"djen":{"zips_archived":3,"pairs_total":4,"tribunals_with_data":2,"tribunals_total":3,"coverage_pct":75,"earliest_tracked_date":"2026-01-01","earliest_upload_date":"2026-01-01","latest_upload_date":"2026-01-03","absent_confirmed":1,"pending_real":0,"errors_transient":0,"never_checked":0,"last_attempt_at":"2026-08-15T18:00:00Z","last_success_at":"2026-08-15T17:55:00Z"}}}' "$now" > web/public/data/site-status.json
          echo '{"total":4,"uploaded":3,"pending":0,"absent":1,"unknown":0,"coverage_pct":75,"tribunals_total":3,"tribunals_with_data":2}' > web/public/data/totals.json
          echo '{"avg_coverage":2.5,"best_count":3,"best_day":"2026-08-14","worst_count":2,"worst_day":"2026-08-13"}' > web/public/data/stats_coverage.json
          echo '[{"court":"TJRO","collected":30,"absent":0,"total":30,"rate":1}]' > web/public/data/court_reliability.json
          echo '[{"day_idx":1,"name":"Seg","avg":2.5,"days_count":4}]' > web/public/data/weekly_pattern.json
          echo '[{"tribunal":"TJRO","uploaded":30,"pending":0,"absent":0,"unknown":0,"total":30,"coverage_pct":100,"earliest_upload":"2026-01-01","latest_upload":"2026-01-30"}]' > web/public/data/tribunal_coverage.json
          echo '[{"tribunal":"TJRO","date":"2026-01-01","status":"uploaded"}]' > web/public/data/tribunal_calendar.json
      - name: Build reboot surface
        working-directory: web
        run: npm run build
      - name: Commit lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/package-lock.json
          git commit -m 'chore(web): refresh package lock for Cobogó reboot'
          git push
