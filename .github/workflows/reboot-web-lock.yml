name: Refresh reboot web lock

on:
  push:
    branches: [reboot/cobogo-panda-home]
    paths:
      - web/package.json
      - web/panda.config.ts
      - .github/workflows/reboot-web-lock.yml

permissions:
  contents: write

jobs:
  lock-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reboot/cobogo-panda-home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh lockfile and install
        working-directory: web
        run: npm install
      - name: Build reboot surface
        working-directory: web
        run: npm run build
      - name: Commit lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/package-lock.json
          git commit -m 'chore(web): refresh package lock for Cobogó reboot'
          git push
