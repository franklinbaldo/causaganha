name: Continuous Embedding Generation (24/7)

permissions:
  contents: read

on:
  # Run every hour for continuous coverage (24 runs/day)
  schedule:
    - cron: '0 * * * *'

  # Allow manual trigger with custom parameters
  workflow_dispatch:
    inputs:
      max_decisions:
        description: 'Maximum decisions to process (0 = unlimited)'
        required: false
        default: '1000'
      max_concurrency:
        description: 'Maximum concurrent API requests'
        required: false
        default: '20'

jobs:
  generate-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 55  # Leave 5 min buffer before next hourly run

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Restore DuckDB from previous run (persistent cache across all runs)
      - name: Restore DuckDB cache
        id: cache-duckdb
        uses: actions/cache@v4
        with:
          path: data/causaganha.duckdb
          key: embeddings-db-${{ github.run_number }}
          restore-keys: |
            embeddings-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Process unembedded decisions (continuous)
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python scripts/continuous_embedding_job.py \
            --max-decisions ${{ github.event.inputs.max_decisions || '1000' }} \
            --max-concurrency ${{ github.event.inputs.max_concurrency || '20' }} \
            --timeout-minutes 50

      # Save DuckDB for next run (always, even if job fails)
      - name: Save DuckDB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/causaganha.duckdb
          key: embeddings-db-${{ github.run_number }}

      # Upload statistics for monitoring
      - name: Upload job statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-stats-${{ github.run_number }}
          path: data/stats/continuous_*.json
          retention-days: 7

      # Export and upload to IA once per day (only at 6 AM UTC)
      - name: Daily Parquet export and IA upload
        if: github.event.schedule == '0 6 * * *'
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          # Export to compressed Parquet
          uv run python scripts/export_daily_embeddings.py \
            --output data/exports/embeddings_$(date +%Y-%m-%d).parquet

          # Upload to Internet Archive
          uv run python scripts/upload_to_ia.py \
            --file data/exports/embeddings_$(date +%Y-%m-%d).parquet
