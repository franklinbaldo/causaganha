name: Index original DJEN ZIPs

on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
    inputs:
      item:
        description: 'IA tribunal/year item, e.g. djen-tjro-2026'
        required: false
        type: string
        default: djen-tjro-2026

permissions:
  contents: read

concurrency:
  group: index-djen-original-zip
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
        with:
          dev: 'false'
      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}
      - name: Restore index and incrementally index preserved ZIPs
        env:
          ITEM: ${{ inputs.item || 'djen-tjro-2026' }}
        run: |
          set -euo pipefail
          uv run python scripts/index_djen_originals.py --item "$ITEM" --restore-remote --max-zips 5 | tee index-report.json
      - name: Publish changed shards before manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path("index-report.json").read_text())
          base = Path("web/public/indexes/djen-raw")
          for filename in report["publish_files"]:
              path = base / filename
              if not path.is_file():
                  raise SystemExit(f"Missing index output: {path}")
              subprocess.run(
                  ["uv", "run", "ia", "upload", "causaganha-djen-original-index",
                   str(path), "--no-derive"],
                  check=True,
              )
          print(f"Published {len(report['publish_files'])} index files")
          PY
      - name: Index report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: djen-original-index-report
          path: index-report.json
          if-no-files-found: ignore
