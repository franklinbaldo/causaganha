name: Index original DJEN ZIPs

on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
    inputs:
      item:
        description: 'Source IA item, e.g. djen-tjro-2026'
        required: false
        type: string
        default: djen-tjro-2026

permissions:
  contents: read

concurrency:
  group: djen-process-csv-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
        with:
          dev: 'false'
      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}
      - name: Restore and build ZIPs of per-process CSVs
        env:
          ITEM: ${{ inputs.item || 'djen-tjro-2026' }}
        run: |
          set -euo pipefail
          uv run python scripts/index_djen_originals.py \
            --item "$ITEM" --restore-remote --max-zips 5 | tee index-report.json
      - name: Publish changed ZIPs and finally the manifest
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path("index-report.json").read_text())
          item = report["index_item"]
          for name in report["publish_files"]:
              path = (
                  Path("data/djen-cnj-index") / name
                  if name.endswith(".zip")
                  else Path("data/djen-cnj-index") / (item.removeprefix("causaganha-index-") + "_manifest.json")
              )
              if not path.is_file():
                  raise SystemExit(f"Index artifact missing: {path}")
              cmd = [
                  "uv", "run", "ia", "upload", item, str(path),
                  "--remote-name=" + name, "--no-derive",
              ]
              subprocess.run(cmd, check=True)
          print("Published", len(report["publish_files"]), "index artifacts")
          PY
      - name: Index report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: djen-cnj-csv-index-report
          path: index-report.json
          if-no-files-found: ignore
