name: Index original DJEN ZIPs

on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
    inputs:
      item:
        description: 'Source IA item, e.g. djen-tjro-2026'
        required: false
        type: string
        default: djen-tjro-2026

permissions:
  contents: read

concurrency:
  group: djen-process-csv-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup
        with:
          dev: 'false'
      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}
      - name: Restore and build ZIPs of per-process CSVs
        env:
          ITEM: ${{ inputs.item || 'djen-tjro-2026' }}
        run: |
          set -euo pipefail
          uv run python scripts/index_djen_originals.py \
            --item "$ITEM" --restore-remote --max-zips 5 | tee index-report.json
      - name: Publish changed ZIPs and finally the manifest
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path("index-report.json").read_text())
          tribunal = report["tribunal"]
          source_year = report["source_year"]
          for name in report["publish_files"]:
              if name == "manifest.json":
                  local = Path("data/djen-cnj-index") / f"{tribunal}_manifest.json"
                  item = f"causaganha-index-control-{tribunal}"
                  remote_name = name
              else:
                  local = Path("data/djen-cnj-index") / name
                  year, origin_zip = name.split("_", 1)
                  item = f"causaganha-{year}-8-22"
                  remote_name = origin_zip
              if not local.is_file():
                  raise SystemExit(f"Index artifact missing: {local}")
              subprocess.run(
                  ["uv", "run", "ia", "upload", item, str(local),
                   "--remote-name=" + remote_name, "--no-derive"],
                  check=True,
              )
          print("Published", len(report["publish_files"]), "index artifacts")
          PY
      - name: Index report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: djen-cnj-csv-index-report
          path: index-report.json
          if-no-files-found: ignore
