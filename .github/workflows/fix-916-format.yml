name: Temporary format 916

on:
  push:
    branches:
      - mcp/890-datajud-processo

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: mcp/890-datajud-processo
      - uses: ./.github/actions/setup
      - name: Format targeted test
        run: uv run ruff format tests/causaganha_mcp/test_datajud_processo.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/causaganha_mcp/test_datajud_processo.py
          git commit -m "style(mcp): format processo_estado test"
          git push origin HEAD:mcp/890-datajud-processo
