name: V2 Daily Scoring

on:
  schedule:
    - cron: '0 23 * * *'  # Daily at 23:00 UTC
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .

      - name: Run Scoring
        run: uv run causaganha score --limit 1000
        env:
          LOG_LEVEL: INFO
          # NOTE: Persistence needed here (pull DB, score, push DB, publish to IA)
