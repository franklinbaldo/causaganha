name: THX-02 Spike (synthetic only)

on:
  pull_request:
    paths:
      - scripts/spike_thx02.py
      - scripts/spike_thx02_segmenter.py
      - tests/test_spike_thx02_segmenter.py
      - tests/fixtures/thx02_segmenter_synthetic.jsonl
      - docs/spikes/thx02-segmentation.md
      - tests/test_spike_thx02.py
      - tests/fixtures/thx02_spike.jsonl
      - .github/workflows/thx02-spike.yml

permissions:
  contents: read

jobs:
  synthetic-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Offline request shape (no network)
        run: python scripts/spike_thx02.py
      - name: Install isolated dependency for region spike
        run: python -m pip install httpx==0.28.1
      - name: Audit structural boundary ceiling on training documents (offline)
        run: python scripts/spike_thx02_segmenter.py --audit-train data/segmenter_splits/train.jsonl > thx02-region-ceiling.json
      - name: THX region segmentation smoke (fictional judgment only)
        id: regions
        continue-on-error: true
        run: python scripts/spike_thx02_segmenter.py --live --output thx02-region-smoke.json
      - name: Live API smoke (synthetic only, non-blocking)
        id: live
        continue-on-error: true
        run: python scripts/spike_thx02.py --live --limit 12 --output thx02-smoke-results.jsonl
      - name: Summarize smoke outcome
        if: always()
        run: |
          echo "Region step outcome: ${{ steps.regions.outcome }}"
          if test -s thx02-region-ceiling.json; then
            python -c 'import json; r=json.load(open("thx02-region-ceiling.json")); print("Training documents:",r["documents"]); print("Boundary ceiling:",r["ceiling_recall"]); print("Boundary matches:",r["boundaries_within_tolerance"],"/",r["gold_structural_boundaries"])'
          fi
          if test -s thx02-region-smoke.json; then
            python -c 'import json; r=json.load(open("thx02-region-smoke.json")); print("Region units:",len(r["units"])); print("Accepted:",sum(p["status"]=="accepted" for p in r["predictions"])); print("Segments:",len(r["regions"]))'
          fi
          echo "Live step outcome: ${{ steps.live.outcome }}"
          if test -s thx02-smoke-results.jsonl; then
            python -c 'import json; p="thx02-smoke-results.jsonl"; data=[json.loads(x) for x in open(p)]; print("Predictions:", len(data)); print("Abstained:", sum(x.get("abstained", True) for x in data)); print("Errors:", sum("error" in x for x in data))'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: thx02-synthetic-smoke
          path: |
            thx02-smoke-results.jsonl
            thx02-region-smoke.json
            thx02-region-ceiling.json
          if-no-files-found: warn
          retention-days: 14

