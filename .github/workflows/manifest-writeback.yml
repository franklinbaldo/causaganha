# ============================================================================
# MANIFEST WRITE-BACK — Correct ~79K false-available rows in sync-manifest.csv
# ============================================================================
#
# Phase 1 of the consolidation plan. Corrects legacy rows where
# djen_raw='200' + djen_status='available' but no ZIP was ever uploaded
# (HTTP 200 with body "Sem comunicações" — genuinely absent).
#
# IMPORTANT: This workflow intentionally exits non-zero even on success
# so the run shows as failed and you review the logs before proceeding.
# ============================================================================

name: "Phase 1: Manifest Write-back"

on:
  push:
    branches:
      - claude/epic-clarke-9uaaQ
    paths:
      - 'scripts/manifest_writeback.py'
      - '.github/workflows/manifest-writeback.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — count corrections without writing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: manifest-writeback
  cancel-in-progress: false

jobs:
  writeback:
    name: Correct false-available rows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Download current manifest from IA
        run: |
          mkdir -p data
          curl -sSfL -o data/sync-manifest.csv \
            "https://archive.org/download/causaganha-dashboard/sync-manifest.csv"
          echo "Manifest rows: $(tail -n +2 data/sync-manifest.csv | wc -l)"

      - name: "Phase 1a: Dry run — count corrections"
        run: |
          echo "=== DRY RUN ==="
          uv run python scripts/manifest_writeback.py --dry-run

      - name: "Phase 1b: Apply corrections"
        id: writeback
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false'
        run: |
          echo "=== APPLYING CORRECTIONS ==="
          uv run python scripts/manifest_writeback.py
          echo "corrections_applied=true" >> "$GITHUB_OUTPUT"

      - name: Upload corrected manifest to IA
        if: steps.writeback.outputs.corrections_applied == 'true'
        run: |
          uv run python -c "
          import asyncio
          from pathlib import Path
          from scripts.pipeline.ia_s3 import create_upload_client, get_ia_s3_auth, upload_to_ia
          auth = get_ia_s3_auth()
          async def _upload():
              async with create_upload_client(auth) as client:
                  await upload_to_ia(client, 'causaganha-dashboard', Path('data/sync-manifest.csv'), 'manifest-writeback')
                  print('Corrected manifest uploaded to IA')
          if auth:
              asyncio.run(_upload())
          else:
              print('No IA credentials — skipping upload')
          "

      - name: Write-back summary
        if: always()
        run: |
          echo "## Phase 1: Manifest Write-back" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "**Mode: DRY RUN** (push-triggered runs are always dry-run)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To apply corrections, trigger manually with dry_run=false." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode: APPLY**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Intentional failure — review logs above
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "  INTENTIONAL FAILURE — REVIEW LOGS ABOVE"
          echo "============================================"
          echo ""
          echo "This workflow exits non-zero by design so you"
          echo "review the dry-run output before applying."
          echo ""
          echo "To apply: trigger workflow_dispatch with dry_run=false"
          exit 1
