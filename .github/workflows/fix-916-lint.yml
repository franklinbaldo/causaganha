name: Temporary lint fix 916

on:
  push:
    branches:
      - mcp/890-datajud-processo

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e450dabe0009e67214ff5f5447ce83dd
        with:
          ref: mcp/890-datajud-processo
      - uses: ./.github/actions/setup
      - name: Apply Ruff fixes
        run: |
          uv run ruff check --fix src/causaganha_mcp/tools/datajud_processo.py
          uv run ruff format src/causaganha_mcp/tools/datajud_processo.py
      - name: Commit Ruff output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causaganha_mcp/tools/datajud_processo.py
          git commit -m "style(mcp): satisfy Ruff for processo_estado"
          git push origin HEAD:mcp/890-datajud-processo
