name: Upload Backlog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-backlog
  cancel-in-progress: false

jobs:
  probe:
    name: Probe DJEN availability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Probe pending entries (URL check only, no download)
        run: uv run --no-dev djen-backup probe --workers 20 --batch-size 500 --deadline-minutes 13 --use-proxy

  drain:
    name: Drain confirmed uploads
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      IA_UPLOAD_RATE_LIMIT: "12"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Drain pending uploads (download + upload to IA)
        run: uv run --no-dev djen-backup drain --workers 8 --batch-size 200 --deadline-minutes 14 --use-proxy
