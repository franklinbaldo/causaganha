name: Upload Backlog

on:
  # DISABLED 2026-04-14: manifest data-loss incident. Re-enable after
  # sync-manifest.csv is restored + overwrite source is identified.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upload-backlog
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: dev
    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-dev djen-backup drain --workers 6 --batch-size 100 --deadline-minutes 14 --use-proxy
