# ============================================================================
# COLLECT TODAY — Download today's DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Runs once daily. Each run:
#   1. Restores state from previous runs
#   2. Processes only the current date for all tribunals
#   3. Saves state for next run
# ============================================================================

name: Collect Today

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-today
  cancel-in-progress: false

jobs:
  collect-today:
    name: Download & Upload Today's ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    env:
      DJEN_USE_PROXY: "1"
      DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - uses: ./.github/actions/download-state

      - name: Collect today
        id: collect
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Running collection for today: $TODAY"

          CMD="uv run --no-dev python -m djen_backup"
          CMD="$CMD --start-date $TODAY"
          CMD="$CMD --end-date $TODAY"
          CMD="$CMD --workers 20"
          CMD="$CMD --state-file data/ia-state.json"
          CMD="$CMD --backfill-state-file data/backfill-state.json"
          CMD="$CMD --use-proxy"
          # Skip absent markers to avoid IA spam detection
          CMD="$CMD --skip-absent-markers"
          CMD="$CMD --publish-live-status"
          CMD="$CMD --skip-if-mostly-complete"

          echo "Running: $CMD"

          START_TIME=$(date +%s)
          $CMD
          DURATION=$(($(date +%s) - START_TIME))
          echo "Collection completed in $DURATION seconds"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Resolve uploaded count
        id: resolve-uploaded
        if: success() || failure()
        run: |
          UPLOADED="${{ steps.collect.outputs.uploaded }}"
          if [ -z "$UPLOADED" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            UPLOADED=$(grep -oP '✅ Uploaded \(new\) \|\s*\*\*\K\d+' "$GITHUB_STEP_SUMMARY" || echo "")
          fi
          echo "count=${UPLOADED:-0}" >> $GITHUB_OUTPUT

      - name: Collection Summary
        if: success() || failure()
        run: |
          echo "## Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "Duration: ${{ steps.collect.outputs.duration }} seconds, ZIPs collected: ${{ steps.resolve-uploaded.outputs.count }}" >> $GITHUB_STEP_SUMMARY

      - name: Global Zero Collection Check
        if: success() || failure()
        run: |
          UPLOADED=${{ steps.resolve-uploaded.outputs.count }}
          echo "Running zero collection check for UPLOADED=$UPLOADED"
          if ! uv run --no-dev python scripts/check_zero_collection.py "$UPLOADED"; then
            echo "CRITICAL: Zero ZIPs collected on a business day!"
            exit 1
          fi
