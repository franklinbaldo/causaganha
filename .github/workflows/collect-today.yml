# ============================================================================
# COLLECT TODAY — Download today's DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Runs once daily. Processes only the current date for all tribunals.
# State persisted in sync-manifest.csv (cached between runs + uploaded to IA).
# ============================================================================

name: Collect Today

on:
  # DISABLED 2026-04-14: manifest data-loss incident. Re-enable after
  # sync-manifest.csv is restored + overwrite source is identified.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-today
  cancel-in-progress: false

jobs:
  collect-today:
    name: Download & Upload Today's ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - name: Restore manifest cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
          restore-keys: sync-manifest-

      - name: Collect today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Collecting for: $TODAY"

          uv run --no-dev djen-backup \
            --start-date "$TODAY" \
            --end-date "$TODAY" \
            --workers 20 \
            --use-proxy \
            --skip-if-mostly-complete \
            --no-fail-fast

      - name: Save manifest cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: data/sync-manifest.csv
          key: sync-manifest-${{ github.run_id }}
