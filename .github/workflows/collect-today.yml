# ============================================================================
# COLLECT TODAY — Download today's DJEN ZIPs and upload to Internet Archive
# ============================================================================
#
# Runs once daily. Processes only the current date for all tribunals.
# State is persisted in sync-manifest.csv (on IA and locally).
# ============================================================================

name: Collect Today

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-today
  cancel-in-progress: false

jobs:
  collect-today:
    name: Download & Upload Today's ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    env:
      DJEN_USE_PROXY: "1"
      DJEN_PROXY_URL: https://djen-proxy-mhgmawcn3a-rj.a.run.app
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          dev: "false"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - uses: ./.github/actions/download-state

      - name: Collect today
        id: collect
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Running collection for today: $TODAY"

          CMD="uv run --no-dev python -m djen_backup"
          CMD="$CMD --start-date $TODAY"
          CMD="$CMD --end-date $TODAY"
          CMD="$CMD --workers 20"
          CMD="$CMD --manifest-file data/sync-manifest.csv"
          CMD="$CMD --use-proxy"
          CMD="$CMD --skip-if-mostly-complete"
          CMD="$CMD --no-fail-fast"

          echo "Running: $CMD"

          START_TIME=$(date +%s)
          $CMD
          DURATION=$(($(date +%s) - START_TIME))
          echo "Collection completed in $DURATION seconds"
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Collection Summary
        if: success() || failure()
        run: |
          echo "## Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "Duration: ${{ steps.collect.outputs.duration }} seconds" >> $GITHUB_STEP_SUMMARY

      - name: Show manifest status
        if: always()
        run: |
          echo "## Manifest Status" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          uv run --no-dev causaganha backfill status --manifest-file data/sync-manifest.csv >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
