# ============================================================================
# PREPARE SEGMENTER DATA — Generate frozen artifact set for OPF training
# ============================================================================
#
# Runs the prep script (CPU, no GPU needed) to produce:
#   train.jsonl, val.jsonl, test.jsonl, label_space.json, manifest.json
#
# Validates all splits with opf_annotate.py. Uploads artifacts for offline
# GPU training (Colab / dedicated machine). Training is NOT done in CI —
# OPF's 1.5B model needs GPU + 24GB RAM, exceeding standard GHA runners.
# ============================================================================

name: Prepare Segmenter Data

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/prepare_privacy_filter_dataset.py'
      - 'scripts/opf_annotate.py'
      - 'scripts/train_decision_segmenter.py'
      - '.github/workflows/train-segmenter.yml'
      - 'data/segmenter_splits/**'
  workflow_dispatch:
    inputs:
      ia_item:
        description: 'IA item to download ZIPs from'
        required: false
        default: 'djen-tjro-2025'
      n_zips:
        description: 'Number of ZIPs to download'
        required: false
        default: '50'

permissions:
  contents: read
  actions: write

concurrency:
  group: prepare-segmenter
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare + validate segmenter data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "true"

      - name: Prepare segmenter data
        id: prep
        run: |
          set -euo pipefail
          OUTPUT_DIR="data/segmenter_v7"
          GOLD_DIR="data/segmenter_splits"

          # Gold is "complete" only when all three splits exist — the label
          # space and guideline alone are not annotated data. Gate on the
          # splits so a label-space-only push falls through instead of
          # selecting promote and failing its required-file check.
          if [ -f "$GOLD_DIR/train.jsonl" ] \
            && [ -f "$GOLD_DIR/val.jsonl" ] \
            && [ -f "$GOLD_DIR/test.jsonl" ]; then
            echo "Promoting gold splits from git"
            uv run python scripts/prepare_privacy_filter_dataset.py \
              --gold-dir "$GOLD_DIR" \
              --output-dir "$OUTPUT_DIR" \
              2>&1 | tee prep.log
            echo "prepared=true" >> "$GITHUB_OUTPUT"
            echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          elif [ -f data/test_parquets/textos.parquet ]; then
            echo "Bootstrapping from local textos.parquet"
            uv run python scripts/prepare_privacy_filter_dataset.py \
              --bootstrap \
              --parquet data/test_parquets/textos.parquet \
              --output-dir "$OUTPUT_DIR" \
              2>&1 | tee prep.log
            echo "prepared=true" >> "$GITHUB_OUTPUT"
            echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "No gold splits in $GOLD_DIR/ yet (only label_space.json/guideline) "
            echo "and no bootstrap parquet available — nothing to prepare."
            echo "Annotate via subagents and commit train/val/test.jsonl to $GOLD_DIR/ to enable."
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate all splits
        if: steps.prep.outputs.prepared == 'true'
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ steps.prep.outputs.output_dir }}"
          for split in train val test; do
            echo "Validating ${split}.jsonl..."
            uv run python scripts/opf_annotate.py validate \
              "${OUTPUT_DIR}/${split}.jsonl" \
              --label-space "${OUTPUT_DIR}/label_space.json"
          done

      - name: Data summary
        if: always()
        run: |
          OUTPUT_DIR="${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}"
          echo "## Segmenter Data Preparation" >> $GITHUB_STEP_SUMMARY

          if [ -f "${OUTPUT_DIR}/manifest.json" ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "${OUTPUT_DIR}/manifest.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "${OUTPUT_DIR}/label_space.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Label space:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat "${OUTPUT_DIR}/label_space.json" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To train on GPU, download the artifact and run:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "opf train train.jsonl --validation-dataset val.jsonl \\" >> $GITHUB_STEP_SUMMARY
          echo "  --label-space-json label_space.json --output-dir ./best" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload prepared data
        if: steps.prep.outputs.prepared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: segmenter-v7-data
          path: |
            ${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}/train.jsonl
            ${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}/val.jsonl
            ${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}/test.jsonl
            ${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}/label_space.json
            ${{ steps.prep.outputs.output_dir || 'data/segmenter_v7' }}/manifest.json
          retention-days: 30
