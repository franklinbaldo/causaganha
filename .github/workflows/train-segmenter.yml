# ============================================================================
# TRAIN SEGMENTER — Prepare data for OPF fine-tuning (20-class decision segmenter)
# ============================================================================
#
# Prepares training data (JSONL splits + label_space.json) and uploads to IA.
# Actual training requires a GPU (Colab T4+) — the 1.5B model's fp32 weights
# + AdamW optimizer states (~24GB) exceed GHA's 16GB RAM limit.
#
# Use notebooks/train_segmenter_colab.ipynb for training.
# ============================================================================

name: Prepare Segmenter Training Data

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'scripts/train_decision_segmenter.py'
      - 'scripts/prepare_privacy_filter_dataset.py'
      - '.github/workflows/train-segmenter.yml'
      - 'data/segmenter_splits/**'
  workflow_dispatch:
    inputs:
      ia_item:
        description: 'IA item to download ZIPs from'
        required: false
        default: 'djen-tjro-2025'
      n_zips:
        description: 'Number of ZIPs to download (more = better model, slower)'
        required: false
        default: '50'
      use_llm_labels:
        description: 'Use LLM-labeled training data instead of heuristic segmentation'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: train-segmenter
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare segmenter data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev

    env:
      IAS3_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup
        with:
          dev: "true"

      - uses: ./.github/actions/configure-ia
        with:
          access-key: ${{ secrets.IA_ACCESS_KEY }}
          secret-key: ${{ secrets.IA_SECRET_KEY }}

      - name: Download bootstrap intermediate from IA
        id: intermediate
        run: |
          uv pip install --python .venv/bin/python internetarchive
          INTERMEDIATE_URL="https://archive.org/download/causaganha-segmenter-data/intermediate.jsonl"
          echo "Checking for bootstrap intermediate at $INTERMEDIATE_URL..."
          if curl -sfL --head "$INTERMEDIATE_URL" >/dev/null 2>&1; then
            mkdir -p data
            curl -fL "$INTERMEDIATE_URL" -o data/intermediate.jsonl
            LINES=$(wc -l < data/intermediate.jsonl)
            echo "Downloaded intermediate.jsonl ($LINES records)"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No bootstrap intermediate found on IA — will use other data sources"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare training data
        id: prepare
        run: |
          set -euo pipefail
          USE_LLM="${{ github.event.inputs.use_llm_labels || 'true' }}"

          # Data source priority: reviewed splits > intermediate > LLM parquet > IA download
          if [ -f data/segmenter_splits/train.jsonl ]; then
            echo "Using reviewed splits (subagent-classified person spans)"
            mkdir -p models/decision_segmenter
            cp data/segmenter_splits/*.jsonl data/segmenter_splits/label_space.json models/decision_segmenter/
          elif [ "${{ steps.intermediate.outputs.available }}" = "true" ]; then
            echo "Using bootstrap intermediate (OPF + heuristic labeled)"
            uv run python scripts/train_decision_segmenter.py \
              --from-intermediate data/intermediate.jsonl \
              --output-dir models/decision_segmenter \
              --prepare-only \
              2>&1 | tee prepare.log
          elif [ "$USE_LLM" = "true" ] && [ -f data/benchmark/segmenter_training.parquet ]; then
            echo "Using LLM-labeled parquet"
            uv run python scripts/train_decision_segmenter.py \
              --labeled-parquet data/benchmark/segmenter_training.parquet \
              --output-dir models/decision_segmenter \
              --prepare-only \
              2>&1 | tee prepare.log
          else
            echo "Using heuristic-labeled data from IA"
            IA_ITEM="${{ github.event.inputs.ia_item || 'djen-tjro-2025' }}"
            N_ZIPS="${{ github.event.inputs.n_zips || '30' }}"
            uv run python scripts/train_decision_segmenter.py \
              --download-from "$IA_ITEM" \
              --n-zips "$N_ZIPS" \
              --output-dir models/decision_segmenter \
              --prepare-only \
              2>&1 | tee prepare.log
          fi

          # Count splits
          for split in train val test; do
            if [ -f "models/decision_segmenter/${split}.jsonl" ]; then
              COUNT=$(wc -l < "models/decision_segmenter/${split}.jsonl")
              echo "${split}_count=$COUNT" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "data_ready=true" >> "$GITHUB_OUTPUT"

      - name: Data Summary
        if: always()
        run: |
          echo "## Segmenter Training Data (v5 — 21 classes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f models/decision_segmenter/train.jsonl ]; then
            TRAIN="${{ steps.prepare.outputs.train_count || '?' }}"
            VAL="${{ steps.prepare.outputs.val_count || '?' }}"
            TEST="${{ steps.prepare.outputs.test_count || '?' }}"

            echo "| Split | Examples |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| train | $TRAIN |" >> $GITHUB_STEP_SUMMARY
            echo "| val   | $VAL |" >> $GITHUB_STEP_SUMMARY
            echo "| test  | $TEST |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Train on GPU with \`notebooks/train_segmenter_colab.ipynb\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Data preparation failed — check logs." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload prepared data as artifact
        if: steps.prepare.outputs.data_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: segmenter-prepared-data
          path: |
            models/decision_segmenter/train.jsonl
            models/decision_segmenter/val.jsonl
            models/decision_segmenter/test.jsonl
            models/decision_segmenter/label_space.json
          retention-days: 30

      - name: Upload training data to Internet Archive
        if: steps.prepare.outputs.data_ready == 'true'
        run: |
          tar -czf models/segmenter_training_data.tar.gz \
            -C models/decision_segmenter \
            train.jsonl val.jsonl test.jsonl label_space.json

          uv run python -c "
          import asyncio
          from pathlib import Path
          from scripts.pipeline.ia_s3 import create_upload_client, get_ia_s3_auth, upload_to_ia
          auth = get_ia_s3_auth()
          async def _upload():
              async with create_upload_client(auth) as client:
                  await upload_to_ia(client, 'causaganha-segmenter-data', Path('models/segmenter_training_data.tar.gz'), 'segmenter-training-splits')
                  print('Training splits uploaded to IA')
          if auth:
              asyncio.run(_upload())
          else:
              print('No IA credentials — skipping IA upload')
          "

      - name: Force failure for CI notification
        if: always()
        run: |
          echo "Data preparation workflow completed — failing intentionally for webhook notification."
          echo "Check the Data Summary above for results."
          exit 1
