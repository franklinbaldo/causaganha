name = "djen-scraper"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Cron: executa a cada minuto
# 50 requests/min × 60 min × 24h = 72.000 requests/dia
[triggers]
crons = ["* * * * *"]

# KV Namespace para estado
[[kv_namespaces]]
binding = "DJEN_STATE"
id = "f1ccc48302594ad4a68dc5b57885d350"

# R2 Bucket para storage de dados
[[r2_buckets]]
binding = "DJEN_STORAGE"
bucket_name = "djen-buffer"

# Variáveis de ambiente
[vars]
PROXY_URL = "https://djen-proxy-mhgmawcn3a-rj.a.run.app"

# Free tier: 10ms CPU time por invocação (automático)
